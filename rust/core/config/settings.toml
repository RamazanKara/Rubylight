description = "Lets a single frame exceed the average frame size by this much (a larger VBV). It helps busy scenes but can cause packet loss; leave it at 0 unless your network is fast and steady."
details = "400 allows frames five times the average. Drivers without a custom buffer size ignore it."
inactive_hint = "Applies when NVIDIA NVENC encodes, as Automatic does on NVIDIA graphics cards."
control = { kind = "number", min = 0, max = 400, step = 1, unit = "%" }
visible_when = { ref = "nvenc" }
console = { group = "NVIDIA encoding", label = "Frame size headroom (%)", control = "number" }

