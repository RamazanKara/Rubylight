[package]
name = "nightjar-core"
description = "Nightjar's client streaming engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rubylight-protocol = { path = "../core" }
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
rusty_enet = "0.4"
# Host HTTP, pairing and encrypted RTSP. Pure Rust plus ring, so the same code builds for
# Android, Windows and Linux without OpenSSL.
rand_core = { version = "0.6", features = ["getrandom"] }
ring = "0.17"
rsa = { version = "0.9", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Receive buffer sizes on the media sockets.
socket2 = "0.5"

[dev-dependencies]
# The Rubylight host's protocol code, for interop tests (control, input, SDP, DESCRIBE, pairing).
butterpollo-core = { git = "https://github.com/RamazanKara/Rubylight", rev = "a6775a0b3f8036b3cbece4eadbba619799933dec", package = "butterpollo-core" }
