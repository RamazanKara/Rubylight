[package]
name = "butterpollo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", features = ["oid"] }
aes = "0.8"
aes-gcm = "0.10"
ring = "0.17"
cbc = { version = "0.1", features = ["alloc"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
rand = "0.8"
hex = "0.4"
subtle = "2.6"
zeroize = "1.8"
pem = "3.0"
x509-parser = "0.18"
time = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }
crc32fast = "1.5"
# Wire formats shared with the Android client; pinned to the commit the client ships.
rubylight-protocol = { git = "https://github.com/RamazanKara/rubylight-android", rev = "9bd9b9bd8a2336f26725b7a4fea2227a264f0b71", package = "rubylight-protocol" }
regex = "1.12"
quick-xml = { version = "0.42", features = ["serialize"] }
prost = "0.14"
rubylight-native-api = { path = "native-api" }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
tempfile = "3.23"

[lints]
workspace = true
