[package]
name = "nightjar-core"
description = "Nightjar's client streaming engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rubylight-protocol = { path = "../core" }
# Host HTTP, pairing and encrypted RTSP. Pure Rust plus ring, so the same code builds for
# Android, Windows and Linux without OpenSSL.
aes = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
ring = "0.17"
rsa = { version = "0.9", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
# The Rubylight host's protocol code, for interop tests (SDP negotiation, DESCRIBE, pairing).
butterpollo-core = { git = "https://github.com/RamazanKara/Rubylight", rev = "21c2940f", package = "butterpollo-core" }
