description = "What the stream does once the app’s window has closed and no other appeared within 5 seconds: keep showing the display, or end the stream."
details = "The stream ends anyway when the window’s process exits. A window that comes back is streamed again."
control = { kind = "select", options = [{ value = "display", label = "Show the display" }, { value = "end", label = "End the stream" }] }
aliases = { match = "case", spellings = { stop = "end", quit = "end" } }
visible_when = { ref = "streamsWindow" }
doc_summary = "What the stream does once the app’s window has closed and no other appeared within 5 seconds. The stream ends anyway when the window’s process exits."

