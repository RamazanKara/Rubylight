default = false
category = "library"
group = "App behavior"
label = "Quit the game on the first request"
description = "Lets another device quit the running game with its first request. Leave it off: it must then ask again within 60 seconds, and the device that started the game is never asked twice."
control = { kind = "toggle" }
console = { group = "Remote monitors", label = "Replace the current game on the first monitor request", control = "bool" }

[[setting]]
