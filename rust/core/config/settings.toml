details = "Virtual-display streams, unless Virtual display refresh is off, and frame-generation games on a monitor use NVIDIA Reflex when this PC streams with an NVIDIA GPU, and front edge sync otherwise. NVIDIA Reflex needs an NVIDIA GPU; on other GPUs it limits with front edge sync."
inactive_hint = "Choose Automatic or RTSS under Limiter to use RTSS settings. RTSS must be installed on this PC."
control = { kind = "select", options = [{ value = "async", label = "Asynchronous" }, { value = "front edge sync", label = "Front edge sync" }, { value = "back edge sync", label = "Back edge sync" }, { value = "nvidia reflex", label = "NVIDIA Reflex (NVIDIA GPUs only)" }] }
aliases = { match = "letters" }
visible_when = { ref = "rtss" }
caution_when = { ref = "rtssReflexCaution" }
doc_summary = "How RTSS paces frames. Some streams use front edge sync instead."
console = { group = "Frame generation and limiting", label = "RTSS limiter mode", control = "choice", choices = ["async", "front-edge-sync", "back-edge-sync", "nvidia-reflex"] }

[[setting]]
