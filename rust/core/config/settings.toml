[[setting]]
key = "gamepad"
part = "basics_io"
type = "enum"
default = "auto"
override_allowed = true
category = "input"
group = "Controllers"
label = "Controller type"
description = "The virtual controller games see. Leave it on Automatic, which matches each device's controller, unless a game needs a certain type; USB/IP and ViGEmBus types need a driver."
details = "A type chosen here is used for all connected controllers; a device can set its own type in Devices, which wins over this one. A game that understands only Xbox controllers cannot see a DualSense. Some games read the controller's name and can treat the DualSense as an unknown controller, so the camera or cursor can drift with no input; for such a game choose DualSense with waveform haptics (USB/IP) or Xbox Series. The DualSense USB/IP option and Switch 2 Pro (USB/IP) require usbip-win2. Xbox 360 (ViGEmBus) and DualShock 4 (ViGEmBus) need ViGEmBus installed separately, for tools such as reWASD that may not see the other types; the DualShock 4 keeps the touchpad, motion, battery and lightbar. Without ViGEmBus, controllers stop working and the stream says why. Automatic picks DualSense, with adaptive triggers, for PlayStation, Switch Pro for Nintendo, and Xbox Series otherwise, or DualSense when the motion or touchpad options below select it; Nightjar's on-screen Steam Controller controls get a Steam Controller when the stream's app starts through Steam (Steam Big Picture, a steam:// link, steam.exe or a Steam library game), Steam was running as they connected and the gamepad driver has one; any other app, the Desktop included, keeps the Xbox-type pad. Waveform-capable DualSense clients use native USB audio haptics when usbip-win2 is installed on the host. The DualSense USB/IP option exposes a DualSense audio device and Sony's USB identity, works with any client, and needs no waveform-capable client for ordinary rumble and adaptive triggers. A client's Switch 2 Pro Controller arrives as a Switch 2 Pro Controller with its C button, grip buttons, motion, rumble and battery when usbip-win2 is installed, and as Switch Pro otherwise; Switch 2 Pro (USB/IP) gives every controller one. Steam Controller presents a 2026 Steam Controller with both trackpads, grip and stick touch, motion and a battery; a client that has the real controller also gets Steam's pad haptics and settings, and others get rumble. Steam stable can list a virtual Xbox controller twice; the Steam beta lists it once."
inactive_hint = "Turn on Controllers under Input devices to use this setting. Paired devices also need the Controllers permission."
control = { kind = "select", options = [{ value = "auto", label = "Automatic" }, { value = "vhf_xbox", label = "Xbox Series" }, { value = "vhf_xbox_one", label = "Xbox One" }, { value = "vhf_ds4", label = "DualShock 4" }, { value = "vhf_ds5", label = "DualSense" }, { value = "usbip_ds5", label = "DualSense with waveform haptics (USB/IP)" }, { value = "usbip_switch2", label = "Switch 2 Pro (USB/IP)" }, { value = "vhf_switch", label = "Switch Pro" }, { value = "vhf_steam", label = "Steam Controller" }, { value = "vigem_x360", label = "Xbox 360 (ViGEmBus)" }, { value = "vigem_ds4", label = "DualShock 4 (ViGEmBus)" }] }
aliases = { spellings = { x360 = "vhf_xbox_one", ds4 = "vhf_ds4", ds5 = "vhf_ds5", vhf = "auto" } }
visible_when = { ref = "controllerOn" }
doc_summary = "The virtual controller this PC uses. Automatic matches each device's controller; choosing a type here uses it for all connected controllers. `usbip_switch2` is a Switch 2 Pro Controller over USB/IP; `vigem_x360` and `vigem_ds4` are USB pads on a separately installed ViGEmBus."
console = { group = "Input", label = "Controller profile (auto: DualSense for PlayStation-type or motion/touchpad, Switch 2 Pro over USB/IP for a Switch 2 Pro Controller, Switch Pro for other Nintendo, Xbox Series otherwise)", control = "choice", choices = ["auto", "vhf_xbox", "vhf_xbox_one", "vhf_ds4", "vhf_ds5", "usbip_ds5", "usbip_switch2", "vhf_switch", "vhf_steam", "vigem_x360", "vigem_ds4"] }

