details = "Those streams otherwise use NVIDIA Reflex when this PC streams with an NVIDIA GPU, and front edge sync on other GPUs. Apps set to game-provided frame generation keep that mode, because other modes can add a lot of latency there."
inactive_hint = "Choose Automatic or RTSS under Limiter to use RTSS settings. RTSS must be installed on this PC."
control = { kind = "toggle" }
visible_when = { ref = "rtss" }
console = { group = "Frame generation and limiting", label = "Allow virtual display limiter overrides", control = "bool" }

