[[setting]]
key = "updates"
part = "basics_core"
type = "enum"
default = "tell_me"
tier = "home"
category = "general"
group = "Updates"
label = "Updates"
description = "Tell me checks for new releases and lets you know. Install automatically also installs one when nothing is streaming."
details = "Off stops the checks, so only Check now finds updates. Installing automatically requires the Windows service. Only verified releases are downloaded. They install after one minute without streams, pending connections or running apps. Check now under Updates works at any time, even with checks off."
control = { kind = "select", options = [{ value = "off", label = "Off" }, { value = "tell_me", label = "Tell me" }, { value = "install", label = "Install automatically" }] }
