[[setting]]
key = "stream_preset"
part = "video_stream"
type = "enum"
default = "balanced"
override_allowed = true
tier = "home"
category = "video"
group = "Preset"
label = "Stream preset"
description = "One choice for encoder speed against picture quality. Balanced suits almost everyone; settings you change below always win."
details = "Balanced is Rubylight's defaults. Lowest latency limits every frame, recovery keyframes (full pictures the stream restarts from after loss) included, to one frame's share of the bitrate, and asks NVENC to split HEVC and AV1 frames across its engines where supported. Reference quality leaves recovery keyframes unlimited, which suits a fast, steady link. No preset changes the rate control. Most values come from our own measurements; the NVIDIA split mode follows NVIDIA's documentation and other hosts' defaults. A device or an app can choose its own preset."
control = { kind = "select", options_ref = "stream_presets" }
aliases = { match = "dash" }
console = { group = "Video and capture", label = "Stream preset", control = "choice", choices = ["lowest_latency", "balanced", "reference"] }

[[setting]]
key = "capture"
part = "video_stream"
type = "enum"
default = "auto"
override_allowed = true
category = "video"
group = "Capture"
label = "Capture method"
description = "Automatic suits almost everyone, with Desktop Duplication when needed. Constant rate keeps a slow game at its full rate, spending bitrate."
details = "Direct driver push receives frames from Rubylight's own virtual display driver, with no capture copy. If unavailable, it falls back to Windows Graphics Capture, then Desktop Duplication if needed. Choosing Windows Graphics Capture or Desktop Duplication bypasses driver push. On Automatic only, a streamed display whose Windows Graphics Capture sends no picture for 2 seconds while an exclusive-fullscreen app is in front switches to Desktop Duplication for the rest of that session: timing and HDR can differ, and a turned monitor or a display another GPU drives stays on Windows Graphics Capture. A named method is never changed, so choosing Windows Graphics Capture is how you compare the two across reconnects. Constant rate captures with Windows Graphics Capture and publishes a picture every stream frame: a 90 fps game on a 180 fps stream keeps a full 180 frames a second instead of the encoder repeating a still picture between the game’s frames, and a new game frame is never held back for its slot. Every repeat is encoded like any frame, so the stream spends its bitrate between the game’s frames too, and the still-picture resend rate no longer decides those frames; on a mostly still picture leave it off. Use it when a game is capped below the stream’s frame rate. It also applies to the launched app’s window, which Windows Graphics Capture streams and which never falls back to Desktop Duplication; on a display, Desktop Duplication takes over when Windows Graphics Capture is unavailable and keeps the same rate. Automatic and Windows Graphics Capture stay variable-rate, and a configuration that already says `capture = wgcc` selects this mode. AMD Direct Capture reads the Radeon driver's presented picture on a display connected to a Radeon; without it, capture falls back to Windows Graphics Capture with a warning. Automatic never selects it. No method streams frame generation's extra frames, such as AMD Fluid Motion Frames."
control = { kind = "select", options = [{ value = "auto", label = "Automatic" }, { value = "idd-push", label = "Direct driver push" }, { value = "ddx", label = "Desktop Duplication" }, { value = "wgc", label = "Windows Graphics Capture" }, { value = "wgcc", label = "Windows Graphics Capture, constant rate" }, { value = "amd", label = "AMD Direct Capture" }] }
aliases = { match = "case", spellings = { dxgi = "ddx" } }
doc_summary = "Automatic uses direct driver push on Rubylight virtual displays and Windows Graphics Capture on other displays, with Desktop Duplication when Windows Graphics Capture is unavailable or cannot see an exclusive-fullscreen app (the rest of that session stays on Desktop Duplication). Constant rate (`wgcc`) captures with Windows Graphics Capture and sends the last picture again whenever the game has none ready for a stream frame, so a game capped below the stream's frame rate keeps one frame per stream frame; every repeat is encoded like any frame. AMD Direct Capture (`amd`) reads the Radeon driver's presented picture and falls back to Windows Graphics Capture; frame generation's extra frames are not streamed by any method."

[[setting]]
key = "capture_window"
part = "video_stream"
type = "enum"
default = "display"
override_allowed = true
category = "video"
group = "Capture"
label = "What to stream"
description = "Streams the whole display, or only the launched app’s window. Leave it on The display unless you want one app alone in the stream; apps and devices can choose their own."
details = "While the window is minimised, before it appears, or after it closes, the stream shows the display and the device says why. The app’s window is found among the programs the app started, or by the program name and title an app sets. It keeps its shape, with black bars if needed, and mouse and touch input land on the window. Windows Graphics Capture captures the window, whatever the capture method."
control = { kind = "select", options = [{ value = "display", label = "The display" }, { value = "window", label = "The app’s window" }] }
aliases = { match = "case", spellings = { 1 = "window", app = "window", true = "window", on = "window", yes = "window", enabled = "window" } }
doc_summary = "The display, or only the launched app’s window. Apps and devices can choose their own. See [The app's window in place of a display](#the-apps-window-in-place-of-a-display)."

[[setting]]
key = "capture_window_closed"
part = "video_stream"
type = "enum"
default = "display"
override_allowed = true
category = "video"
group = "Capture"
