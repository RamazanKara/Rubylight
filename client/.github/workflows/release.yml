name: Release

# A pushed v* tag builds the signed release APKs and bundle and the desktop client
# (Windows zip and installer for x86_64 and ARM64; Linux tar.gz, .deb, .rpm, AppImage and Flatpak for x86_64 and aarch64;
# macOS zip for Apple Silicon and Intel) and attaches them to the
# GitHub release for that tag
# (created here when it does not exist yet). The desktop jobs and the signed Android build run
# side by side, and the release job publishes only once all of them passed, so a tag publishes
# everything or nothing.
# Main's own CI (android.yml) already tested the commit: tag a commit whose
# main run is green. The signing key and passwords are repository secrets,
# see "Releasing from CI" in docs/building.md.
#
# Run it by hand with dry_run (the default) to build and verify without
# publishing; this is the first step before a real tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -e -o pipefail

jobs:
  preflight:
    # Seconds, not an hour: a tag that does not match versionName fails here, before the
    # desktop builds start. The release job checks it again next to the signing steps.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: app/build.gradle
          sparse-checkout-cone-mode: false
      - name: Check the tag against the app version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::no versionName in app/build.gradle"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName \"$version\" in app/build.gradle"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  desktop-linux:
    # The Linux desktop client: protocol/desktop/package-linux.sh builds it (SDL3 from
    # source, linked statically; the decode-only FFmpeg of protocol/desktop/ffmpeg-decode-only.sh,
    # shipped in lib/ so the machine's own FFmpeg does not matter) and packs
    # nightjar-desktop-<version>-linux-<arch>.tar.gz; packaging/linux/build-packages.sh makes the
    # .deb, .rpm and AppImage from that archive, and each is installed and started here. A fixed
    # Ubuntu, the oldest LTS still in standard support: the glibc it builds against is the
    # packages' floor (2.35), the AppImage catalog tests on it, and the .deb's dependency names are
    # read off it. Its dav1d, NVIDIA and Vulkan headers are too old for FFmpeg 9, so
    # ffmpeg-deps-linux.sh provides all three, and its cmake is too old for the PyroWave SDK (3.27): the runner's newer one builds.
    # Both architectures build natively, each with the same steps and start checks. The packaging
    # tools' hashes are the ones GitHub lists for each architecture's assets.
    needs: preflight
    # An aarch64 failure shows as a failed leg and a warning at the release; x86_64, Windows and
    # Android still ship.
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            nfpm_asset: x86_64
            nfpm_sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            appimage_runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - arch: aarch64
            runner: ubuntu-22.04-arm
            nfpm_asset: arm64
            nfpm_sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            appimage_runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      # The Rubylight commit whose rust/codec-patches/pyrowave and rust/tools/build_pyrowave.sh
      # the PyroWave SDK build reads (patch 0002); a bump is a deliberate commit here.
      RUBYLIGHT_SHA: 957ace5a9cdb14b5f39cffbe662f0df1dcb41caf
      FFMPEG_VERSION: 9.0.2
      FFMPEG_SHA256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e
      NJ_ARCH: ${{ matrix.arch }}
      # The packaging tools, pinned by version and SHA-256.
      NFPM_VERSION: 2.48.0
      NFPM_ASSET: ${{ matrix.nfpm_asset }}
      NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
      APPIMAGETOOL_VERSION: 1.9.1
      APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
      APPIMAGE_RUNTIME_VERSION: '20251108'
      APPIMAGE_RUNTIME_SHA256: ${{ matrix.appimage_runtime_sha256 }}
      # The clean distribution the .rpm and the AppImage are installed and started in, pinned by
      # the digest of its image index.
      FEDORA_IMAGE: fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814
      # A clean Ubuntu for the .deb's start check (the runner has most libraries installed already).
      UBUNTU_IMAGE: ubuntu:24.04@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c
      # The runner's Ubuntu, clean, as the AppImage catalog tests on it: the AppImage must start there.
      UBUNTU_OLDEST_IMAGE: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # SDL with the Vulkan interop patch (protocol/vendor/sdl3-src/README.md).
      - name: SDL source
        run: git submodule update --init --depth 1 protocol/vendor/sdl3-src/SDL
      # patch 0002 and the Windows build script live in the public Rubylight repo; the SDK build
      # (scripts/build-pyrowave-sdk.*, protocol/desktop/pyrowave-sdk.pin) needs only those files.
      - name: Rubylight host files for the PyroWave SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: RamazanKara/Rubylight
          ref: ${{ env.RUBYLIGHT_SHA }}
          path: rubylight-host
          sparse-checkout: |
            rust/tools/build_pyrowave.sh
            rust/codec-patches/pyrowave
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Install the build packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends meson ninja-build pkg-config libclang-dev \
            nasm patch libopus-dev libva-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libegl-dev libgl-dev libgles-dev libdrm-dev libgbm-dev libpulse-dev \
            libasound2-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libdecor-0-dev \
            libvulkan-dev
      # Dry runs on main use and save the build caches. A tag run (the release itself) neither
      # restores nor saves the target, FFmpeg or SDK caches: it rebuilds them, so nothing a
      # branch run cached can end up in a published package. Only the downloaded crates
      # (~/.cargo/registry, checked by Cargo.lock) are restored.
      # The cached FFmpeg and its dav1d, the PyroWave SDK and the target (SDL3's C objects) are
      # built against this image's glibc and libraries: every such cache is keyed by the image and
      # the architecture.
      - name: Runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Decode-only FFmpeg cache
        id: ffmpeg-cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffprefix
          key: ffmpeg-decode-only-linux-${{ matrix.arch }}-${{ steps.image.outputs.os }}-${{ env.FFMPEG_VERSION }}-${{ env.FFMPEG_SHA256 }}-${{ hashFiles('protocol/desktop/ffmpeg-decode-only.sh', 'protocol/desktop/ffmpeg-deps-linux.sh', 'protocol/desktop/ffmpeg-patches/*.patch') }}
      - name: Build the decode-only FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        # Downloads retry for about 5 minutes: on 2026-11-08 ffmpeg.org and GitHub release
        # assets answered the runners with 504s long enough to fail the 4.10.0 tag run.
        run: |
          curl -sSLf --retry 10 --retry-delay 30 --retry-all-errors -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c -
          tar -xf ffmpeg.tar.xz
          bash protocol/desktop/ffmpeg-deps-linux.sh "$RUNNER_TEMP/ffdeps"
          PKG_CONFIG_PATH="$RUNNER_TEMP/ffdeps/lib/pkgconfig" bash protocol/desktop/ffmpeg-decode-only.sh "$PWD/ffmpeg-$FFMPEG_VERSION" "$PWD/ffprefix"
      - name: Check the FFmpeg source note
        run: |
          grep -qx "SHA-256: $FFMPEG_SHA256" ffprefix/licenses-ffmpeg/SOURCE.txt || { echo "::error::ffprefix/licenses-ffmpeg/SOURCE.txt has no SHA-256 $FFMPEG_SHA256"; exit 1; }
      - name: Check V4L2 P010 against a fake decoder
        run: bash protocol/desktop/ffmpeg-patches/test-v4l2-p010.sh ffprefix
      - name: PyroWave SDK cache
        id: sdk-cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pyrowave-sdk/libpyrowave-shared.so
            pyrowave-sdk/build-info.txt
            pyrowave-sdk/licenses
          key: pyrowave-sdk-linux-${{ matrix.arch }}-${{ steps.image.outputs.os }}-${{ env.RUBYLIGHT_SHA }}-${{ hashFiles('protocol/desktop/pyrowave-sdk.pin', 'scripts/build-pyrowave-sdk.sh', 'app/src/main/jni/pyrowave-renderer/patches/*.patch') }}
      - name: Build the PyroWave SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-pyrowave-sdk.sh -o "$GITHUB_WORKSPACE/pyrowave-sdk" -H "$GITHUB_WORKSPACE/rubylight-host"
      - name: Rust version
        id: rustc
        run: echo "version=$(rustc -V | tr ' ()' '---')" >> "$GITHUB_OUTPUT"
      - name: Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-linux-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: cargo-registry-linux-
      - name: Cargo target cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: protocol/target
          key: desktop-linux-${{ matrix.arch }}-${{ steps.image.outputs.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: desktop-linux-${{ matrix.arch }}-${{ steps.image.outputs.os }}-${{ steps.rustc.outputs.version }}-
      # package-linux.sh checks the SDK against the pin, then runs the unpacked archive as
      # `nightjar --check-pyrowave`: the library must load (a runner has no Vulkan device). It also
      # fails when the unpacked executable loads an FFmpeg library from outside the archive.
      - name: Build and package
        run: bash protocol/desktop/package-linux.sh -f "$GITHUB_WORKSPACE/ffprefix" -s "$GITHUB_WORKSPACE/pyrowave-sdk" -v "$VERSION" -o "$GITHUB_WORKSPACE/dist"
      - name: Check the package
        run: |
          name="nightjar-desktop-$VERSION-linux-$NJ_ARCH"
          tar -tzf "dist/$name.tar.gz" | tee contents.txt
          for file in nightjar README.md LINUX-RUNTIME.txt libpyrowave-shared.so pyrowave-sdk-build-info.txt licenses-pyrowave/LICENSE \
              licenses-ffmpeg/COPYING.LGPLv2.1 licenses-ffmpeg/SOURCE.txt licenses-dav1d/COPYING; do
            grep -qx "$name/$file" contents.txt || { echo "::error::$name.tar.gz has no $file"; exit 1; }
          done
          # The versioned names (libavcodec.so.62...) vary with the FFmpeg version: match the prefix.
          for file in lib/libavcodec.so lib/libavutil.so lib/libdav1d.so; do
            grep -Eq "^$name/$file\." contents.txt || { echo "::error::$name.tar.gz has no $file"; exit 1; }
          done
          # No FFmpeg library may resolve outside the unpacked archive, and none may be missing.
          mkdir unpacked && tar -C unpacked -xzf "dist/$name.tar.gz"
          ldd "unpacked/$name/nightjar" | tee ldd.txt
          ! grep 'not found' ldd.txt || { echo "::error::nightjar has libraries that are not found"; exit 1; }
          for lib in libavcodec libavformat libavutil libswscale libswresample libdav1d; do
            ! grep -E "^[[:space:]]*$lib\.so" ldd.txt | grep -v " => $PWD/unpacked/$name/lib/" | grep . || { echo "::error::$lib resolves outside the package"; exit 1; }
          done
          grep -Eq "libavcodec\.so.* => $PWD/unpacked/$name/lib/" ldd.txt || { echo "::error::libavcodec is not the packaged one"; exit 1; }
          tar -xzOf "dist/$name.tar.gz" "$name/LINUX-RUNTIME.txt"
          grep -qx "$name/share/applications/io.github.ramazankara.nightjar.desktop" contents.txt || { echo "::error::$name.tar.gz has no desktop entry"; exit 1; }
      - name: Packaging tools
        run: |
          tools="$RUNNER_TEMP/packaging-tools"
          mkdir -p "$tools"
          cd "$tools"
          curl -sSLf --retry 10 --retry-delay 30 --retry-all-errors -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_$NFPM_ASSET.tar.gz"
          curl -sSLf --retry 10 --retry-delay 30 --retry-all-errors -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-$NJ_ARCH.AppImage"
          curl -sSLf --retry 10 --retry-delay 30 --retry-all-errors -o appimage-runtime "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-$NJ_ARCH"
          printf '%s  %s\n' "$NFPM_SHA256" nfpm.tar.gz "$APPIMAGETOOL_SHA256" appimagetool "$APPIMAGE_RUNTIME_SHA256" appimage-runtime | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm
          chmod +x nfpm appimagetool
      # Made from the tar.gz above, so they carry its files. The runner has no FUSE for
      # appimagetool (an AppImage itself): it runs extracted.
      - name: Build the .deb, .rpm and AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          tools="$RUNNER_TEMP/packaging-tools"
          bash protocol/desktop/packaging/linux/build-packages.sh -n "$tools/nfpm" -a "$tools/appimagetool" -r "$tools/appimage-runtime" \
            "dist/nightjar-desktop-$VERSION-linux-$NJ_ARCH.tar.gz"
      # Each package installs, answers --version (no window needed) and uninstalls without
      # leftovers: the .deb on this Ubuntu runner, the .rpm in a clean Fedora. The AppImage runs in
      # a Fedora of its own without libva and libdrm, and in a clean Ubuntu 22.04 without libva, the
      # AppImage catalog's test system (it carries libopus, and libva and libdrm as fallbacks), and
      # opens its window in both with only ALSA and X11 added; removing the .rpm would also have
      # removed the libraries the .rpm pulled in.
      # --version returns before SDL starts, so the .deb and the .rpm must also name the libraries
      # SDL cannot start without, and each opens its launcher window under Xvfb (check-start.sh) in
      # a clean container holding only the package and its hard dependencies (no recommends, no
      # weak dependencies).
      - name: Install, start and remove the packages
        run: |
          name="nightjar-desktop-$VERSION-linux-$NJ_ARCH"
          depends=$(dpkg-deb -f "dist/$name.deb" Depends)
          for pkg in libasound2t64 libx11-6 libxext6; do
            grep -Eq "(^|, )$pkg( |,|$)" <<<"$depends" || { echo "::error::the .deb does not depend on $pkg: $depends"; exit 1; }
          done
          docker run --rm -e name="$name" -v "$PWD/dist:/dist:ro" -v "$PWD/protocol/desktop/packaging/linux/check-start.sh:/check-start.sh:ro" "$UBUNTU_IMAGE" bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends "/dist/$name.deb" >/dev/null
            apt-get install -y -qq --no-install-recommends xvfb x11-utils libgl1-mesa-dri libegl1 libgl1 >/dev/null
            bash /check-start.sh nightjar
            echo "ubuntu: the .deb starts"'
          sudo apt-get install -y -qq "./dist/$name.deb"
          printed=$(nightjar --version)
          test "$printed" = "Nightjar $VERSION" || { echo "::error::the .deb's nightjar --version printed '$printed'"; exit 1; }
          test -s /usr/share/applications/io.github.ramazankara.nightjar.desktop || { echo "::error::the .deb has no desktop entry"; exit 1; }
          test -s /usr/share/icons/hicolor/256x256/apps/io.github.ramazankara.nightjar.png || { echo "::error::the .deb has no icon"; exit 1; }
          sudo apt-get remove -y -qq nightjar
          if test -e /opt/nightjar || test -e /usr/bin/nightjar; then echo "::error::removing the .deb left files behind"; exit 1; fi
          appimage="nightjar-desktop-$VERSION-$NJ_ARCH.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 "./dist/$appimage" --version | grep -qx "Nightjar $VERSION" || { echo "::error::the AppImage does not start"; exit 1; }
          docker run --rm -e VERSION -e name="$name" -v "$PWD/dist:/dist:ro" -v "$PWD/protocol/desktop/packaging/linux/check-start.sh:/check-start.sh:ro" "$FEDORA_IMAGE" bash -euo pipefail -c '
            requires=$(rpm -qp --requires "/dist/$name.rpm")
            for lib in "libasound.so.2()(64bit)" "libX11.so.6()(64bit)" "libXext.so.6()(64bit)"; do
              grep -Fxq "$lib" <<<"$requires" || { echo "the .rpm does not require $lib"; exit 1; }
            done
            dnf install -y -q --setopt=install_weak_deps=False "/dist/$name.rpm"
            test "$(nightjar --version)" = "Nightjar $VERSION"
            test -s /usr/share/applications/io.github.ramazankara.nightjar.desktop
            dnf install -y -q --setopt=install_weak_deps=False xorg-x11-server-Xvfb xwininfo xprop mesa-dri-drivers mesa-libEGL mesa-libGL
            bash /check-start.sh nightjar
            dnf remove -y -q nightjar
            if test -e /opt/nightjar || test -e /usr/bin/nightjar; then echo "removing the .rpm left files behind"; exit 1; fi
            echo "fedora: .rpm passed"'
          docker run --rm -e VERSION -e appimage="$appimage" -v "$PWD/dist:/dist:ro" -v "$PWD/protocol/desktop/packaging/linux/check-start.sh:/check-start.sh:ro" "$FEDORA_IMAGE" bash -euo pipefail -c '
            if rpm -q libva libdrm; then echo "the Fedora image already has libva or libdrm"; exit 1; fi
            export APPIMAGE_EXTRACT_AND_RUN=1
            cd /tmp && "/dist/$appimage" --version | grep -qx "Nightjar $VERSION"
            dnf install -y -q --setopt=install_weak_deps=False alsa-lib libX11 libXext xorg-x11-server-Xvfb xwininfo xprop mesa-dri-drivers mesa-libEGL mesa-libGL
            if rpm -q libva; then echo "the window check would not use the fallback libva"; exit 1; fi
            bash /check-start.sh "/dist/$appimage"
            echo "fedora: AppImage passed"'
          docker run --rm -e VERSION -e appimage="$appimage" -v "$PWD/dist:/dist:ro" -v "$PWD/protocol/desktop/packaging/linux/check-start.sh:/check-start.sh:ro" "$UBUNTU_OLDEST_IMAGE" bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive APPIMAGE_EXTRACT_AND_RUN=1
            cd /tmp && "/dist/$appimage" --version | grep -qx "Nightjar $VERSION"
            # The PyroWave SDK must load with the stock libstdc++ (2 = loaded, no Vulkan device):
            # the runner has a newer one, and a missing PyroWave only hides the decoder.
            code=0; "/dist/$appimage" --check-pyrowave /tmp/pyrowave.txt || code=$?
            if [ "$code" != 0 ] && [ "$code" != 2 ]; then cat /tmp/pyrowave.txt; echo "the PyroWave SDK does not load on Ubuntu 22.04"; exit 1; fi
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends libasound2 libx11-6 libxext6 xvfb x11-utils libgl1-mesa-dri libegl1 libgl1 >/dev/null
            if dpkg -s libva2 >/dev/null 2>&1; then echo "the window check would not use the fallback libva"; exit 1; fi
            bash /check-start.sh "/dist/$appimage"
            echo "ubuntu 22.04: AppImage passed"'
      # The Flatpak bundle (Steam Deck and other handhelds; packaging/linux/flatpak) from the same
      # tar.gz on the freedesktop runtime (the manifest's runtime-version) from Flathub, installed, started and removed in a
      # clean Fedora (privileged: bubblewrap needs its namespaces there).
      - name: Build the Flatpak bundle
        run: |
          sudo apt-get install -y -qq --no-install-recommends flatpak flatpak-builder >/dev/null
          bash protocol/desktop/packaging/linux/flatpak/build-bundle.sh "dist/nightjar-desktop-$VERSION-linux-$NJ_ARCH.tar.gz"
      - name: Install and start the Flatpak bundle
        run: |
          docker run --rm --privileged -e VERSION -v "$PWD/dist:/dist:ro" -v "$PWD/protocol/desktop/packaging/linux:/linux:ro" "$FEDORA_IMAGE" \
            bash /linux/flatpak/check-bundle.sh "/dist/nightjar-desktop-$VERSION-$NJ_ARCH.flatpak" "$VERSION" /linux/check-start.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.flatpak
          if-no-files-found: error

  desktop-windows:
    # The Windows desktop client: GNU toolchain, SDL3 and Opus from MSYS2, and the
    # decode-only FFmpeg (protocol/desktop/ffmpeg-decode-only.sh), so the zip holds a few
    # DLLs instead of MSYS2's 80. package-windows.ps1 walks the import tables, fails when a
    # non-system DLL would be missing from the zip, and starts the unpacked exe once.
    # packaging/windows/build-installer.ps1 makes the installer from the zip, installs it, starts
    # it and uninstalls it again.
    # Each architecture builds natively on its own runner, so everything above also runs on it:
    # x86_64 with the runner's MSYS2 (UCRT64, gcc) and Rust's GNU toolchain, ARM64 (Snapdragon X
    # and other Windows on Arm PCs) with MSYS2's CLANGARM64 (clang, libc++) and Rust's gnullvm.
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            msystem: UCRT64
            rust: stable-x86_64-pc-windows-gnu
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            rust: stable-aarch64-pc-windows-gnullvm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      # The Rubylight commit whose rust/codec-patches/pyrowave and rust/tools/build_pyrowave.sh
      # the PyroWave SDK build reads (patch 0002); a bump is a deliberate commit here.
      RUBYLIGHT_SHA: 20dbee2b3426e1b2b7110045bcf0e711d2c52c77
      FFMPEG_VERSION: 9.0.2
      FFMPEG_SHA256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e
      # Inno Setup, pinned by version and SHA-256 (the hash GitHub lists for the asset); the
      # runner image's own copy is not used, so its version does not matter.
      INNO_SETUP_VERSION: 6.7.4
      INNO_SETUP_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c
    steps:
      # Check out with LF endings: the PyroWave patches are compared byte for byte with the
      # host's copies and applied with git, and the runner's Git defaults to autocrlf=true.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # patch 0002 and the Windows build script live in the public Rubylight repo; the SDK build
      # (scripts/build-pyrowave-sdk.*, protocol/desktop/pyrowave-sdk.pin) needs only those files.
      - name: Rubylight host files for the PyroWave SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: RamazanKara/Rubylight
          ref: ${{ env.RUBYLIGHT_SHA }}
          path: rubylight-host
          sparse-checkout: |
            rust/tools/build_pyrowave.sh
            rust/codec-patches/pyrowave
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal
          rustup default ${{ matrix.rust }}
      - name: MSYS2 packages
        if: matrix.arch == 'x86_64'
        # The runner image's own MSYS2: package-windows.ps1 looks in C:\msys64\ucrt64\bin.
        # A full upgrade (never -Sy alone, which mixes new package lists with old libraries);
        # the first run can stop after updating pacman itself, so it runs twice.
        run: |
          /c/msys64/usr/bin/pacman.exe -Syu --noconfirm
          /c/msys64/usr/bin/pacman.exe -Syu --noconfirm --needed make git patch \
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf \
            mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-opus mingw-w64-ucrt-x86_64-dav1d \
            mingw-w64-ucrt-x86_64-winpthreads
          echo "MSYS_ROOT=C:\msys64" >> "$GITHUB_ENV"
      # The ARM64 image has no MSYS2: a fresh, current one with CLANGARM64. llvm-tools has the
      # objdump package-windows.ps1 reads import tables with; libc++ and winpthreads carry the
      # licences of the runtime the PyroWave SDK links statically.
      - name: MSYS2 packages (ARM64)
        if: matrix.arch == 'arm64'
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            make
            git
            patch
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-llvm-tools
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-sdl3
            mingw-w64-clang-aarch64-opus
            mingw-w64-clang-aarch64-dav1d
            mingw-w64-clang-aarch64-libc++
            mingw-w64-clang-aarch64-libunwind
            mingw-w64-clang-aarch64-winpthreads
      - name: MSYS2 location (ARM64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: '"MSYS_ROOT=${{ steps.msys.outputs.msys2-location }}" >> $env:GITHUB_ENV'
      # Dry runs on main use and save the build caches. A tag run (the release itself) neither
      # restores nor saves the target, FFmpeg or SDK caches: it rebuilds them, so nothing a
      # branch run cached can end up in a published package. Only the downloaded crates
      # (~/.cargo/registry, checked by Cargo.lock) are restored.
      - name: Decode-only FFmpeg cache
        id: ffmpeg-cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffprefix
          key: ffmpeg-decode-only-${{ matrix.arch }}-${{ env.FFMPEG_VERSION }}-${{ env.FFMPEG_SHA256 }}-${{ hashFiles('protocol/desktop/ffmpeg-decode-only.sh', 'protocol/desktop/ffmpeg-patches/windows/*.patch') }}
      - name: Build the decode-only FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSLf --retry 10 --retry-delay 30 --retry-all-errors -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c -
          tar -xf ffmpeg.tar.xz
          # The script needs an MSYS2 UCRT64 (or CLANGARM64) shell; a login shell sets its PATH up.
          # Git Bash does not hand its environment to MSYS2's runtime: set it with MSYS2's own env
          # (FFMPEG_SHA256 too, for licenses-ffmpeg/SOURCE.txt), and pass the workspace as an
          # argument, or the login shell starts in its home directory.
          msys=$(cygpath -u "$MSYS_ROOT")
          "$msys/usr/bin/env.exe" MSYSTEM=${{ matrix.msystem }} CHERE_INVOKING=1 FFMPEG_SHA256="$FFMPEG_SHA256" "$msys/usr/bin/bash.exe" -l -c \
            'cd "$(cygpath -u "$1")" && bash protocol/desktop/ffmpeg-decode-only.sh "$PWD/ffmpeg-$2" "$PWD/ffprefix"' \
            _ "$(cygpath -w "$PWD")" "$FFMPEG_VERSION"
      # A cached prefix from before the hash reached the script would ship a source note without it.
      - name: Check the FFmpeg source note
        shell: bash
        run: |
          grep -qx "SHA-256: $FFMPEG_SHA256" ffprefix/licenses-ffmpeg/SOURCE.txt || { echo "::error::ffprefix/licenses-ffmpeg/SOURCE.txt has no SHA-256 $FFMPEG_SHA256"; exit 1; }
      - name: PyroWave SDK cache
        id: sdk-cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pyrowave-sdk/libpyrowave-shared-1.dll
            pyrowave-sdk/build-info.txt
            pyrowave-sdk/licenses
          key: pyrowave-sdk-windows-${{ matrix.arch }}-${{ env.RUBYLIGHT_SHA }}-${{ hashFiles('protocol/desktop/pyrowave-sdk.pin', 'scripts/build-pyrowave-sdk.ps1', 'app/src/main/jni/pyrowave-renderer/patches/*.patch') }}
      - name: Build the PyroWave SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: >
          ./scripts/build-pyrowave-sdk.ps1
          -Out "$env:GITHUB_WORKSPACE\pyrowave-sdk"
          -HostRepo "$env:GITHUB_WORKSPACE\rubylight-host"
          -Msys $env:MSYS_ROOT
      - name: Rust version
        id: rustc
        run: echo "version=$(rustc -V | tr ' ()' '---')" >> "$GITHUB_OUTPUT"
      - name: Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-windows-${{ matrix.arch }}-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: cargo-registry-windows-${{ matrix.arch }}-
      - name: Cargo target cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: protocol/target
          key: desktop-windows-${{ matrix.arch }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: desktop-windows-${{ matrix.arch }}-${{ steps.rustc.outputs.version }}-
      # package-windows.ps1 checks the SDK against the pin, adds its DLL to the import walk, and
      # runs the unpacked exe as `nightjar.exe --check-pyrowave` with only the Windows folders on
      # PATH: the DLL must load (a runner has no GPU, so building a decoder is not required).
      - name: Build, package and start the exe
        shell: pwsh
        run: >
          ./protocol/desktop/package-windows.ps1
          -FfmpegDir "$env:GITHUB_WORKSPACE\ffprefix"
          -PyrowaveSdkDir "$env:GITHUB_WORKSPACE\pyrowave-sdk"
          -Out "$env:GITHUB_WORKSPACE\dist"
          -TargetDirectory "$env:GITHUB_WORKSPACE\protocol\target"
          -Version $env:VERSION
          -Msys $env:MSYS_ROOT
      - name: Check the package
        run: |
          zip="dist/nightjar-desktop-$VERSION-windows-${{ matrix.arch }}.zip"
          test -f "$zip" || { echo "::error::$zip was not built"; exit 1; }
          unzip -l "$zip"
          for file in nightjar.exe libpyrowave-shared-1.dll pyrowave-sdk-build-info.txt; do
            unzip -Z1 "$zip" | grep -qx "$file" || { echo "::error::$zip has no $file"; exit 1; }
          done
          # FFmpeg's and dav1d's licences (Compress-Archive may write the folder separator as \).
          # The ARM64 exe imports LLVM's libunwind.dll, which ships with its licence.
          licences="licenses-ffmpeg/COPYING.LGPLv2.1 licenses-ffmpeg/SOURCE.txt licenses-dav1d/COPYING"
          if unzip -Z1 "$zip" | grep -qix libunwind.dll; then licences="$licences licenses-llvm/LICENSE.libunwind"; fi
          for file in $licences; do
            unzip -Z1 "$zip" | grep -Eqx "${file%%/*}[/\\]${file#*/}" || { echo "::error::$zip has no $file"; exit 1; }
          done
      - name: Inno Setup
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_SETUP_VERSION.exe"
          $tag = 'is-' + $env:INNO_SETUP_VERSION.Replace('.', '_')
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_SETUP_VERSION.exe" -OutFile $setup -MaximumRetryCount 10 -RetryIntervalSec 30
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:INNO_SETUP_SHA256) { throw "innosetup-$env:INNO_SETUP_VERSION.exe is $sha, expected $env:INNO_SETUP_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', '/NOICONS', "/DIR=`"$dir`"" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup did not install (exit $($process.ExitCode))" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV
      # From the zip above, so the installer carries its files. -Smoke installs it silently,
      # checks the files against the zip, the shortcuts and the uninstall entry, runs
      # nightjar.exe --version and uninstalls it, failing on anything left behind.
      - name: Build and check the installer
        shell: pwsh
        run: >
          ./protocol/desktop/packaging/windows/build-installer.ps1
          -Zip "$env:GITHUB_WORKSPACE\dist\nightjar-desktop-$env:VERSION-windows-${{ matrix.arch }}.zip"
          -Iscc $env:ISCC
          -Smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  desktop-macos:
    # The Mac desktop client: protocol/desktop/package-macos.py builds the release Nightjar.app
    # with its own SDL, Opus, dav1d and decode-only FFmpeg (macos-deps.sh) and zips it. Each
    # architecture builds on its own runner, so the unpacked zip is verified and launched there.
    # The app carries an ad-hoc signature only (no Developer ID, not notarized): Gatekeeper asks
    # once on first start, as protocol/desktop/README.md#macos describes.
    needs: preflight
    # A Mac failure shows as a failed leg and a warning at the release; the rest still ships.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      NJ_ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          brew install cmake meson ninja pkg-config nasm
          rustup toolchain install stable --profile minimal --no-self-update
      # The media libraries macos.yml caches on main; restored only, so a release never writes it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: protocol/target/macos-native/*/prefix
          key: macos-media-${{ runner.arch }}-${{ hashFiles('protocol/desktop/macos-deps.sh') }}
      - name: Build and zip the application
        run: python3 desktop/package-macos.py --arch "$NJ_ARCH" --zip
      - name: Verify and launch the unpacked zip
        run: |
          triple=$( [ "$NJ_ARCH" = arm64 ] && echo aarch64-apple-darwin || echo x86_64-apple-darwin )
          zip="target/$triple/release/Nightjar-$VERSION-macos-$NJ_ARCH.zip"
          test -s "$zip" || { echo "::error::$zip was not built (the app version must match $VERSION)"; exit 1; }
          ditto -x -k "$zip" "$RUNNER_TEMP/unpacked"
          python3 desktop/tests/verify_macos_bundle.py --arch "$NJ_ARCH" "$RUNNER_TEMP/unpacked/Nightjar.app"
          mkdir -p ../dist
          cp "$zip" "../dist/nightjar-desktop-$VERSION-macos-$NJ_ARCH.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  android:
    # The signed APKs and bundle, built beside the desktop jobs instead of after them (the
    # release took 37 minutes with this job waiting 25 of them).
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # The SHA-256 of the Nightjar release certificate (public). Updates only
      # work with this signing identity, so a build signed by anything else
      # must never be published.
      EXPECTED_CERT_SHA256: 312ed322c7c29d1aec4fae4a3979ebcb557af44d821d7f4746c0968548eb630b
    steps:
      - name: Check the signing secrets
        env:
          NIGHTJAR_KEYSTORE_B64: ${{ secrets.NIGHTJAR_KEYSTORE_B64 }}
          NIGHTJAR_KEYSTORE_PASSWORD: ${{ secrets.NIGHTJAR_KEYSTORE_PASSWORD }}
          NIGHTJAR_KEY_ALIAS: ${{ secrets.NIGHTJAR_KEY_ALIAS }}
          NIGHTJAR_KEY_PASSWORD: ${{ secrets.NIGHTJAR_KEY_PASSWORD }}
        run: |
          missing=
          for name in NIGHTJAR_KEYSTORE_B64 NIGHTJAR_KEYSTORE_PASSWORD NIGHTJAR_KEY_ALIAS NIGHTJAR_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions (docs/building.md, Releasing from CI), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check the tag against the app version
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::no versionName in app/build.gradle"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName \"$version\" in app/build.gradle"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Decode the keystore
        env:
          NIGHTJAR_KEYSTORE_B64: ${{ secrets.NIGHTJAR_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$NIGHTJAR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nightjar-release.keystore"
      - name: Build the signed release
        # app/build.gradle reads these four (BP_*) variables and fails the
        # release build when any is missing; it never falls back to the debug key.
        env:
          BP_KEYSTORE: ${{ runner.temp }}/nightjar-release.keystore
          BP_KEYSTORE_PASSWORD: ${{ secrets.NIGHTJAR_KEYSTORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.NIGHTJAR_KEY_ALIAS }}
          BP_KEY_PASSWORD: ${{ secrets.NIGHTJAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --max-workers=4 :app:assembleNonRootRelease :app:assembleRootRelease
          # The APK's R8 map, before the bundle's build below replaces it.
          mkdir -p "$RUNNER_TEMP/apk-mapping"
          cp app/build/outputs/mapping/nonRootRelease/mapping.txt "$RUNNER_TEMP/apk-mapping/mapping.txt"
          # The bundle is for Google Play, which updates the app itself and rejects
          # REQUEST_INSTALL_PACKAGES for self-updates: no in-app updater and no install
          # permission (verifyNonRootReleaseInstallPermission checks the merged manifest).
          bash gradlew --no-daemon --max-workers=4 -PgithubUpdates=false :app:bundleNonRootRelease
      - name: Verify the signature and the app IDs
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          # apksigner prints "Signer #1 certificate SHA-256 digest: <hex>" or, on
          # the runner, "V2 Signer: certificate SHA-256 digest: <hex>" (one line
          # per scheme: V2, V3, V3.1). Reduce them to the distinct digests; the
          # result must be exactly the expected one, so no line at all fails too.
          digests_of() { sed -n 's/^.*certificate SHA-256 digest: *//p' | tr -d '\r' | tr 'A-F' 'a-f' | sort -u; }
          check() { # apk, application ID
            "$apksigner" verify --print-certs "$1" | tee certs.txt | { grep -i 'certificate SHA-256' || true; }
            digests=$(digests_of < certs.txt)
            if [ "$digests" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$1 is signed by '$digests', not by the Nightjar release certificate"
              echo "::error::$1 is not signed by the Nightjar release certificate"
              exit 1
            fi
            package=$("$aapt2" dump packagename "$1")
            if [ "$package" != "$2" ]; then
              echo "::error::the application ID of $1 is $package, not $2"
              exit 1
            fi
          }
          check app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk com.butterpollo.client
          check app/build/outputs/apk/root/release/app-root-release.apk com.butterpollo.client.root
          # The bundle is signed like a jar. aapt2 cannot read its application ID;
          # it comes from the same nonRoot variant as the checked APK.
          bundle=app/build/outputs/bundle/nonRootRelease/app-nonRoot-release.aab
          # keytool prints "<tab> SHA256: AA:BB:..." under "Certificate fingerprints:".
          keytool -printcert -jarfile "$bundle" | tee certs.txt | { grep -E 'SHA256: ' || true; }
          fingerprints=$(sed -n 's/^[[:space:]]*SHA256: *//p' certs.txt | tr -d ':\r' | tr 'A-F' 'a-f' | sort -u)
          if [ "$fingerprints" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::$bundle is signed by '$fingerprints', not by the Nightjar release certificate"
            exit 1
          fi
      # Nothing after the build needs the key.
      - name: Remove the keystore
        run: rm -f "$RUNNER_TEMP/nightjar-release.keystore"
      - name: Collect the release files
        run: |
          mkdir android
          cp app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk "android/nightjar-$VERSION.apk"
          # Same APK under a fixed name, so .../releases/latest/download/nightjar.apk always serves
          # the newest release (the TV install link in the README and the Downloader code use it).
          cp app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk android/nightjar.apk
          cp app/build/outputs/apk/root/release/app-root-release.apk "android/nightjar-$VERSION-root.apk"
          cp app/build/outputs/bundle/nonRootRelease/app-nonRoot-release.aab "android/nightjar-$VERSION.aab"
          # R8 maps (the APK's and the Play bundle's, which differ) and native symbols of the
          # non-root build, for reading this release's crash traces.
          cp "$RUNNER_TEMP/apk-mapping/mapping.txt" "android/nightjar-$VERSION-mapping.txt"
          cp app/build/outputs/mapping/nonRootRelease/mapping.txt "android/nightjar-$VERSION-play-mapping.txt"
          cp app/build/outputs/native-debug-symbols/nonRootRelease/native-debug-symbols.zip "android/nightjar-$VERSION-native-debug-symbols.zip"
      # For the release job only: the shortest retention, so a dry run's signed build does not linger.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-release
          path: android/
          retention-days: 1
          if-no-files-found: error
      # Fallback: the keystore is already gone after the build unless a step failed.
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nightjar-release.keystore"

  release:
    needs: [preflight, desktop-linux, desktop-windows, desktop-macos, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # uploads to the release for this tag
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      # Only a tag push (or a manual run on a tag with dry_run off) publishes.
      PUBLISH: ${{ github.ref_type == 'tag' && !inputs.dry_run }}
    steps:
      - name: Fetch the desktop packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true
      - name: Fetch the signed Android build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release
          path: android
      - name: Check the desktop packages
        run: |
          for file in "desktop/nightjar-desktop-$VERSION-linux-aarch64."{tar.gz,deb,rpm} "desktop/nightjar-desktop-$VERSION-aarch64."{AppImage,flatpak}; do
            test -s "$file" || echo "::warning::$file is missing: the aarch64 leg failed, this release goes out without it"
          done
          for arch in arm64 x86_64; do
            file="desktop/nightjar-desktop-$VERSION-macos-$arch.zip"
            test -s "$file" || echo "::warning::$file is missing: the macOS $arch leg failed, this release goes out without it"
          done
          for file in "desktop/nightjar-desktop-$VERSION-linux-x86_64."{tar.gz,deb,rpm} "desktop/nightjar-desktop-$VERSION-x86_64."{AppImage,flatpak}               "desktop/nightjar-desktop-$VERSION-windows-"{x86_64,arm64}.zip "desktop/nightjar-desktop-$VERSION-windows-"{x86_64,arm64}-setup.exe; do
            test -s "$file" || { echo "::error::$file is missing from the desktop artifacts"; exit 1; }
          done
          ls -l desktop android
      - name: Publish to the release
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir out
          cp desktop/nightjar-desktop-* android/* out/
          (cd out && sha256sum nightjar-* nightjar.apk >"SHA256SUMS-$VERSION.txt")
          flags=()
          if [[ $VERSION == *-* ]]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # CI replaces assets only on a draft; a published release keeps what it has.
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ]; then
              clobber=(--clobber)
            else
              clobber=()
              existing=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
              for file in out/*; do
                if grep -qxF "$(basename "$file")" <<< "$existing"; then
                  echo "::error::$GITHUB_REF_NAME is published and already has $(basename "$file"). CI replaces assets only on a draft release: make it a draft first, or delete that asset by hand."
                  exit 1
                fi
              done
            fi
            gh release upload "$GITHUB_REF_NAME" out/* "${clobber[@]}"
            if [ "${#flags[@]}" != 0 ]; then gh release edit "$GITHUB_REF_NAME" "${flags[@]}"; fi
          else
            gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "Nightjar $VERSION" \
              --notes "The APKs are signed by CI with the Nightjar release key; the desktop packages (Windows installer and zip; Linux .deb, .rpm, AppImage, Flatpak and tar.gz; macOS zip with an ad-hoc signature, not notarized) are not signed. SHA-256 hashes of everything are in SHA256SUMS-$VERSION.txt." "${flags[@]}"
          fi
          echo "::notice::published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
      - name: Dry run result
        if: ${{ env.PUBLISH != 'true' }}
        run: echo "::notice::dry run of $VERSION built and verified (APKs, bundle, desktop client); nothing was published"
