details = "Uses ITU-R BT.2446-1 Method B for the display's peak brightness (400 to 2000 nits, 1000 when it reports none): neutral light at that peak and above is white, and 203 nits is about 86 % signal on a 1000-nit display and about 76 % on a 2000-nit one. On an RX 7900 XT it adds about 0.05 ms per 4K frame of grey content and about 0.5 ms of saturated content with the compute conversion, about 0.9 ms without it. HDR streams and SDR desktops are unaffected. A change applies from the next stream."
