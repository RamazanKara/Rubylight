[workspace]
members = ["rust/core/crypto", "rust/core/config", "rust/core/media-policy", "rust/core/input-policy", "rust/core/session", "rust/windows/abi", "rust/windows/graphics", "rust/windows/display", "rust/windows/io", "rust/host", "rust/host/stream", "rust/host/webrtc", "rust/host/web", "rust/vulkan-layer", "rust/setup", "rust/drivers/rubylight-vdisplay-proto", "rust/drivers/rubylight-vgamepad-proto", "rust/probes", "tests/host", "tests/interop"]
# The virtual display and gamepad drivers build alone under the WDK toolchain: see
# rust/drivers/rubylight-vdisplay and rust/drivers/rubylight-vgamepad.
# The Windows service is a workspace of its own, so that its executable stays the same across
# releases: see rust/service.
# Nightjar keeps its own workspace in client/protocol; the host uses its protocol crate and
# patched rusty_enet by path.
exclude = ["rust/truehdr-runtime", "rust/drivers/rubylight-vdisplay", "rust/drivers/rubylight-vgamepad", "rust/service", "client"]
resolver = "3"

# The host and Nightjar share rusty_enet, changed as its Cargo.toml lists.
[patch.crates-io]
rusty_enet = { path = "client/protocol/vendor/rusty_enet" }

[workspace.package]
version = "6.4.4"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
repository = "https://github.com/RamazanKara/Rubylight"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Tests and clippy: line tables keep file:line in panics and backtraces of our
# crates; dependencies get no debug info. A cold host test build's target dir
# went from 25 to 10 GB. CI sets CARGO_PROFILE_DEV_DEBUG=0 on top; set it to
# full for a debugger session.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Every test host makes an RSA-2048 identity; unoptimized, its prime search
# took about 2 s of each reconnect test.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# The release check's probes (rust/release/check.ps1): optimized like release, but without its
# whole-crate thin LTO in one codegen unit, which took 3.3 minutes per version bump for them.
[profile.fixture]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
