description = "How this PC takes a device's touches: as sent, or as a mouse or trackpad for games that handle a mouse better than touch. Needs native pen and touch."
details = "As a mouse, the pointer follows the first finger and the left button is down while it touches. As a trackpad, the first finger moves the pointer by its swipe and a tap clicks left. With Native pen and touch off, the device turns touches into a mouse itself and this setting does nothing."
