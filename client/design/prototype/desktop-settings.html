<!doctype html><meta charset="utf-8"><title>Nightjar desktop settings</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="glass.css"><script src="lib.js"></script><body><script>
const cats = [['video', 'Video'], ['display', 'Display and image'], ['pad', 'Controls'], ['speaker', 'Audio'], ['stream', 'Streaming'], ['app', 'App'], ['tune', 'Debug']];
const dd = (v, fx) => `<button class="ctl press ${fx ? 'fx' : ''}" style="min-height:42px;height:42px;padding:0 12px 0 16px;font:400 15px/20px Figtree;gap:8px;min-width:188px;justify-content:space-between"><span class="num">${v}</span>${icon('down', 16, 2.2)}</button>`;
const opt = (l, on) => `<div class="press" style="height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:14px;font:${on ? 600 : 400} 15px/20px Figtree;${on ? 'background:var(--tint-selected-fill);color:var(--color-onSelected)' : ''}"><span style="width:18px">${on ? icon('check', 18, 2.4) : ''}</span>${l}</div>`;
mount(`
${nightSky({ x: 1166, y: 268, r: 80, w: 1280, h: 800 })}
<div style="position:absolute;left:48px;right:48px;top:20px;display:flex;align-items:center;gap:14px;z-index:6">
  <div style="display:flex;align-items:center;gap:10px;font:600 19px/24px Figtree;margin-right:6px">${mark(30)}Nightjar</div>
  ${capsuleNav(2, { h: 48 })}
  <div style="flex:1"></div>
  ${glass('chrome', { style: 'border-radius:24px;height:48px;width:220px' }, `<div class="sec" style="height:48px;display:flex;align-items:center;gap:9px;padding:0 16px;font:400 15px/20px Figtree">${icon('search', 19)}Search settings</div>`)}
</div>
<div style="position:absolute;left:48px;top:92px;width:236px" class="group">
  <div style="padding:6px">
  ${cats.map(([ic, l], i) => `<button class="press" style="width:100%;height:46px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:16px;font:${i === 0 ? 600 : 400} 15px/20px Figtree;${i === 0 ? 'background:var(--tint-selected-fill);color:var(--color-onSelected);box-shadow:inset 0 1px 0 var(--tint-selected-rimTop)' : 'color:var(--color-label)'}">${icon(ic, 20)}${l}</button>`).join('')}
  </div>
</div>
<div style="position:absolute;left:316px;top:88px;width:720px">
  <div class="t-large">Video</div>
  <div class="group" style="margin-top:16px;background:rgba(20,22,31,.46)">
    ${row('Resolution', { right: dd('This screen, 1920 × 1080') })}
    ${row('Frame rate', { right: dd('This screen, 60 Hz', true) })}
    ${row('HDR', { right: sw(false) })}
  </div>
  <div class="group" style="margin-top:14px;background:rgba(20,22,31,.46)">
    ${row('Automatic bitrate', { sub: '20 Mbps now', right: sw(true) })}
    ${row('Lower bitrate when the network is busy', { right: sw(true) })}
    ${row('Codec', { right: dd('Automatic') })}
  </div>
  <div class="hdr" style="margin:22px 4px 10px"><span class="t-section">Picture</span></div>
  <div class="group" style="background:rgba(20,22,31,.46)">
    <div class="row" style="display:block;padding:12px 16px 8px">
      <div style="display:flex;justify-content:space-between"><span class="t-body" style="font-weight:600">Sharpening</span><span class="t-body sec num">30%</span></div>
      ${slider(30)}
    </div>
    ${row('Scaling', { right: dd('Automatic') })}
  </div>
</div>
${glass('panel', { style: 'position:absolute;left:832px;top:268px;width:188px;border-radius:20px;z-index:7' }, `<div style="padding:6px">${opt('This screen', true)}${opt('30 FPS')}${opt('60 FPS')}${opt('90 FPS')}${opt('120 FPS')}</div>`)}
`, { w: 1280, h: 800 });
</script></body>
