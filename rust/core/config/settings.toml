control = { kind = "text", placeholder = "2560x1440", mono = true, presets = [{ value = "1280x720", label = "1280 × 720" }, { value = "1920x1080", label = "1920 × 1080" }, { value = "2560x1440", label = "2560 × 1440" }, { value = "3840x2160", label = "3840 × 2160" }] }
visible_when = { read_eq = "dd_resolution_option", default = "auto", value = "manual" }
required_when = { read_eq = "dd_resolution_option", default = "auto", value = "manual" }
