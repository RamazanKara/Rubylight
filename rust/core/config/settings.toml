override_allowed = true
advanced = true
category = "encoders"
group = "NVIDIA NVENC"
label = "Use CAVLC for H.264"
description = "For H.264: uses the simpler CAVLC entropy coding instead of CABAC, which needs about 10% more bitrate for the same quality. Leave it off unless a device cannot decode CABAC."
