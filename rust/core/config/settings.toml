default = 20
override_allowed = true
category = "video"
group = "Bitrate and network"
label = "PyroWave error correction"
description = "Error correction for PyroWave pictures, kept from an earlier setting because it differs from Error correction. Reset it to follow Error correction."
details = "Newer clients protect the start of each frame, which holds its coarsest detail. Older clients use whole-frame protection within their packet limits. Oversized frames may receive less protection; a stream warning explains when. 0 turns it off."
