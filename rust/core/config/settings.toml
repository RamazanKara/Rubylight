[[setting]]
key = "packet_pacing"
part = "video_stream"
type = "string"
default = "auto"
override_allowed = true
advanced = true
category = "video"
group = "Bitrate and network"
label = "Packet pacing"
description = "How fast video packets go out. A fixed rate suits a known link that drops bursts."
details = "Automatic starts adaptively for a device that reports a Wi-Fi or cellular route and paces the rest to the route. Automatic (the default) gives a device that reports a Wi-Fi or cellular route, such as Nightjar, adaptive pacing on H.264, HEVC and AV1: it starts at twice the encoder bitrate, probes up in small steps while the link stays clean, up to the route limit, and backs off on loss. Always gives every stream, PyroWave included, that controller from the first frame; it adds delay when a stream starts, and probing can still lose packets. Off keeps the route policy for every stream, and Slow down after video loss still applies. A fixed rate in Kbps (120000 means 120 Mbps) takes over pacing and turns the adaptive pacing and Slow down after video loss off; PyroWave treats it as a hard limit, while conventional codecs keep a 1.1-times-bitrate floor and 80% of a known Ethernet link. Reconnect after saving."
control = { kind = "text", placeholder = "120000", presets = [{ value = "auto", label = "Automatic (adaptive for Wi-Fi devices)" }, { value = "always", label = "Always adaptive" }, { value = "off", label = "Off" }] }
console = { group = "Video and capture", label = "Packet pacing (automatic, the default: adaptive pacing for a device that reports a Wi-Fi or cellular route on H.264, HEVC and AV1, route pacing for the rest; always: adaptive pacing for every stream, including PyroWave; off: route pacing only, and Slow down after video loss still applies; or a fixed rate in kbps, which takes over pacing, e.g. 120000 for 120 Mbps; reconnect after saving)", control = "text" }

[[setting]]
key = "keyframe_loss_pacing"
part = "video_stream"
type = "bool"
default = true
override_allowed = true
tier = "always-on"
advanced = true
category = "video"
group = "Bitrate and network"
label = "Slow down after video loss"
description = "After a lost keyframe (a full picture the stream restarts from) or repeated lost frames, spaces packets more evenly for the rest of the stream; the bitrate stays. Leave it on."
details = "A fixed Packet pacing rate or the adaptive controller (Packet pacing Always, or Automatic on a device that reports Wi-Fi or cellular) turns it off. Activates after a keyframe the client could not rebuild, a repeated request for the keyframe it was just sent (only from clients that do not report their own losses; a decoder that asks twice is not network loss), or three distinct unrecoverable frames within two seconds. Changes Rubylight makes itself (Alt+Tab, a bitrate change, a restarted capture or encoder) do not count. Frames this PC could not send whole, such as when the network send buffer fills at a high pacing rate, do: three within two seconds, or one keyframe; when only this PC saw that loss, it is lifted after 10 clean seconds, unless the stream already slowed down once (an earlier lift, or a remembered route), and it is never remembered. Loss the client reported is remembered for this device, address and network adapter for 24 hours, with a fast-rate retry every second eligible reconnect; a lost first keyframe alone is lifted after 10 clean seconds and not remembered. Reset remembered routes in Devices. Paces at twice the encoder bitrate, with room for error correction. Isolated ordinary-frame losses and fully repaired frames keep the fast rate."
inactive_hint = "A fixed Packet pacing rate is set, or the adaptive controller owns pacing (Packet pacing Always, or Automatic on a device that reports Wi-Fi or cellular), and each one keeps this off. Change Packet pacing to use this setting."
control = { kind = "toggle" }
visible_when = { ref = "keyframeLossPacing" }
console = { group = "Video and capture", label = "Slow down after video loss (on by default; after a lost keyframe or three distinct unrecoverable frames within two seconds, video is paced at twice the bitrate, with room for error correction, for the rest of the stream (a lost first keyframe alone, or loss only the host saw while sending in a stream that has not slowed down before, is lifted after 10 clean seconds; a client that reports its own losses is not slowed by asking twice for a keyframe); disabled by a fixed pacing rate or the adaptive options)", control = "bool" }

[[setting]]
key = "bitrate_adaptation"
part = "video_stream"
type = "enum"
default = "on"
override_allowed = true
advanced = true
category = "video"
group = "Bitrate and network"
label = "Adaptive bitrate"
description = "Lowers the picture bitrate when the network cannot carry it, then raises it again. Does nothing on a healthy link."
details = "Off keeps the bitrate you set, so a weak link freezes or breaks up the picture instead. On acts on three unrecoverable frames in two seconds, 5% of packets reported missing for two half-second windows, three frames lost on send, or three network keyframe requests from a client that sends no error-correction status. Each cut aims at 85% of what the link delivered, then this PC probes back up in small steps and returns to the requested bitrate after ten clean seconds. Reports for frames sent before a cut took effect are ignored. On PyroWave, client-loss cuts stop at its test-scene detail level. Send losses on this PC can cut a stream below that level, down to half its bitrate ceiling (at least 1 Mbps). On, and react to network delay also lowers the bitrate before packets are lost, for a device that reports when each video packet arrived, such as Nightjar: when packets take longer and longer to arrive, a queue is building on the way, so this PC lowers the bitrate to just under what arrived and paces video at the rate of the slowest link, then climbs back to the requested bitrate when the delay settles. The lower of both cuts applies. Reconnect after choosing it. A device that sets its own bitrate takes over bitrate control."
control = { kind = "select", options = [{ value = "off", label = "Off" }, { value = "on", label = "On" }, { value = "delay", label = "On, and react to network delay" }] }
doc_default = "`on`"
doc_summary = "Lowers the picture bitrate when the network cannot carry it, then raises it again. Does nothing on a healthy link. Choices: `off`, `on` (on loss error correction cannot repair) and `delay` (On, and react to network delay: also before packets are lost, for devices that report packet arrival times, such as Nightjar; reconnect after saving). A device that sets its own bitrate takes over. Replaces `link_rate_adaptation` and `congestion_control`, folded in when the host reads them: `congestion_control = true` becomes `delay`, `link_rate_adaptation = false` (without it) becomes `off`, anything else `on`. See [Adaptive bitrate](#adaptive-bitrate)."
console = { group = "Video and capture", label = "Adaptive bitrate (on by default: lowers the picture bitrate on loss that error correction cannot repair, then raises it again; on, and react to network delay also lowers it as delay builds, for devices that report packet arrivals such as Nightjar, reconnect after saving; off keeps the bitrate you set, so a weak link freezes or breaks up the picture; a device that sets its own bitrate takes over)", control = "choice", choices = ["off", "on", "delay"] }
rust_accessor = { kind = "enum_ci", method = "bitrate_adaptation", ret = "BitrateAdaptation", variants = [["off", "BitrateAdaptation::Off"], ["on", "BitrateAdaptation::On"], ["delay", "BitrateAdaptation::Delay"]], doc = "Adaptive bitrate: `off`, `on` (default) or `delay`." }

[[setting]]
