[workspace]
members = ["core", "client", "ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.80"

# The Android library has no unwinder; a panic aborts like a C assert would.
[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
