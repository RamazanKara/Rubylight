[[setting]]
key = "output_name"
part = "display_screen"
type = "string"
default = ""
restart = true
category = "display"
group = "Streamed display"
label = "Display"
description = "The monitor that is streamed when streams don’t use a virtual display. Leave it empty to stream the primary display; a device or app can choose its own."
details = "A stream fails to start when the chosen monitor is unplugged, or is switched off while Monitor setup is not set to turn it on."
control = { kind = "display" }
doc_summary = "The monitor to stream when no virtual display is used. Empty streams the primary display; a device or app can choose its own. For testing (advanced, config file only): `window:<hwnd>/<pid>@<display>` streams that one window with WGC (the release harness's demo stream); `<pid>` is the process that owns the window and `<display>` the display the window is on (such as `\\\\.\\DISPLAY1`). A malformed target, a closed or minimised window, a handle another process now owns, or a window on another display fails the stream with the reason, never falling back to a display."

[[setting]]
key = "virtual_display_mode"
part = "display_screen"
type = "enum"
default = ""
default_text = "One for each device on Windows 11 23H2 or later, otherwise a monitor"
tier = "home"
category = "display"
group = "Streamed display"
label = "Virtual display"
description = "Streams use a virtual display, an extra screen at the device’s resolution and refresh rate, instead of a monitor. Default suits almost everyone; a device’s or app’s choice wins."
details = "Default (by Windows version) is one for each device on Windows 11 23H2 or later and off on earlier Windows, which cannot load the virtual display driver. One for each device gives every device a display of its own. One shared by all devices is a single display: devices that stream at the same time see the same screen, and a device that asks for another resolution than that display has cannot start its stream. Off streams a monitor: the picture stays visible at the PC, and the monitor’s refresh rate can limit how many new frames the stream gets. A PC with no display switched on streams a virtual display whatever is chosen here."
control = { kind = "select", options = [{ value = "", label = "Default (by Windows version)" }, { value = "disabled", label = "Off, stream a monitor" }, { value = "per_client", label = "One for each device" }, { value = "shared", label = "One shared by all devices" }] }

[[setting]]
key = "virtual_display_layout"
part = "display_screen"
type = "enum"
default = "exclusive"
tier = "home"
category = "display"
group = "Streamed display"
label = "Virtual display layout"
description = "What your monitors do while a stream uses a virtual display. Exclusive turns them off until the stream ends, so games open on the stream; an Extend layout keeps them on."
details = "Exclusive turns your monitors off while a device streams and back on after it disconnects (see After a stream). Extend keeps your PC display active beside the virtual display. Games open on the primary display: making the virtual display primary moves the main desktop and taskbar to the stream, and keeping the PC display primary leaves them on your monitor. Isolate also places the virtual display far from the other monitors so the mouse cannot wander onto it. A Remote Monitor follows exclusive and primary; choose Extend — keep PC display primary to keep its saved placement."
control = { kind = "select", options = [{ value = "exclusive", label = "Exclusive" }, { value = "extended", label = "Extend — keep PC display primary" }, { value = "extended_primary", label = "Extend — make virtual display primary" }, { value = "extended_isolated", label = "Isolate — keep PC display primary" }, { value = "extended_primary_isolated", label = "Isolate — make virtual display primary" }] }
aliases = { match = "dash", spellings = { ensure_active = "extended", ensure_primary = "extended_primary", ensure_only_display = "exclusive" } }
console = { group = "Displays and HDR", label = "Virtual display layout", control = "choice", choices = ["exclusive", "extended", "extended_primary", "extended_isolated", "extended_primary_isolated"] }

[[setting]]
key = "dd_virtual_display_scale"
part = "display_screen"
type = "enum"
default = 0
override_allowed = true
category = "display"
group = "Streamed display"
label = "Virtual display scale"
description = "The Windows scale (text and app size) of a virtual display; a fixed percentage Windows does not offer at that resolution stops the stream from starting. Keep leaves it to Windows."
details = "Keep leaves the scale Windows remembers for that display. Recommended picks one from the resolution, such as 125% at 1080p. A fixed percentage is applied as set, and a stream fails to start where Windows offers no such scale at the display’s resolution. A device that asks for its own scale (PC display scaling in Nightjar) gets that one. This setting scales virtual displays only: a streamed monitor keeps its own scale."
control = { kind = "select", options_ref = "scales" }
visible_when = { ref = "virtualDisplayOs" }
host_gated = "virtual_display_os"
console = { group = "Displays and HDR", label = "Virtual display scale (%)", control = "number" }

[[setting]]
key = "dd_activate_virtual_display"
part = "display_screen"
type = "bool"
default = false
override_allowed = true
advanced = true
category = "display"
group = "Streamed display"
label = "Activate a virtual display"
description = "Every stream gets a virtual display, also where Virtual display is Off for the host, a device or an app. Leave it off; Virtual display is the usual way to choose."
details = "A device that asks for the PC’s own monitor still gets that monitor, and so does a device or app with a display of its own chosen."
inactive_hint = "It matters when Virtual display is unset or Off, or a device or app turns it off. Otherwise streams already use a virtual display."
control = { kind = "toggle" }
visible_when = { any = [{ read_in = "virtual_display_mode", default = "", values = ["", "disabled"] }, { on = "dd_activate_virtual_display", default = false }] }
console = { group = "Displays and HDR", label = "Activate virtual display", control = "bool" }

[[setting]]
key = "dd_configuration_option"
part = "display_screen"
type = "enum"
default = "verify_only"
override_allowed = true
category = "display"
group = "Streamed display"
label = "Monitor setup"
description = "When a stream shows a monitor, not a virtual display, it can turn that monitor on, make it primary, or turn your others off until it ends. The default only checks that it is on."
details = "Only check that it’s on changes no monitor: a stream of a monitor chosen under Display that is switched off fails to start. Turn it on switches that monitor on beside the others. Turn it on and make it primary also moves the main desktop to it, and Turn it on and the others off turns your other monitors off while the stream runs. Each is undone when the stream ends. All four still set the monitor’s resolution, refresh rate and HDR as those settings say; leaving the monitors alone also skips resolution, refresh rate and HDR changes on it."
control = { kind = "select", options = [{ value = "verify_only", label = "Only check that it’s on" }, { value = "ensure_active", label = "Turn it on" }, { value = "ensure_primary", label = "Turn it on and make it primary" }, { value = "ensure_only_display", label = "Turn it on and the others off" }, { value = "disabled", label = "Leave the monitors alone" }] }
caution_when = { when = { read_eq = "dd_configuration_option", default = "verify_only", value = "ensure_only_display" }, message = "Your other monitors are off while a stream of a monitor runs." }
console = { group = "Displays and HDR", label = "Display activation", control = "choice", choices = ["disabled", "verify_only", "ensure_active", "ensure_primary", "ensure_only_display"] }

[[setting]]
key = "dd_resolution_option"
part = "display_screen"
type = "enum"
default = "auto"
override_allowed = true
tier = "home"
category = "display"
group = "Resolution and refresh rate"
label = "Resolution"
description = "The resolution of the streamed display. Match the device suits almost everyone: a streamed monitor switches to the device’s resolution, where it has that mode, and back afterwards."
details = "A monitor without a mode at the device’s resolution keeps its own, and the picture is scaled to the device. Keeping the current one applies to monitors only; a virtual display matches the device unless a fixed resolution is set. With Monitor setup on Leave the monitors alone, a monitor’s resolution is never changed."
control = { kind = "select", options = [{ value = "auto", label = "Match the device" }, { value = "disabled", label = "Keep the current resolution" }, { value = "manual", label = "Use a fixed resolution" }], fixed = { value = "manual", key = "dd_manual_resolution" } }
console = { group = "Displays and HDR", label = "Resolution policy", control = "choice", choices = ["disabled", "auto", "manual"] }

[[setting]]
key = "dd_manual_resolution"
part = "display_screen"
type = "string"
default = ""
override_allowed = true
category = "display"
group = "Resolution and refresh rate"
label = "Fixed resolution"
