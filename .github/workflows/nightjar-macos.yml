name: Nightjar macOS

# Nightjar's macos.yml for client/ in this repo: main's CI gates the Mac build before the
# nightjar mirror runs its own copy (client/.github/workflows/macos.yml). No Mac is available on
# the development machine, so this job is the Mac check.
on:
  push:
    # wip/** branches are a CI lane for work not yet on main (tools\dev.ps1 ci).
    branches: [main, 'wip/**']
    paths:
      - 'client/protocol/**'
      - 'client/scripts/**'
      - 'client/app/build.gradle'
      - 'client/app/src/main/assets/**'
      - 'client/app/src/main/res/**'
      - '.config/nextest.toml'
      - '.github/workflows/nightjar-macos.yml'
  workflow_dispatch:

# A newer push to the same wip/ branch replaces its run; every run of main keeps its own group.
concurrency:
  group: nightjar-macos-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      # The root rust-toolchain.toml pins the host's compiler; Nightjar builds with stable.
      RUSTUP_TOOLCHAIN: stable
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        working-directory: client/protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          brew install cmake meson ninja pkg-config nasm
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - uses: taiki-e/install-action@2b545d4fd42fdd72ed2a44eab8fedd1850e8f731 # nextest
      # Compiled dependencies, after the toolchain (the key names its rustc). Before the media
      # cache below: post steps run in reverse, so the media prefix is saved before rust-cache's
      # cleanup prunes target/ to Cargo's own files.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: 'client/protocol -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The media libraries macos-deps.sh builds (SDL, Opus, dav1d, FFmpeg), per architecture.
      # Its prefix is named after the hash of the script and its FFmpeg/SDL patches and is reused once complete.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: media-cache
        with:
          path: client/protocol/target/macos-native/*/prefix
          key: macos-media-${{ runner.arch }}-${{ hashFiles('client/protocol/desktop-media/macos-deps.sh', 'client/protocol/desktop-media/ffmpeg-patches/macos/*.patch', 'client/protocol/vendor/sdl3-src/patches/metal-command-queue.patch') }}
      - name: Build the application and verify a relocated copy
        run: |
          python3 desktop/package-macos.py --debug
          python3 desktop/tests/verify_macos_bundle.py target/debug/Nightjar.app
      - name: Test and lint against the bundled media libraries
        run: |
          native_prefix=$(desktop-media/macos-deps.sh "$PWD/target/macos-native")
          export NIGHTJAR_FFMPEG_DIR="$native_prefix" PKG_CONFIG_PATH="$native_prefix/lib/pkgconfig"
          cargo clippy --workspace --all-targets --features nightjar-desktop/demo-library --locked -- -D warnings
          # The mouse-pace loopback test measures wall-clock gaps for an idle machine; the shared
          # macOS runners' scheduling misses its 3 ms (p90 5.9 ms, 2026-11-10); run it on a Mac by hand.
          cargo nextest run --config-file ../../.config/nextest.toml --profile ci --locked --no-fail-fast -p nightjar-desktop -p nightjar-desktop-config -p nightjar-desktop-ui -p nightjar-desktop-media -p nightjar-core -p nightjar-policy -E 'not test(unbatched_mouse_motion_reaches_the_host_at_the_mouse_pace)'
          cargo test --doc --locked -p nightjar-desktop -p nightjar-desktop-config -p nightjar-desktop-ui -p nightjar-desktop-media -p nightjar-core -p nightjar-policy
          cargo nextest run --config-file ../../.config/nextest.toml --profile ci --locked --manifest-path core/Cargo.toml
          cargo test --doc --locked --manifest-path core/Cargo.toml
      - name: Cross-package and inspect the Intel archive on Apple Silicon
        if: runner.arch == 'ARM64'
        run: |
          rustup target add x86_64-apple-darwin
          python3 desktop/package-macos.py --debug --arch x86_64 --zip
          ditto -x -k target/x86_64-apple-darwin/debug/Nightjar-*-macos-x86_64.zip "$RUNNER_TEMP/intel-archive"
          python3 desktop/tests/verify_macos_bundle.py --arch x86_64 --inspect-only "$RUNNER_TEMP/intel-archive/Nightjar.app"
      # Saved by main only, as rust-cache: a branch run must not use up the repository cache.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.media-cache.outputs.cache-hit != 'true'
        with:
          path: client/protocol/target/macos-native/*/prefix
          key: ${{ steps.media-cache.outputs.cache-primary-key }}

  # PyroWave's GPU decoder on Apple silicon: Mesa's KosmicKrisp Vulkan driver (Metal 4, macOS 26)
  # and the Vulkan loader, built and cached here, then a check that the loader finds the driver
  # through the manifest the app ships. The runner is a virtual Mac: whether its GPU takes
  # KosmicKrisp is printed, not required.
  kosmickrisp:
    name: KosmicKrisp on macos-26
    runs-on: macos-26
    timeout-minutes: 150
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      RUSTUP_TOOLCHAIN: stable
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    defaults:
      run:
        working-directory: client/protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          brew install meson ninja cmake pkg-config nasm bison flex libclc spirv-llvm-translator
          # LLVM 23, the major KosmicKrisp is built and tested with: Homebrew keeps it as llvm@23
          # once its llvm moves on, and has no llvm@23 while llvm itself is 23.
          brew install llvm@23 2>/dev/null || brew install llvm
          rustup toolchain install stable --profile minimal --no-self-update
      # Restored and saved apart, so a later failing step keeps the 30-minute Mesa build cached.
      - id: vulkan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client/protocol/target/macos-vulkan/*/prefix
          key: macos-vulkan-${{ runner.arch }}-${{ hashFiles('client/protocol/desktop-media/macos-vulkan.sh', 'client/protocol/desktop-media/macos-vulkan-requirements.txt') }}
      - name: Build KosmicKrisp and the Vulkan loader
        run: |
          set -o pipefail
          desktop-media/macos-vulkan.sh "$PWD/target/macos-vulkan" | tee "$RUNNER_TEMP/macos-vulkan.log"
          prefix=$(tail -n1 "$RUNNER_TEMP/macos-vulkan.log")
          echo "VULKAN_PREFIX=$prefix" >> "$GITHUB_ENV"
          cat "$prefix/build-info.txt"
      - if: github.ref == 'refs/heads/main' && steps.vulkan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client/protocol/target/macos-vulkan/*/prefix
          key: macos-vulkan-${{ runner.arch }}-${{ hashFiles('client/protocol/desktop-media/macos-vulkan.sh', 'client/protocol/desktop-media/macos-vulkan-requirements.txt') }}
      - name: The loader finds KosmicKrisp through a bundle-style manifest
        run: |
          icd="$RUNNER_TEMP/kosmickrisp_icd.json"
          printf '{"file_format_version": "1.0.1", "ICD": {"library_path": "%s", "api_version": "1.4.0", "is_portability_driver": false}}\n' "$VULKAN_PREFIX/lib/libvulkan_kosmickrisp.dylib" > "$icd"
          sw_vers
          system_profiler SPDisplaysDataType | sed -n '1,20p'
          VK_LOADER_DEBUG=driver python3 desktop/tests/macos_vulkan_probe.py "$VULKAN_PREFIX/lib/libvulkan.1.dylib" "$icd"
      - name: Build the PyroWave SDK for macOS
        run: |
          set -o pipefail
          brew install vulkan-headers
          VULKAN_HEADERS_DIR="$(brew --prefix vulkan-headers)/include"             ../scripts/build-pyrowave-sdk.sh -o "$PWD/target/pyrowave-sdk" -H "$GITHUB_WORKSPACE"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: media-cache
        with:
          path: client/protocol/target/macos-native/*/prefix
          key: macos-media-${{ runner.arch }}-${{ hashFiles('client/protocol/desktop-media/macos-deps.sh', 'client/protocol/desktop-media/ffmpeg-patches/macos/*.patch') }}
      # As release.yml's arm64 leg packages it: a release build, zipped, then unpacked and checked.
      - name: Package the release Nightjar.app with KosmicKrisp and the PyroWave SDK
        run: |
          python3 desktop/package-macos.py --arch arm64 --zip --vulkan "$VULKAN_PREFIX" --pyrowave-sdk "$PWD/target/pyrowave-sdk"
          zip=$(ls target/aarch64-apple-darwin/release/Nightjar-*-macos-arm64.zip)
          ditto -x -k "$zip" "$RUNNER_TEMP/unpacked"
          python3 desktop/tests/verify_macos_bundle.py --arch arm64 --kosmickrisp "$RUNNER_TEMP/unpacked/Nightjar.app"
      - name: PyroWave GPU decoder smoke, or its named CPU fallback
        run: desktop/tests/pyrowave_mac_smoke.sh "$RUNNER_TEMP/unpacked/Nightjar.app"
      # Saved by main only, as rust-cache: a branch run must not use up the repository cache.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.media-cache.outputs.cache-hit != 'true'
        with:
          path: client/protocol/target/macos-native/*/prefix
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
