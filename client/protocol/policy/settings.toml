rust_type = "bool"
default_expr = "false"
scope = "layer"
override_allowed = true
android_key = "checkbox_link_probe"

[[desktop_setting]]
key = "sops"
rust_type = "bool"
default_expr = "true"
scope = "layer"
override_allowed = true
android_key = "checkbox_enable_sops"

[[desktop_setting]]
key = "decode_queue_frames"
rust_type = "u32"
default_expr = "15"
scope = "layer"
override_allowed = true
android_key = "list_decode_queue_frames"

[[desktop_setting]]
key = "full_range"
rust_type = "bool"
default_expr = "false"
scope = "layer"
override_allowed = true
android_key = "checkbox_full_range"

[[desktop_setting]]
key = "upscaling"
rust_type = "Upscaling"
default_expr = "Upscaling::Bilinear"
scope = "layer"
override_allowed = true
android_key = "upscaling_mode"

[[desktop_setting]]
key = "upscale_sharpness"
rust_type = "u32"
default_expr = "50"
scope = "layer"
override_allowed = true
android_key = "upscaling_sharpness"

[[desktop_setting]]
key = "frame_warp"
rust_type = "bool"
default_expr = "false"
scope = "layer"
override_allowed = true
android_key = "checkbox_frame_warp"

[[desktop_setting]]
key = "open_on_start"
rust_type = "OpenOnStart"
default_expr = "OpenOnStart::Pcs"
