<!doctype html><meta charset="utf-8"><title>Nightjar stream menu</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="glass.css"><script src="lib.js"></script><body><script>
if (Q.get('window') === '1') document.head.insertAdjacentHTML('beforeend', '<style>.g.menu>.g-blur{-webkit-backdrop-filter:blur(44px);backdrop-filter:blur(44px);background:#0E1017C4}.g.menu>.g-sheen{opacity:.75}.g.menu>.g-lens{display:none}</style>');
const menuTile = (ic, l, on, fx) => `<button class="ctl press ${fx ? 'fx' : ''}" style="flex:1;flex-direction:column;gap:5px;height:76px;border-radius:20px;padding:0 4px;font:600 14px/18px Figtree;${on ? 'color:var(--color-onSelected);background:var(--tint-selected-fill)' : ''}">${icon(ic, 26)}<span>${l}</span></button>`;
mount(`
<img src="${STRESS ? WHITE : 'frames/racing.png'}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" alt="">
${`<div style="position:absolute;left:24px;top:22px;border-radius:18px;height:36px;background:#0E1017B8"><div class="num" style="display:flex;align-items:center;gap:9px;height:36px;padding:0 14px;font:600 15px/20px Figtree"><span class="dot"></span>119.9 FPS<span style="opacity:.5">|</span>8 ms<span style="opacity:.5">|</span>80 Mbps</div></div>`}
${glass('menu', { style: 'position:absolute;right:24px;top:24px;bottom:24px;width:452px;border-radius:32px' }, `
  <div style="height:672px;display:flex;flex-direction:column;padding:22px 20px 20px">
    <div style="display:flex;align-items:center;gap:14px;padding:0 4px">
      ${cover('racing-game', { w: 44, style: 'border-radius:9px' })}
      <div style="flex:1;min-width:0"><div class="t-title">Racing Game</div><div class="t-sub sec" style="font-size:15px">Living-room PC</div></div>
      <button class="ctl round press" style="width:44px;min-height:44px;height:44px">${icon('x', 20, 2.2)}</button>
    </div>
    <div style="display:flex;gap:10px;margin-top:18px">
      ${menuTile('keyboard', 'Keyboard')}${menuTile('mouse', 'Mouse', true)}${menuTile('bars', 'Stats', true)}${menuTile('mic', 'Mic')}
    </div>
    <div class="group" style="margin-top:12px;background:var(--tint-groupOnSky-fill)">
      <div class="row fx" style="display:block;padding:12px 16px 8px;border-radius:var(--radius-group);background:var(--focus-fillLift)">
        <div style="display:flex;justify-content:space-between"><span class="t-body" style="font-weight:600;font-size:17px">Bitrate</span><span class="t-body num" style="font-size:17px">80 Mbps</span></div>
        ${slider(58)}
      </div>
      <div class="row" style="display:block;padding:12px 16px 8px">
        <div style="display:flex;justify-content:space-between"><span class="t-body" style="font-weight:600;font-size:17px">Frame limit</span><span class="t-body num" style="font-size:17px">120 FPS</span></div>
        ${slider(82)}
      </div>
      ${row('HDR', { right: sw(true) })}
    </div>
    <style>.tight .row{min-height:50px}</style><div class="group tight" style="margin-top:12px;background:var(--tint-groupOnSky-fill)">
      ${row('Session', { val: '1920 × 1080, Wi-Fi 6, 4 ms', chev: true })}
      ${row('Audio', { val: 'This device', chev: true })}
      ${row('Send keys', { val: 'Ctrl Alt Del', chev: true })}
    </div>
    <div style="margin-top:auto;display:flex;gap:10px">
      <button class="ctl press" style="flex:1;height:56px">${icon('exit', 21)}Disconnect</button>
      <button class="ctl press" style="flex:1;height:56px;color:var(--color-onDangerFill);background:var(--color-dangerFill)">${icon('power', 21)}Quit game</button>
    </div>
  </div>
`)}
`, { w: 1280, h: 720, zoom: 1.5, tv: true });
</script></body>
