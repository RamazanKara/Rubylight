part = "basics_core"
type = "enum"
default = "lan"
restart = true
category = "advanced"
group = "Console"
label = "Console access"
description = "Which addresses may open this console and use its API. Leave it on Local network: Any network also accepts addresses on the internet, and This PC only shuts out your other devices."
details = "Local network includes private addresses and Tailscale (100.64.0.0/10). With Any network and UPnP on, the console port is forwarded too."
control = { kind = "select", options = [{ value = "pc", label = "This PC only" }, { value = "lan", label = "Local network" }, { value = "wan", label = "Any network" }] }
caution_when = { when = { text_eq = "origin_web_ui_allowed", default = "lan", value = "wan" }, message = "The console and its API accept addresses on the internet." }
