name: Rubylight Windows
permissions: {}
on:
  push:
    branches: [main]
    # A release tag publishes the GitHub release (tag and publish below).
    # GitHub ignores paths for tag pushes, so a tag always runs.
    tags: ['v2.*']
    # Changes to docs and Markdown alone don't run CI; a release of such a
    # commit builds it in the windows job.
    paths: ['rust/**', '!rust/**/*.md', 'Cargo.*', 'rust-toolchain.toml', '.cargo/**', 'clippy.toml', 'third-party/**', '.github/workflows/rust-windows.yml']
  pull_request:
    paths: ['rust/**', '!rust/**/*.md', 'Cargo.*', 'rust-toolchain.toml', '.cargo/**', 'clippy.toml', 'third-party/**', '.github/workflows/rust-windows.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Release the version in Cargo.toml (main only); tags it like a pushed tag would
        type: boolean
        default: false
      notes:
        description: Only rewrite the published release's text from rust/RELEASE_NOTES.md on main; no build
        type: boolean
        default: false
concurrency:
  # A release run is never cancelled by a later push to main.
  group: butterpollo-rust-${{ github.ref }}-${{ inputs.publish && 'publish' || inputs.notes && 'notes' || 'ci' }}
  cancel-in-progress: true
jobs:
  # A tag must match Cargo.toml and have its release notes. When main's run
  # already built and tested the commit, the release reuses that build.
  tag:
    if: startsWith(github.ref, 'refs/tags/') || (inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.built.outputs.run }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            version=${tag#v}
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            tag=v$version
            if [ -n "$(git ls-remote --tags origin "refs/tags/$version" "refs/tags/$tag")" ]; then
              echo "::error::$version is already tagged; bump the version first"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 rust/release/notes.py "$tag" --out "$RUNNER_TEMP/body.md"
      - id: built
        # Signing provenance must come from this release's hosted build.
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow rust-windows.yml --branch main --commit "$GITHUB_SHA" \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ]; then
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '.artifacts[] | select(.name == "butterpollo-rust-windows-x64" and .expired == false) | .id') || artifact=
            if [ -z "$artifact" ]; then run=; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then echo "::notice::reusing the build of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"; fi
  windows:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result != 'failure' && !needs.tag.outputs.run && !inputs.notes }}
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-libvpl
      - name: Rust toolchains
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc --toolchain 1.98.1-x86_64-pc-windows-gnu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # The web console build needs Vite 7's Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Check the web console
        working-directory: rust/web
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/AppData/Local/ButterpolloRust/sdk
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-sdk-v3-ffmpeg-2026.516.30821-pyro-502a3b52-patched-ngx-1.1.0
      - name: Test, lint and package Rust
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          .\rust\build.ps1 -MsysRoot '${{ steps.msys.outputs.msys2-location }}' -FetchDependencies -SkipTrueHdr -Package -TargetDirectory "$env:RUNNER_TEMP\butterpollo-rust-target"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: butterpollo-rust-windows-x64
          # The portable package and the setup that carries it.
          path: |
            ${{ runner.temp }}/butterpollo-rust-target/butterpollo-rust-release.zip
            ${{ runner.temp }}/butterpollo-rust-target/butterpollo-setup-*.exe
          if-no-files-found: error
          retention-days: 30
  sign:
    needs: [tag, windows]
    if: ${{ !cancelled() && vars.SIGNPATH_ORGANIZATION_ID != '' && needs.tag.result == 'success' && needs.windows.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Prepare the unsigned payload
        run: |
          gh run download "${{ github.run_id }}" -R "$env:GITHUB_REPOSITORY" -n butterpollo-rust-windows-x64 -D "$env:RUNNER_TEMP\build"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\build\butterpollo-rust-release.zip" -DestinationPath "$env:RUNNER_TEMP\unsigned"
          $root = "$env:RUNNER_TEMP\unsigned\butterpollo-rust-release"
          foreach ($dll in @('butterpollo_truehdr.dll', 'nvngx_truehdr.dll')) {
            if (Get-ChildItem -LiteralPath $root -Recurse -Filter $dll) { throw "TrueHDR must not enter the signed package: $dll" }
          }
      - name: Upload files for payload signing
        id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rubylight-unsigned-payload
          path: ${{ runner.temp }}/unsigned/butterpollo-rust-release/
          if-no-files-found: error
          retention-days: 7
      # release-signing must require manual approval in SignPath for BOTH requests.
      - name: Sign Rubylight payload binaries
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: rubylight
          signing-policy-slug: release-signing
          artifact-configuration-slug: payload
          github-artifact-id: ${{ steps.payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed/butterpollo-rust-release
          parameters: |
            version: ${{ toJSON(needs.tag.outputs.version) }}
      - name: Rebuild the manifest, portable ZIP and installer
        run: |
          [xml]$config = Get-Content .signpath/artifact-configuration.xml
          foreach ($file in $config.SelectNodes("//*[local-name()='include']")) {
            $path = Join-Path "$env:RUNNER_TEMP\signed\butterpollo-rust-release" $file.path
            if ((Get-AuthenticodeSignature -LiteralPath $path).Status -ne 'Valid') { throw "Invalid signature: $path" }
          }
          .\rust\release\repackage.ps1 -Distribution "$env:RUNNER_TEMP\signed\butterpollo-rust-release" -Zip "$env:RUNNER_TEMP\build\butterpollo-rust-release.zip" -Installer "$env:RUNNER_TEMP\build\butterpollo-setup-$env:VERSION.exe"
      - name: Upload the assembled installer for signing
        id: installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rubylight-unsigned-installer
          path: ${{ runner.temp }}/build/butterpollo-setup-*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Sign the assembled installer
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: rubylight
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-installer
          parameters: |
            version: ${{ toJSON(needs.tag.outputs.version) }}
      - name: Verify the signed installer and its embedded payload
        run: |
          $installer = "$env:RUNNER_TEMP\signed-installer\butterpollo-setup-$env:VERSION.exe"
          if ((Get-AuthenticodeSignature -LiteralPath $installer).Status -ne 'Valid') { throw 'Installer signature is invalid' }
          $process = Start-Process -FilePath $installer -ArgumentList @('--extract', ('"{0}"' -f "$env:RUNNER_TEMP\verify-payload")) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Signed installer extraction failed: $($process.ExitCode)" }
          Copy-Item -LiteralPath $installer -Destination "$env:RUNNER_TEMP\build\butterpollo-setup-$env:VERSION.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rubylight-signed-windows-x64
          path: |
            ${{ runner.temp }}/build/butterpollo-rust-release.zip
            ${{ runner.temp }}/build/butterpollo-setup-*.exe
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [tag, windows, sign]
    if: ${{ !cancelled() && needs.tag.result == 'success' && ((vars.SIGNPATH_ORGANIZATION_ID == '' && (needs.tag.outputs.run || needs.windows.result == 'success')) || needs.sign.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag.outputs.version }}
      TAG: ${{ needs.tag.outputs.tag }}
      BUILD: ${{ needs.tag.outputs.run || github.run_id }}
      ARTIFACT: ${{ needs.sign.result == 'success' && 'rubylight-signed-windows-x64' || 'butterpollo-rust-windows-x64' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Publish the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1 || gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::notice::$VERSION is already published"
            exit 0
          fi
          python3 rust/release/notes.py "$TAG" --out body.md --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BUILD"
          gh run download "$BUILD" -n "$ARTIFACT" -D build
          mkdir out
          mv "build/butterpollo-setup-$VERSION.exe" "out/rubylight-setup-$VERSION.exe"
          mv build/butterpollo-rust-release.zip "out/rubylight-$VERSION-windows-x64.zip"
          (cd out && sha256sum * > SHA256SUMS)
          flags=()
          if [[ $VERSION == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Rubylight $VERSION" --notes-file body.md "${flags[@]}" out/*
          echo "::notice::published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
  # Corrects a published release's text after the fact, keeping its assets
  # and its link to the run that built it.
  notes:
    if: inputs.notes && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Rewrite the release text
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag=v$version
          if ! gh release view "$tag" > /dev/null 2>&1; then tag=$version; fi
          run=$(gh release view "$tag" --json body --jq .body | grep -o 'https://github.com/[^)]*/actions/runs/[0-9]*' | head -n 1 || true)
          python3 rust/release/notes.py "$tag" --out body.md --run "$run"
          gh release edit "$tag" --notes-file body.md
          echo "::notice::rewrote the text of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
