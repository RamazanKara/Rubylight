group = "Mouse, pen and touch"
label = "Mouse input method"
description = "How this PC moves its mouse; Automatic suits almost everyone. Virtual mouse is a USB mouse games read like a real one; Injection is Windows input some games and anti-cheat ignore."
details = "Automatic uses the virtual mouse when the USB audio and haptics driver is installed, and injection otherwise. The virtual mouse needs usbip-win2, the driver the setup installs with USB audio and haptics. Without it, Virtual mouse uses injection and the stream says why. Measured on an RX 7900 XT PC, a move took about 0.25 ms from input handling on this PC to the game through the virtual mouse and 0.19 ms through injection (median). A game or device can choose its own method under Games or Devices."
inactive_hint = "Turn on Mouse under Input devices to use this setting. Paired devices also need the Mouse permission."
control = { kind = "select", options = [{ value = "auto", label = "Automatic" }, { value = "virtual_mouse", label = "Virtual mouse" }, { value = "injection", label = "Injection" }] }
aliases = { spellings = { vmouse = "virtual_mouse", sendinput = "injection" } }
visible_when = { ref = "mouseOn" }
doc_summary = "How this PC moves its mouse for a device: auto (the virtual mouse when the USB audio and haptics driver is installed), virtual_mouse or injection."
console = { group = "Input", label = "Mouse input method (auto: the virtual mouse when the USB/IP driver is installed)", control = "choice", choices = ["auto", "virtual_mouse", "injection"] }

