<!doctype html><meta charset="utf-8"><title>Nightjar TV home</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="glass.css"><script src="lib.js"></script><body><script>
const GAMES = [['racing-game', 'Racing Game'], ['open-world', 'Open World'], ['ocean-explorer', 'Ocean Explorer'], ['space-sim', 'Space Sim'], ['music-studio', 'Music Studio'], ['ember-keep', 'Ember Keep'], ['puzzle-night', 'Puzzle Night'], ['retro-arcade', 'Retro Arcade'], ['frostline', 'Frostline']];
const G2 = ['night-courier', 'ashfall', 'harvest-valley', 'brightwater', 'deep-field', 'frostline', 'desktop', 'retro-arcade'];
let focus = 2;
function draw() {
  const [fid, fname] = GAMES[focus];
  mount(`
  ${ambient(fid, { bg: 'var(--color-canvasTv)', fade: 'linear-gradient(180deg,rgba(11,13,18,0),rgba(11,13,18,0) 34%,rgba(11,13,18,.7) 72%,rgba(11,13,18,.92))' })}
  <div style="position:absolute;left:48px;right:48px;top:30px;display:flex;align-items:center;gap:10px;z-index:6">
    ${capsuleNav(0, { h: 52 })}<div style="flex:1"></div>${pcCapsule('Living-room PC', 52)}${roundGlass('search', 52)}
  </div>
  <div style="position:absolute;left:48px;top:108px;right:48px;z-index:2">
    <div class="t-hero" style="font-size:60px;line-height:66px;text-shadow:0 2px 24px rgba(0,0,0,.4)">${fname}</div>
    <div style="display:flex;gap:18px;align-items:center;margin-top:12px">
      ${hint('go', 'Play')}${hint('alt', 'Favourite')}
    </div>
  </div>
  <div style="position:absolute;left:48px;right:0;top:232px" class="tvrow">
    <div class="hdr"><span class="t-section">Steam</span><span class="t-body sec">10</span></div>
    <div class="shelf" style="margin-top:14px;gap:20px;width:2000px;position:relative;z-index:3">
      ${GAMES.map(([n], i) => cover(n, { w: 148, cls: i === focus ? 'fx' : 'dim', style: i === focus ? 'transform:scale(var(--focus-scaleCoverTv));z-index:4' : '' })).join('')}
    </div>
  </div>
  <div style="position:absolute;left:48px;right:0;top:522px">
    <div class="hdr"><span class="t-section">Epic Games</span><span class="t-body sec">6</span></div>
    <div class="shelf" style="margin-top:14px;gap:20px;width:2000px">${G2.map((n) => cover(n, { w: 148, cls: 'dim' })).join('')}</div>
  </div>
  `, { w: 1280, h: 720, zoom: 1.5, tv: true });
}
draw();
// The real focus model in miniature: arrows move focus, the ambient follows. No delay on anything.
addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') focus = Math.min(GAMES.length - 1, focus + 1); else if (e.key === 'ArrowLeft') focus = Math.max(0, focus - 1); else return; draw(); });
</script></body>
