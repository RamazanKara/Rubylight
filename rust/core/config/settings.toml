[[docs.sections]]
heading = "### Games"
after_note = "Earlier releases kept these five options once for each launcher, under `<launcher>_auto_sync`, `<launcher>_autosync_remove_uninstalled`, `<launcher>_sync_all_installed`, `<launcher>_recent_games` and `<launcher>_recent_max_age_days` (`steam`, `epic`, `battlenet`, `microsoft`, `ea`, `ubisoft`, `gog`, `library_local` and `playnite`). Rubylight folds them into the shared settings when it loads a configuration: the shared value is the one every launcher agreed on, and a launcher whose value differed keeps its own key, which the sync still reads in place of the shared value. Saving a different value for a shared setting applies it to every launcher again."
keys = [
  "remote_monitor_confirm_app_replacement",
  "terminate_on_pause",
