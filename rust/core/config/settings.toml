doc_summary = "Match the stream turns HDR on the streamed display on for an HDR stream, off for SDR, and back afterwards. Always on or off is for devices or games that report HDR wrongly. Values: `auto`, `force_on` (Always on), `force_off` (Always off), `disabled` (Don’t change HDR); the earlier `dd_hdr_request_override` is folded into it."
