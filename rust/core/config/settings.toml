[[setting]]
key = "lan_encryption_mode"
part = "basics_core"
type = "enum"
default = 0
category = "network"
group = "Streams"
label = "Local network encryption"
description = "Encrypts streams on the local network, Tailscale included. Off suits a network you trust: encrypting costs slower devices performance; Required refuses devices that cannot encrypt."
details = "Required turns away devices that cannot encrypt, and demands encrypted video and audio from the others. Off does not offer video encryption on the local network."
control = { kind = "select", options_ref = "encryption" }
console = { group = "Network, administration and commands", label = "Local network encryption (0 never, 1 optional, 2 required)", control = "number" }

[[setting]]
key = "wan_encryption_mode"
part = "basics_core"
type = "enum"
default = 1
category = "network"
group = "Streams"
label = "Internet encryption"
description = "Encrypts streams outside the local network. Leave it on When the device supports it: Off sends video over the internet unencrypted; Required refuses devices that cannot encrypt."
details = "Required turns away devices that cannot encrypt, and demands encrypted video and audio from the others. With When the device supports it, a device that cannot encrypt still streams, and the console warns that its stream crosses the internet unencrypted. Off does not offer video encryption. A device that connects through Play over the internet counts as outside the local network; Tailscale counts as the local network."
control = { kind = "select", options_ref = "encryption" }
caution_when = { when = { text_eq = "wan_encryption_mode", default = "1", value = "0" }, message = "Video goes over the internet unencrypted." }
console = { group = "Network, administration and commands", label = "Internet encryption (0 never, 1 optional, 2 required)", control = "number" }

[[setting]]
key = "ping_timeout"
part = "basics_core"
type = "int"
default = 10000
category = "network"
group = "Streams"
label = "Device timeout"
description = "How long this PC waits without hearing from a device before it ends the stream. Longer rides out dropouts on unreliable networks, but a vanished device holds its stream that long."
details = "A custom time is 1000 to 300000 milliseconds."
control = { kind = "number", min = 1000, max = 300000, step = 1, unit = "ms", presets = [{ value = 5000, label = "5 seconds" }, { value = 10000, label = "10 seconds" }, { value = 30000, label = "30 seconds" }, { value = 60000, label = "1 minute" }, { value = 300000, label = "5 minutes" }] }
console = { group = "Network, administration and commands", label = "Device timeout (milliseconds)", control = "number" }

[[setting]]
key = "client_roaming"
part = "basics_core"
type = "bool"
default = true
tier = "always-on"
category = "network"
group = "Streams"
label = "Client roaming"
description = "Let a device whose network address changes, such as a phone moving from Wi-Fi to mobile data, keep its stream instead of reconnecting. Leave it on; other devices stream as before."
details = "Only devices that support it, such as Nightjar, use it. The device proves the new address with the stream key before this PC sends anything there, and this PC then drops what still arrives from the old one. Moonlight clients that do not support it stream as before. Turning it off stops roaming at once; turning it on applies from the next stream."
control = { kind = "toggle" }
rust_accessor = { kind = "bool", method = "client_roaming", doc = "Client roaming (`client_roaming`, on by default)." }

[[setting]]
key = "dscp_tagging"
part = "basics_core"
type = "bool"
default = true
category = "network"
group = "Streams"
label = "Prioritize stream traffic (DSCP)"
description = "Marks video and audio for local devices (DSCP) so Wi-Fi and switches that honour the marks send them first. Leave it on unless sound crackles or the picture stutters on one router."
details = "Some consumer routers drop or delay marked packets: turn it off if sound crackles or the picture stutters only on one router. Devices outside the local network are never marked. Video is marked as audio-video traffic (DSCP 40) and audio as voice (DSCP 56), through the Windows qWAVE service, when the device asks for it. Applies from the next stream."
control = { kind = "toggle" }
console = { group = "Network, administration and commands", label = "Prioritize stream traffic with DSCP marks (local network)", control = "bool" }

[[setting]]
key = "bandwidth_probe"
part = "basics_core"
type = "bool"
default = true
tier = "always-on"
category = "network"
group = "Streams"
label = "Bandwidth test"
description = "Lets paired devices time a short download to measure the network before they pick a bitrate. Leave it on: the device decides whether to run it, and off refuses the download."
control = { kind = "toggle" }
rust_accessor = { kind = "bool", method = "bandwidth_probe", doc = "`GET /bandwidth-probe` for paired devices (`bandwidth_probe`, on by default)." }

[[setting]]
