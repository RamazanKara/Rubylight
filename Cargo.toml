[workspace]
members = ["rust/core", "rust/core/native-api", "rust/windows", "rust/host", "rust/vulkan-layer", "rust/setup", "rust/drivers/rubylight-vdisplay-proto"]
# The virtual display driver builds alone under the WDK toolchain: see rust/drivers/rubylight-vdisplay.
# Nightjar keeps its own workspace in client/protocol; the host uses its protocol crate by path.
exclude = ["rust/drivers/rubylight-vdisplay", "client"]
resolver = "3"

[workspace.package]
version = "3.0.0-rc.3"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/RamazanKara/Rubylight"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

# Nightjar pins the native API types by git rev for its own builds; the host's interop tests build
# it against this repository's copy, so both sides speak the same version.
[patch."https://github.com/RamazanKara/Rubylight"]
rubylight-native-api = { path = "rust/core/native-api" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
