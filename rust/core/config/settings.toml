[[setting]]
key = "upnp"
part = "basics_core"
type = "bool"
default = false
restart = true
category = "network"
group = "Discovery and internet"
label = "Automatic port forwarding"
description = "Asks the router to forward the streaming ports (UPnP, PCP or NAT-PMP), opening them to the internet so devices can connect from anywhere. Turn it on only to play away from home."
details = "Works with routers that have UPnP, PCP or NAT-PMP turned on. The forwards are renewed while Rubylight runs and removed when it stops. With Console access on Any network, the console port is forwarded too. Browser guests' ports are forwarded only while an invite link works or a guest watches, and a link made for guests on the internet forwards them also with this off."
control = { kind = "toggle" }
caution_when = { when = { on = "upnp", default = false }, message = "The streaming ports are open to the internet while Rubylight runs." }
doc_summary = "Ask the router to forward the streaming ports so devices can connect over the internet, through UPnP, PCP or NAT-PMP, and open the IPv6 firewall for them. The router must have one of them turned on. The forwards are renewed while Rubylight runs and removed when it stops. With Console access on Any network, the console port is forwarded too. Browser guests' ports are forwarded only while an invite link works or a guest watches, and a link made for guests on the internet forwards them also with this off. [Play over the internet](#play-over-the-internet)"
console = { group = "Network, administration and commands", label = "Automatic router port forwarding (UPnP, PCP, NAT-PMP)", control = "bool" }

[[setting]]
key = "internet_play"
part = "basics_core"
type = "bool"
default = false
restart = true
category = "network"
group = "Discovery and internet"
label = "Play over the internet"
description = "Lets paired Nightjar devices reach this PC from other networks without port forwarding. The PC contacts public servers that see its public address; the Privacy page lists them."
details = "Only Nightjar uses the direct path, and only paired devices can read what the PC publishes. A device learns what it needs while it is on your network once. Two networks that both change ports for every destination (symmetric NAT) cannot open a direct path: forward the ports there instead. The PC finds its public address with STUN and meets devices through a public peer-to-peer directory (the Mainline DHT), where it leaves only encrypted notes that its paired devices can read. Nothing is downloaded or shared through it. A device tries your network first, then the PC's IPv6 address, then a port the router maps (Automatic port forwarding), and last a direct path both sides open through their routers. The PC contacts public STUN servers and directory nodes, which see its public address; the Privacy page lists them."
control = { kind = "toggle" }
doc_summary = "Let paired Nightjar devices reach this PC from outside your network without port forwarding, over a direct path found through public STUN servers and a public peer-to-peer directory. Needs a restart. [Play over the internet](#play-over-the-internet)"
console = { group = "Network, administration and commands", label = "Play over the internet (STUN, DHT rendezvous, direct paths)", control = "bool" }

