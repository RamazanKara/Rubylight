# rubylight-vgamepad: UMDF 2 VHF virtual gamepad driver for Rubylight.
#
# Derived from Nonary/libvirtualgamepad by Chase Payne (MIT).
[package]
name = "rubylight-vgamepad"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
target-umdf-version-minor = 15

[lib]
crate-type = ["cdylib"]

[build-dependencies]
wdk-build.workspace = true

[dependencies]
wdk-sys = { workspace = true, features = ["hid"] }
rubylight-vgamepad-proto.workspace = true

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
]

[lints]
workspace = true
