[[setting]]
key = "capture_poll_interval_us"
part = "video_stream"
type = "int"
default = 500
tier = "diagnostic"
advanced = true
category = "video"
group = "Capture troubleshooting"
label = "Capture poll interval"
description = "For troubleshooting: how long capture waits before checking again when no new frame is ready. Shorter waits notice new frames sooner and use more CPU time; leave it at 500 µs."
control = { kind = "number", min = 100, max = 1000, step = 50, unit = "µs" }

[[setting]]
key = "idd_push_fence_ring"
part = "video_stream"
type = "bool"
default = true
tier = "always-on"
advanced = true
category = "video"
group = "Capture troubleshooting"
label = "GPU fence transport"
description = "For troubleshooting: how frames from Rubylight’s virtual display driver reach the stream. Leave it on; turn it off only to rule it out when a virtual display’s picture misbehaves."
details = "End all streams before changing it. Off uses the keyed-mutex ring for frames from the Rubylight display driver. On needs a compatible Rubylight display driver and Copy and convert on a compute queue; without them, capture uses the keyed-mutex ring and the console shows a warning. Physical displays and other capture methods are unaffected. Under GPU load on an RX 7900 XT, the fence transport was no worse than the keyed-mutex ring on every measure."
control = { kind = "toggle" }
visible_when = { read_in = "capture", default = "auto", values = ["auto", "idd-push"], lower = true }
console = { group = "Video and capture", label = "GPU fence transport for direct driver push (on by default; turn off to use the keyed-mutex ring)", control = "bool" }
rust_accessor = { kind = "bool", method = "idd_push_fence_ring", doc = "Whether direct driver push (`idd-push`) uses the GPU fence ring (default true; false selects keyed-mutex ring)." }

[[setting]]
key = "capture_predictive_poll"
part = "video_stream"
type = "bool"
default = false
tier = "diagnostic"
advanced = true
category = "video"
group = "Capture troubleshooting"
label = "Predictive polling"
description = "For troubleshooting Desktop Duplication; leave it off. Checks for frames more often when the next one is due, which can catch them sooner in games with a steady frame rate."
details = "The expected time of the next frame comes from the recent frame rhythm."
inactive_hint = "Applies to Desktop Duplication, including fallback. Direct driver push, Windows Graphics Capture and AMD Direct Capture ignore it."
control = { kind = "toggle" }
visible_when = { read_not_in = "capture", default = "auto", values = ["wgc", "wgcc", "idd-push", "amd"], lower = true }

[[setting]]
key = "wgc_slot_aligned_publish"
part = "video_stream"
type = "bool"
default = false
tier = "diagnostic"
advanced = true
category = "video"
group = "Capture troubleshooting"
label = "Align capture with encoding"
description = "With Windows Graphics Capture, holds a new frame until just before the next encode if a newer one could arrive first. Try it if the display refreshes much faster than the stream."
details = "Applies to Windows Graphics Capture. Variable refresh rate (VRR) streams ignore it."
inactive_hint = "Only affects Windows Graphics Capture, including fallback. Direct driver push, Desktop Duplication and VRR streams ignore it."
control = { kind = "toggle" }
visible_when = { read_not_in = "capture", default = "auto", values = ["ddx", "dxgi", "idd-push"], lower = true }
console = { group = "Video and capture", label = "Align capture publication to frame slots", control = "bool" }

[[setting]]
key = "wgc_direct_encoder_input"
part = "video_stream"
type = "bool"
default = true
tier = "always-on"
advanced = true
category = "video"
group = "Capture troubleshooting"
label = "Encode from GPU memory"
description = "For troubleshooting an encoder. Leave it on: off copies every captured frame through system memory instead of handing it to the encoder on the GPU, which adds latency and CPU load."
control = { kind = "toggle" }
console = { group = "Video and capture", label = "Pass GPU capture directly to the encoder", control = "bool" }

[[setting]]
key = "gpu_compute_conversion"
part = "video_stream"
type = "bool"
default = true
tier = "always-on"
advanced = true
category = "video"
group = "Capture troubleshooting"
label = "Copy and convert on a compute queue"
description = "For troubleshooting. Leave it on: on Radeon and NVIDIA graphics cards whose driver supports it, capture and color conversion run beside a game instead of waiting behind it."
details = "Captured frames are copied and their colors converted on compute queues. Covers direct driver push, Desktop Duplication and Windows Graphics Capture. AMD AMF and NVIDIA NVENC then encode from the compute queue’s Direct3D 12 device, where NVENC has no weighted prediction. Capture textures that cannot be shared, and YUV 4:4:4 streams, convert on the graphics queue. Beside a game-like load on an RX 7900 XT, a conversion took 7.2 ms on the graphics queue and 0.22 to 0.29 ms on a compute queue."
control = { kind = "toggle" }
console = { group = "Video and capture", label = "Copy and convert captures on a compute queue", control = "bool" }

[[setting]]
key = "packed_444"
part = "video_stream"
type = "bool"
default = true
override_allowed = true
tier = "always-on"
advanced = true
category = "video"
group = "Codecs"
label = "Full chroma"
description = "Lets Nightjar devices ask for 4:4:4 (full-resolution color, for sharper colored text) over HEVC or AV1. Leave it on: a stream uses it only when the device’s own option asks."
details = "The host packs each 4:4:4 frame into an ordinary 4:2:0 picture and Nightjar puts it back together; stock Moonlight never sees the packed layout. On an RX 7900 XT a stream that used it showed still text and UI much sharper from a 5 Mbps target up, and took 1.2 ms longer to encode at 1080p and 2.0 ms at 1440p."
control = { kind = "toggle" }
console = { group = "Video and capture", label = "Full chroma for Nightjar", control = "bool" }
rust_accessor = { kind = "bool", method = "packed_444", doc = "Whether Nightjar clients are offered packed full chroma (`packed_444`, on unless turned off)." }

[[setting]]
key = "hevc_mode"
part = "video_stream"
type = "enum"
default = 0
override_allowed = true
restart = true
category = "video"
group = "Codecs"
label = "HEVC support"
description = "Whether devices may use HEVC, and HDR over it. Leave it on Automatic, which offers what the encoder passed when Rubylight started; Off removes HEVC and SDR only removes its HDR."
details = "A profile the encoder fails when Rubylight starts is never offered, whatever is chosen here. Off offers no HEVC, SDR only no HDR over HEVC, and SDR and HDR the same profiles as Automatic."
control = { kind = "select", options = [{ value = "0", label = "Automatic" }, { value = "1", label = "Off" }, { value = "2", label = "SDR only" }, { value = "3", label = "SDR and HDR" }] }
console = { group = "Video and capture", label = "HEVC support (0 auto, 1 disabled, 2 SDR, 3 HDR)", control = "number" }

[[setting]]
key = "av1_mode"
part = "video_stream"
type = "enum"
default = 0
override_allowed = true
restart = true
category = "video"
group = "Codecs"
label = "AV1 support"
description = "Whether devices may use AV1, and HDR over it. Leave it on Automatic, which offers what the encoder passed when Rubylight started; Off removes AV1 and SDR only removes its HDR."
details = "A profile the encoder fails when Rubylight starts is never offered, whatever is chosen here. Off offers no AV1, SDR only no HDR over AV1, and SDR and HDR the same profiles as Automatic."
control = { kind = "select", options = [{ value = "0", label = "Automatic" }, { value = "1", label = "Off" }, { value = "2", label = "SDR only" }, { value = "3", label = "SDR and HDR" }] }
console = { group = "Video and capture", label = "AV1 support (0 auto, 1 disabled, 2 SDR, 3 HDR)", control = "number" }

[[setting]]
key = "pyrowave"
part = "video_stream"
type = "bool"
default = true
restart = true
tier = "always-on"
category = "video"
group = "Codecs"
label = "PyroWave"
description = "Lets compatible devices ask for PyroWave, a very low-latency GPU codec that needs hundreds of Mbps and a fast wired network. Leave it on: other devices never see it."
details = "PyroWave encodes each frame on its own. Synthetic desktop and game tests suggest 277 Mbps for 720p60, 399 Mbps for 1080p60 or 1593 Mbps for 4K60 for clean pictures. Text and textures may lose detail below 139, 187 or 747 Mbps respectively. Quality depends on the picture. Leave network headroom for packet overhead and recovery data; 4K60 needs more than gigabit Ethernet. If the device or network cannot carry the rate, use HEVC or AV1."
control = { kind = "toggle" }
console = { group = "Video and capture", label = "Enable PyroWave for compatible devices", control = "bool" }

[[setting]]
key = "pyrowave_encode_overlap"
part = "video_stream"
type = "bool"
default = false
tier = "diagnostic"
advanced = true
category = "video"
group = "Codecs"
label = "Overlap PyroWave frames"
description = "For troubleshooting; leave it off. Prepares the next PyroWave frame while the GPU encodes the current one, only worth trying if an encode takes longer than a frame."
details = "Two frames are on the GPU at once, each with its own copy of the picture. Off encodes one frame at a time. Applies to the next stream. At 4K and 120 fps on an RX 7900 XT the encode never held the next frame up, so the overlap measured no lower latency."
inactive_hint = "Turn on PyroWave to use this setting."
control = { kind = "toggle" }
visible_when = { on = "pyrowave", default = true }
doc_summary = "For troubleshooting; leave it off. Prepares the next PyroWave frame while the GPU still encodes the current one: two frames are on the GPU at once, each with its own copy of the picture. Off encodes one frame at a time, as earlier versions did; at 4K and 120 fps the overlap measured no lower latency. Applies to the next stream."
console = { group = "Video and capture", label = "Prepare the next PyroWave frame while the current one encodes", control = "bool" }
rust_accessor = { kind = "bool", method = "pyrowave_encode_overlap", doc = "Whether PyroWave converts the next picture while the GPU still encodes the last one (`pyrowave_encode_overlap`, off by default)." }

[[setting]]
key = "rtx_video"
part = "video_stream"
type = "bool"
default = false
override_allowed = true
category = "video"
group = "RTX Video enhancement"
label = "RTX Video enhancement"
description = "Cleans up and sharpens the picture before it is encoded, and adds GPU work to every frame. Every app uses it unless the app or device turns it off."
details = "It reads SDR captures and the 16-bit HDR capture, not the 10-bit one. It works at the stream’s own size, without scaling, and adds its GPU work only while it runs. RTX HDR takes priority when both are on for an HDR stream of an SDR game."
inactive_hint = "Needs the NVIDIA components (Settings › Picture › Integrations) on an NVIDIA graphics card whose driver offers RTX Video enhancement."
control = { kind = "toggle" }
visible_when = { ref = "rtxVideo" }
host_gated = "nvidia"
host_reason = "rtx_video"
doc_summary = "Cleans up and sharpens the picture before it is encoded, at the stream’s own size."

[[setting]]
key = "rtx_video_intensity"
part = "video_stream"
type = "int"
default = 100
override_allowed = true
category = "video"
group = "RTX Video enhancement"
label = "Strength"
description = "How strongly RTX Video enhancement works, from 0 to 100. 0 leaves the picture unchanged."
details = "Each quarter is one of NVIDIA’s four quality levels: 1 to 25 is the lightest, 76 to 100 the strongest."
inactive_hint = "Needs the NVIDIA components (Settings › Picture › Integrations) on an NVIDIA graphics card whose driver offers RTX Video enhancement."
control = { kind = "number", min = 0, max = 100, step = 1 }
visible_when = { ref = "rtxVideo" }
host_gated = "nvidia"
host_reason = "rtx_video"

[[setting]]
key = "prefer_sdr_10bit"
part = "video_stream"
type = "bool"
default = false
category = "hdr"
group = "HDR"
label = "Prefer 10-bit SDR"
description = "When a device asks for HDR, sends 10-bit SDR instead and keeps the display in SDR: less banding, but no HDR picture. Leave it off if you want HDR."
details = "Not applied while RTX HDR converts the stream. Devices and apps can override it."
control = { kind = "toggle" }

[[setting]]
key = "hdr_dynamic_metadata"
part = "video_stream"
type = "bool"
default = true
override_allowed = true
category = "hdr"
group = "HDR"
label = "HDR dynamic metadata"
description = "Adds HDR10+ brightness statistics to HDR video, so a compatible display tone-maps scene by scene. Leave it on; turn it off if a display handles brightness worse with it."
details = "Devices without HDR10+ ignore the statistics. HDR10+ goes into HEVC and AV1 streams. HEVC streams also carry HDR Vivid (CUVA 005.1) statistics. Moonlight drops them from HEVC before the decoder; Nightjar keeps them. In AV1 they reach any client whose decoder reads them. Packed 4:4:4 streams carry static HDR10 only: the device unpacks the picture itself, so no decoder would read them."
control = { kind = "toggle" }
console = { group = "Displays and HDR", label = "HDR10+ and HDR Vivid dynamic metadata", control = "bool" }
rust_accessor = { kind = "bool", method = "hdr_dynamic_metadata", doc = "HDR10+ and HDR Vivid dynamic metadata in HDR streams (`hdr_dynamic_metadata`, on by default)." }

[[setting]]
key = "hdr_sdr_tone_map"
part = "video_stream"
type = "bool"
default = false
override_allowed = true
