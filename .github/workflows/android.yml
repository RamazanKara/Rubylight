name: Android debug

on:
  push:
    branches: [main]
    # Docs, store listing and artwork sources don't change the APK.
    paths-ignore: ['**/*.md', 'docs/**', 'fastlane/**', 'store-assets/**', 'LICENSE.txt']
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: Run the emulator smoke test and publish an arm64 debug APK as this pre-release tag
        type: string
        default: ''
      release_notes:
        description: Release notes for the pre-release (Markdown)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check generated settings and documentation links
        run: |
          python3 scripts/generate-settings.py
          git diff --exit-code -- docs/settings.md
          node --test scripts/check-doc-links.test.mjs
          node scripts/check-doc-links.mjs
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # only the pre-release step uses the token
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug APK, lint and run unit tests
        run: bash gradlew --no-daemon --max-workers=2 :app:assembleNonRootDebug :app:lintNonRootDebug :app:testNonRootDebugUnitTest
      - name: Check native frame parsing and negotiation
        run: |
          g++ -std=c++17 -O2 app/src/test/native/pyrowave_frame_test.cpp -o /tmp/pyrowave-frame-test
          /tmp/pyrowave-frame-test
          gcc -std=c11 -O2 app/src/test/native/control_negotiation_test.c -o /tmp/control-negotiation-test
          /tmp/control-negotiation-test
      - name: Check microphone packets against the host's vectors
        run: |
          m=app/src/main/jni/moonlight-core
          cc -std=gnu11 -O2 -DHAS_SOCKLEN_T=1 -DHAVE_CLOCK_GETTIME=1 -I $m -I $m/moonlight-common-c/src \
            -I $m/moonlight-common-c/enet/include app/src/test/native/microphone_packet_test.c \
            $m/moonlight-common-c/src/PlatformCrypto.c -lcrypto -o /tmp/microphone-packet-test
          /tmp/microphone-packet-test
      - uses: actions/upload-artifact@v7
        with:
          name: butterpollo-debug
          path: app/build/outputs/apk/nonRoot/debug/app-nonRoot-debug.apk
          if-no-files-found: error
      - name: Emulator smoke test
        if: inputs.prerelease_tag
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          image='system-images;android-35;google_apis;x86_64'
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" emulator platform-tools "$image" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n sunset -k "$image" -d pixel_6
          pip install --quiet pillow
          BUTTERPOLLO_EMULATOR_GPU=swiftshader_indirect BUTTERPOLLO_BOOT_TIMEOUT=420 python3 scripts/emulator-smoke.py ||
            { grep -E 'ERROR|FATAL' app/build/emulator-smoke/emulator.log | tail -n 5; exit 1; }
      - name: Build arm64 test APK
        if: inputs.prerelease_tag
        run: |
          bash gradlew --no-daemon --max-workers=2 -PabiFilters=arm64-v8a :app:assembleNonRootDebug
          cp app/build/outputs/apk/nonRoot/debug/app-nonRoot-debug.apk butterpollo-arm64-debug.apk
      - name: Publish pre-release
        if: inputs.prerelease_tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.prerelease_tag }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          zip -qj smoke-screenshots.zip docs/screenshots/*.png
          gh release create "$TAG" butterpollo-arm64-debug.apk smoke-screenshots.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "$TAG (debug test build)" \
            --notes "${NOTES:-Debug-signed arm64 test build from $GITHUB_SHA. Uninstall builds signed by another CI run first.}"
      - uses: actions/upload-artifact@v7
        if: always() && inputs.prerelease_tag
        with:
          name: butterpollo-device-test
          path: |
            butterpollo-arm64-debug.apk
            docs/screenshots/
            app/build/emulator-smoke/
          if-no-files-found: warn
