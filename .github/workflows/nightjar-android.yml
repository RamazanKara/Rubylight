name: Nightjar Android

# Nightjar's android.yml for client/ in this repo. The nightjar mirror keeps
# running client/.github/workflows (including pre-releases and releases).
on:
  push:
    branches: [main]
    # Docs, store listing and artwork sources don't change the APK.
    paths: ['client/**', '!client/**/*.md', '!client/docs/**', '!client/fastlane/**', '!client/store-assets/**', '!client/LICENSE.txt', '!client/.github/**', '.github/workflows/nightjar-android.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The root rust-toolchain.toml pins the host's compiler; Nightjar builds with
  # stable, as in the mirror.
  RUSTUP_TOOLCHAIN: stable

defaults:
  run:
    working-directory: client

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check generated settings and documentation links
        run: |
          python3 scripts/generate-settings.py
          git diff --exit-code -- docs/settings.md
          python3 scripts/test_gen_design_tokens.py
          python3 scripts/test_play_upload.py
          node --test scripts/check-doc-links.test.mjs scripts/build-release.test.mjs scripts/add-device-results.test.mjs scripts/device-docs.test.mjs scripts/device-results-issue.test.mjs
          node scripts/check-doc-links.mjs
          node scripts/device-docs.mjs --check
  desktop:
    # The Windows/Linux client: Linux build, unit tests and clippy (SDL3 is built from source).
    # 24.04 for its glslang-tools 15.1.0, which rebuilds the PQ pass's SPIR-V byte for byte.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # SDL with the Vulkan interop patch (client/protocol/vendor/sdl3-src/README.md).
      - name: SDL source
        run: git submodule update --init --depth 1 protocol/vendor/sdl3-src/SDL
      # Compiled dependencies (SDL3's C objects among them, built against this image).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: 'client/protocol -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The runner's Ubuntu mirror has crawled at about 45 kB/s (cmake's 11 MB alone took
      # 4 minutes, and libudev-dev pulls a systemd update), three times past the job timeout.
      # The downloaded packages are cached between runs; the runner image has its own cmake.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/apt-archives
          key: desktop-apt-${{ runner.os }}-${{ hashFiles('.github/workflows/nightjar-android.yml') }}
          restore-keys: desktop-apt-${{ runner.os }}-
      - name: Install desktop build packages
        timeout-minutes: 25
        run: |
          mkdir -p ~/apt-archives/partial
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300 -o Dir::Cache::Archives=$HOME/apt-archives -o APT::Keep-Downloaded-Packages=true"
          sudo apt-get $apt update -q
          sudo apt-get $apt install -y -q --no-install-recommends ninja-build pkg-config libclang-dev \
            libavcodec-dev libavutil-dev libopus-dev libva-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libegl-dev libgl-dev libgles-dev libdrm-dev libgbm-dev libpulse-dev \
            libasound2-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libdecor-0-dev \
            glslang-tools libvulkan1 mesa-vulkan-drivers
          sudo chown -R "$USER" ~/apt-archives
          cmake --version | head -n 1
      - name: Test and lint the desktop client
        run: |
          cd protocol
          cargo clippy -p nightjar-desktop --all-targets --locked -- -D warnings
          cargo test -p nightjar-desktop --locked
      # The PQ pass: its SPIR-V against glslang 15 (a missing or other glslang fails here), and the
      # ignored GPU test on Mesa's software Vulkan (lavapipe, the runner has no GPU).
      - name: Test the PQ present pass
        env:
          NIGHTJAR_REQUIRE_GLSLANG: '1'
        run: |
          cd protocol
          cargo test -p nightjar-desktop --locked -- pq_present --include-ignored
  # The APKs, lint, the JVM unit tests and the native sanitizer runs are four jobs that run side
  # by side; together they took 26-32 minutes as one job.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      # Gradle's downloads. The key changes with every version bump (app/build.gradle), so a bump's
      # run starts from the previous entry instead of downloading everything; only main saves.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('client/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('client/**/*.gradle', 'client/gradle.properties') }}
          restore-keys: gradle-${{ hashFiles('client/gradle/wrapper/gradle-wrapper.properties') }}-
      # The protocol crate's compiled dependencies for the tests and the four Android targets.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: 'client/protocol -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test and rebuild the shipped Rust protocol
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          sudo apt-get update -qq
          sudo apt-get install -y llvm libssl-dev
          bash protocol/build-android.sh
      - name: Configure a disposable signing key for minified build validation
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/validation.p12" -storetype PKCS12 \
            -alias validation -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=Nightjar CI validation' -storepass validation -keypass validation
          echo "BP_KEYSTORE=$RUNNER_TEMP/validation.p12" >> "$GITHUB_ENV"
          echo 'BP_KEYSTORE_PASSWORD=validation' >> "$GITHUB_ENV"
          echo 'BP_KEY_ALIAS=validation' >> "$GITHUB_ENV"
          echo 'BP_KEY_PASSWORD=validation' >> "$GITHUB_ENV"
      - name: Build both flavors
        run: >-
          bash gradlew --no-daemon --max-workers=4
          :app:assembleNonRootDebug :app:assembleNonRootRelease :app:assembleRootRelease
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightjar-debug
          path: client/app/build/outputs/apk/nonRoot/debug/app-nonRoot-debug.apk
          if-no-files-found: error
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('client/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('client/**/*.gradle', 'client/gradle.properties') }}
          restore-keys: gradle-${{ hashFiles('client/gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Configure a disposable signing key for the release variants
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/validation.p12" -storetype PKCS12 \
            -alias validation -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=Nightjar CI validation' -storepass validation -keypass validation
          echo "BP_KEYSTORE=$RUNNER_TEMP/validation.p12" >> "$GITHUB_ENV"
          echo 'BP_KEYSTORE_PASSWORD=validation' >> "$GITHUB_ENV"
          echo 'BP_KEY_ALIAS=validation' >> "$GITHUB_ENV"
          echo 'BP_KEY_PASSWORD=validation' >> "$GITHUB_ENV"
      # The release variants lint as the release scripts build them; nonRoot debug is the dev build.
      - name: Lint both flavors
        run: >-
          bash gradlew --no-daemon --max-workers=4
          :app:lintNonRootDebug :app:lintNonRootRelease :app:lintRootRelease
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('client/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('client/**/*.gradle', 'client/gradle.properties') }}
          restore-keys: gradle-${{ hashFiles('client/gradle/wrapper/gradle-wrapper.properties') }}-
      # The shared suite runs in the nonRoot flavor; the root flavor's task runs src/testRoot's
      # tests (app/build.gradle). Two test JVMs: four took 490 s on the runner's four cores, two 376 s.
      - name: Run the unit tests
        run: >-
          bash gradlew --no-daemon --max-workers=4
          :app:testNonRootDebugUnitTest :app:testRootDebugUnitTest
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check all native regressions with sanitizers
        run: |
          bash scripts/test-native.sh
