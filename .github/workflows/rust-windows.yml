name: Rubylight Windows
permissions: {}
on:
  push:
    branches: [main]
    # A release tag publishes the GitHub release (tag and publish below).
    # GitHub ignores paths for tag pushes, so a tag always runs.
    tags: ['v2.*', 'v3.*']
    # Changes to docs and Markdown alone don't run CI; a release of such a
    # commit builds it in the windows job.
    paths: ['rust/**', '!rust/**/*.md', 'Cargo.*', 'rust-toolchain.toml', '.cargo/**', 'clippy.toml', 'third-party/**', '.github/workflows/rust-windows.yml']
  pull_request:
    paths: ['rust/**', '!rust/**/*.md', 'Cargo.*', 'rust-toolchain.toml', '.cargo/**', 'clippy.toml', 'third-party/**', '.github/workflows/rust-windows.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Release the version in Cargo.toml (main only); tags it like a pushed tag would
        type: boolean
        default: false
      notes:
        description: Only rewrite the published release's text from rust/RELEASE_NOTES.md on main; no build
        type: boolean
        default: false
concurrency:
  # A release run is never cancelled by a later push to main.
  group: butterpollo-rust-${{ github.ref }}-${{ inputs.publish && 'publish' || inputs.notes && 'notes' || 'ci' }}
  cancel-in-progress: true
jobs:
  # A tag must match Cargo.toml and have its release notes. When main's run
  # already built and tested the commit, the release reuses that build.
  tag:
    if: startsWith(github.ref, 'refs/tags/') || (inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.built.outputs.run }}
      sign: ${{ steps.built.outputs.sign }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            version=${tag#v}
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            tag=v$version
            if [ -n "$(git ls-remote --tags origin "refs/tags/$version" "refs/tags/$tag")" ]; then
              echo "::error::$version is already tagged; bump the version first"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 rust/release/notes.py "$tag" --out "$RUNNER_TEMP/body.md"
      - id: built
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        run: |
          # With SignPath configured every release is signed, and only release
          # runs sign (SignPath asks an approver for each request), so a
          # signed release always builds afresh instead of reusing main's
          # unsigned build.
          if [ -n "$SIGNPATH_PROJECT" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "::notice::building $GITHUB_SHA afresh to sign it with SignPath"
            exit 0
          fi
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow rust-windows.yml --branch main --commit "$GITHUB_SHA" \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ]; then
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '.artifacts[] | select(.name == "butterpollo-rust-windows-x64" and .expired == false) | .id') || artifact=
            if [ -z "$artifact" ]; then run=; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then echo "::notice::reusing the build of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"; fi
  windows:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result != 'failure' && !needs.tag.outputs.run && !inputs.notes }}
    runs-on: windows-2022
    # A signed release builds without the cache and waits for a SignPath
    # approver once per request (up to three requests, an hour each). A
    # cached run took 48 minutes in October 2026, so 50 cut one off.
    timeout-minutes: ${{ needs.tag.outputs.sign == 'true' && 240 || 75 }}
    permissions:
      contents: read
      actions: read
    env:
      # Only release runs sign, and only once SignPath is configured: the
      # SignPath Foundation's release policy needs a manual approval for every
      # signing request, so main's pushes and pull requests stay unsigned.
      SIGNPATH_ENABLED: ${{ needs.tag.outputs.sign == 'true' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-opus
      - name: Rust toolchains
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc --toolchain 1.98.1-x86_64-pc-windows-gnu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The display driver's own workspace (rust/drivers/rubylight-vdisplay).
          rustup toolchain install 1.98.1-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # The display driver builds against the Windows Driver Kit (IddCx stub,
      # stampinf, Inf2Cat); installed only when the image lacks it.
      - name: Windows Driver Kit
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $ready = { (Test-Path "$kits\Lib\*\um\x64\iddcx\*\IddCxStub.lib") -and (Test-Path "$kits\bin\*\x86\Inf2Cat.exe") -and (Test-Path "$kits\bin\*\x64\stampinf.exe") }
          if (& $ready) { Get-ChildItem "$kits\Lib\*\um\x64\iddcx" -Directory | ForEach-Object FullName; exit 0 }
          winget install --id Microsoft.WindowsWDK.10.0.26100 --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if (!(& $ready)) { throw 'The Windows Driver Kit is still missing after installing it' }
      # The web console build needs Vite 7's Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Check the web console
        working-directory: rust/web
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test "*.test.mjs"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check release notes tooling
        run: |
          python -m unittest discover -s rust/release -p test_release.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s rust/release -p test_gpu_hang.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s rust/release -p test_timing_report.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # A signed release is built from this run's checkout and downloads,
      # never from an earlier run's cache.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: env.SIGNPATH_ENABLED != 'true'
        with:
          path: |
            ~/AppData/Local/ButterpolloRust/sdk
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-sdk-v4-pyro-502a3b52-patched
      - name: Test, lint and package Rust
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          .\rust\build.ps1 -MsysRoot '${{ steps.msys.outputs.msys2-location }}' -FetchDependencies -Package -TargetDirectory "$env:RUNNER_TEMP\butterpollo-rust-target"
      # SignPath signs a file only when its version information names
      # Rubylight and the release; every build checks that it would.
      - name: Check release binary metadata
        run: |
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          .\rust\release\sign-artifacts.ps1 -Phase CheckMetadata -TargetDirectory "$env:RUNNER_TEMP\butterpollo-rust-target" -Version $version
      - name: Prepare signing
        if: env.SIGNPATH_ENABLED == 'true'
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if (!$env:SIGNPATH_TOKEN -or !$env:ORGANIZATION -or !$env:POLICY) { throw 'Incomplete SignPath configuration; refusing an unsigned fallback' }
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          .\rust\release\sign-artifacts.ps1 -Phase StageBinaries -TargetDirectory "$env:RUNNER_TEMP\butterpollo-rust-target" -SigningDirectory "$env:RUNNER_TEMP\unsigned-binaries" -Version $version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: env.SIGNPATH_ENABLED == 'true'
        id: unsigned-binaries
        with:
          name: unsigned-binaries
          path: ${{ runner.temp }}/unsigned-binaries/
          if-no-files-found: error
          retention-days: 1
      - name: Sign release binaries
        if: env.SIGNPATH_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.RELEASE_VERSION) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-binaries
      - name: Apply signed binaries
        if: env.SIGNPATH_ENABLED == 'true'
        run: .\rust\release\sign-artifacts.ps1 -Phase ApplyBinaries -TargetDirectory "$env:RUNNER_TEMP\butterpollo-rust-target" -SigningDirectory "$env:RUNNER_TEMP\signed-binaries" -Version $env:RELEASE_VERSION
      # Rubylight's own display driver (rust/drivers/rubylight-vdisplay), which
      # rust/build.ps1 puts in the package: its DLL is signed with the binaries
      # above, Inf2Cat catalogs the signed DLL and the "driver" request signs
      # the catalog; setup then installs that catalog instead of signing one on
      # the user's PC. Packages without the driver skip this.
      - name: Catalog the display driver
        if: env.SIGNPATH_ENABLED == 'true'
        id: driver
        run: |
          if (!(Test-Path -LiteralPath "$env:RUNNER_TEMP\butterpollo-rust-target\butterpollo-rust-release\drivers\rubylight-display")) { exit 0 }
          .\rust\release\sign-artifacts.ps1 -Phase StageDriver -TargetDirectory "$env:RUNNER_TEMP\butterpollo-rust-target" -SigningDirectory "$env:RUNNER_TEMP\unsigned-driver" -Version $env:RELEASE_VERSION
          'present=true' >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.driver.outputs.present == 'true'
        id: unsigned-driver
        with:
          name: unsigned-driver
          path: ${{ runner.temp }}/unsigned-driver/
          if-no-files-found: error
          retention-days: 1
      - name: Sign display driver catalog
        if: steps.driver.outputs.present == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: driver
          github-artifact-id: ${{ steps.unsigned-driver.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.RELEASE_VERSION) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-driver
      - name: Apply signed driver catalog
        if: steps.driver.outputs.present == 'true'
        run: .\rust\release\sign-artifacts.ps1 -Phase ApplyDriver -TargetDirectory "$env:RUNNER_TEMP\butterpollo-rust-target" -SigningDirectory "$env:RUNNER_TEMP\signed-driver" -Version $env:RELEASE_VERSION
      - name: Repackage signed binaries
        if: env.SIGNPATH_ENABLED == 'true'
        run: |
          $target = "$env:RUNNER_TEMP\butterpollo-rust-target"
          .\rust\release\package.ps1 -Distribution "$target\butterpollo-rust-release" -TargetDirectory $target -Stub "$target\release\butterpollo-setup.exe" -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: env.SIGNPATH_ENABLED == 'true'
        id: unsigned-installer
        with:
          name: unsigned-installer
          path: ${{ runner.temp }}/butterpollo-rust-target/butterpollo-setup-*.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign installer
        if: env.SIGNPATH_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.RELEASE_VERSION) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-installer
      - name: Verify signed installer
        if: env.SIGNPATH_ENABLED == 'true'
        run: .\rust\release\sign-artifacts.ps1 -Phase ApplyInstaller -TargetDirectory "$env:RUNNER_TEMP\butterpollo-rust-target" -SigningDirectory "$env:RUNNER_TEMP\signed-installer" -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: butterpollo-rust-windows-x64
          # The portable package and the setup that carries it.
          path: |
            ${{ runner.temp }}/butterpollo-rust-target/butterpollo-rust-release.zip
            ${{ runner.temp }}/butterpollo-rust-target/butterpollo-setup-*.exe
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [tag, windows]
    if: ${{ !cancelled() && needs.tag.result == 'success' && (needs.tag.outputs.run || needs.windows.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag.outputs.version }}
      TAG: ${{ needs.tag.outputs.tag }}
      BUILD: ${{ needs.tag.outputs.run || github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Publish the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1 || gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::notice::$VERSION is already published"
            exit 0
          fi
          python3 rust/release/notes.py "$TAG" --out body.md --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BUILD"
          gh run download "$BUILD" -n butterpollo-rust-windows-x64 -D build
          mkdir out
          mv "build/butterpollo-setup-$VERSION.exe" "out/rubylight-setup-$VERSION.exe"
          mv build/butterpollo-rust-release.zip "out/rubylight-$VERSION-windows-x64.zip"
          (cd out && sha256sum * > SHA256SUMS)
          flags=()
          if [[ $VERSION == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Rubylight $VERSION" --notes-file body.md "${flags[@]}" out/*
          echo "::notice::published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
  # Corrects a published release's text after the fact, keeping its assets
  # and its link to the run that built it.
  notes:
    if: inputs.notes && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Rewrite the release text
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag=v$version
          if ! gh release view "$tag" > /dev/null 2>&1; then tag=$version; fi
          run=$(gh release view "$tag" --json body --jq .body | grep -o 'https://github.com/[^)]*/actions/runs/[0-9]*' | head -n 1 || true)
          python3 rust/release/notes.py "$tag" --out body.md --run "$run"
          gh release edit "$tag" --notes-file body.md
          echo "::notice::rewrote the text of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
