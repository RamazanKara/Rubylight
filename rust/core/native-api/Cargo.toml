[package]
name = "rubylight-native-api"
# Versioned on its own, not with the host: the wire format changes when the API
# does. rust/release/bump.py leaves it alone.
version = "1.0.0"
# Nothing here is inherited from the workspace: Nightjar's workspace pins
# edition 2021 and Rust 1.80 (no let-chains), and a 1.80 cargo must be able to
# read this manifest without the root one.
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-only"
repository = "https://github.com/RamazanKara/Rubylight"
description = "Wire types of the Rubylight native API v1 (host and Nightjar)"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

# The same lints as the workspace's, copied because they can't be inherited.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
