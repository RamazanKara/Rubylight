[[setting]]
key = "frame_limiter_enable"
part = "display_extras"
type = "bool"
default = false
override_allowed = true
category = "frame-limiting"
group = "Frame limiter"
label = "Limit every stream"
description = "Caps games at the stream’s FPS on monitor streams too, for even frame pacing; the game then runs no faster than that on your monitor. Virtual-display streams are capped already."
details = "Virtual-display streams are already limited unless Virtual display refresh is off. That automatic limit switches off while the stream’s display refreshes below one and a half times the limit, such as 60 Hz under a 60 FPS limit (a game in exclusive fullscreen set its own mode, or the display could not get a faster one): there the display’s refresh paces the game, and a limit beside it makes the picture stutter every few seconds. With this setting on, the cap stays in that case too. The cap is the Frame limit, or the stream’s frame rate. It needs RTSS (see Limiter): without it the stream says the frame limit was not applied."
inactive_hint = "Limiter is None, so nothing caps games. Choose Automatic or RTSS under Limiter to use this setting."
control = { kind = "toggle" }
visible_when = { ref = "rtss" }
console = { group = "Frame generation and limiting", label = "Enable frame limiter", control = "bool" }

[[setting]]
key = "frame_limiter_provider"
part = "display_extras"
type = "enum"
default = "auto"
override_allowed = true
category = "frame-limiting"
group = "Frame limiter"
label = "Limiter"
description = "What caps the game’s FPS. Automatic and RTSS both use RivaTuner Statistics Server (RTSS), which must be installed; leave it on Automatic, or choose None to turn all limiting off."
details = "On a PC without RTSS, Automatic leaves the automatic limit on virtual displays off without a warning, while RTSS, or Limit every stream, says on the stream that the limit was not applied. Rubylight starts RTSS when a limit is needed and puts its previous limit back after the stream. None also turns off the automatic limit on virtual displays."
control = { kind = "select", options = [{ value = "auto", label = "Automatic" }, { value = "rtss", label = "RTSS" }, { value = "none", label = "None" }] }
aliases = { match = "letters", spellings = { disabled = "none" } }
console = { group = "Frame generation and limiting", label = "Limiter provider", control = "choice", choices = ["auto", "rtss", "none"] }

[[setting]]
key = "frame_limiter_fps_limit"
part = "display_extras"
type = "int"
default = 0
override_allowed = true
category = "frame-limiting"
group = "Frame limiter"
label = "Frame limit"
description = "The FPS games are capped at while streaming; 0 uses the stream’s frame rate. Leave it at 0 unless games should run at another rate; RTSS keeps decimals such as 59.94."
inactive_hint = "Limiter is None, so nothing caps games. Choose Automatic or RTSS under Limiter to use this setting."
control = { kind = "number", min = 0, max = 1000, step = 0.001, unit = "fps" }
visible_when = { ref = "rtss" }
console = { group = "Frame generation and limiting", label = "Frame limit (0 uses the device rate)", control = "number" }

[[setting]]
key = "virtual_display_refresh"
part = "display_extras"
type = "enum"
default = "legacy"
override_allowed = true
category = "frame-limiting"
group = "Frame limiter"
label = "Virtual display refresh"
description = "A virtual display’s refresh rate: twice the stream rate is the default; 480 Hz or 1000 Hz spaces a capped game’s frames more evenly. Off also ends the automatic FPS cap."
details = "Every choice but Off also caps games at the frame limit and uses 1000 Hz when the device asks for VRR; a display that refuses the chosen refresh uses the fastest refresh it offers below it. Off runs the display at the stream’s frame rate. On an RX 7900 XT, with a test picture capped at 60 fps for 5 minutes each, 0.04 % of frame intervals were more than 4 ms off at 1000 Hz, 0.23 % at twice and 2.22 % at four times the stream rate, with the same time from capture to send. An October run found 1000 Hz about 1 ms slower from render to received at 60 fps (14.28 against 13.15 ms)."
control = { kind = "select", options = [{ value = "legacy", label = "Twice the stream rate" }, { value = "enabled", label = "Four times the stream rate" }, { value = "480hz", label = "480 Hz" }, { value = "vrr", label = "1000 Hz" }, { value = "disabled", label = "Off" }] }
aliases = { match = "letters", spellings = { 0 = "disabled", 1 = "enabled", 480 = "480hz", 1000 = "vrr", 2x = "legacy", fixed-2x = "legacy", 8x = "480hz", fixed-480hz = "480hz", enable = "enabled", true = "enabled", yes = "enabled", on = "enabled", smooth = "enabled", smoother = "enabled", fixed-1000hz = "vrr", 1000hz = "vrr", disable = "disabled", false = "disabled", no = "disabled", off = "disabled" } }
console = { group = "Frame generation and limiting", label = "Virtual display refresh", control = "choice", choices = ["legacy", "enabled", "480hz", "fixed-1000hz", "disabled"] }

