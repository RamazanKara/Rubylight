[[setting]]
key = "dd_refresh_rate_option"
part = "display_screen"
type = "enum"
default = "auto"
override_allowed = true
category = "display"
group = "Resolution and refresh rate"
label = "Refresh rate"
description = "The refresh rate of the streamed display. Match the stream suits almost everyone: a streamed monitor switches to the stream’s FPS, where it has that rate, and back afterwards."
details = "Highest available sets a monitor to its fastest rate at that resolution, and Keep the current refresh rate leaves it alone; a monitor slower than the stream’s frame rate cannot supply that many new frames. On a virtual display, matching follows Virtual display refresh under Frame limiting, and the highest and current choices apply to monitors only. With Monitor setup on Leave the monitors alone, a monitor’s refresh rate is never changed."
control = { kind = "select", options = [{ value = "auto", label = "Match the stream" }, { value = "prefer_highest", label = "Highest available" }, { value = "disabled", label = "Keep the current refresh rate" }, { value = "manual", label = "Use a fixed refresh rate" }], fixed = { value = "manual", key = "dd_manual_refresh_rate" } }
console = { group = "Displays and HDR", label = "Refresh policy", control = "choice", choices = ["disabled", "auto", "manual", "prefer_highest"] }

[[setting]]
key = "dd_manual_refresh_rate"
part = "display_screen"
type = "int"
default = ""
override_allowed = true
category = "display"
group = "Resolution and refresh rate"
label = "Fixed refresh rate"
description = "Streams fail to start while this is empty. In Hz, such as 59.94; a rate below the stream’s FPS cannot supply every frame, and a virtual display loses its faster automatic refresh."
details = "In hertz, from 1 to 1000, with up to three decimals such as 59.94 or 119.88. On a virtual display it replaces the refresh that Virtual display refresh sets (twice the stream rate by default), which captures each game frame sooner. A monitor that has no such rate keeps its own."
inactive_hint = "Choose Use a fixed refresh rate under Refresh rate to apply this value."
part_of = "dd_refresh_rate_option"
control = { kind = "number", min = 1, max = 1000, step = 0.001, unit = "Hz" }
visible_when = { read_eq = "dd_refresh_rate_option", default = "auto", value = "manual" }
required_when = { read_eq = "dd_refresh_rate_option", default = "auto", value = "manual" }
doc_default = "empty"
console = { group = "Displays and HDR", label = "Manual refresh rate (supports 59.94, 119.88)", control = "number" }

[[setting]]
key = "dd_mode_remapping"
part = "display_screen"
type = "json"
default = { mixed = [], resolution_only = [], refresh_rate_only = [] }
override_allowed = true
advanced = true
category = "display"
group = "Mode substitutions"
label = "Mode substitutions (JSON)"
description = "Rules that give the streamed display another resolution or refresh rate than a device asks for; a malformed rule stops streams from starting. Leave it empty unless you need one."
details = "Each entry matches requested_resolution and requested_fps and sets final_resolution and final_refresh_rate. The first matching entry is used. The mixed list is used when resolution and refresh rate both match the device, resolution_only or refresh_rate_only when only that one does. Resolutions are WIDTHxHEIGHT; a result outside 320x200 to 7680x4320 or 1 to 1000 Hz also stops the stream from starting."
inactive_hint = "Choose Match the device for Resolution or Match the stream for Refresh rate to apply substitutions."
control = { kind = "json" }
visible_when = { any = [{ read_eq = "dd_resolution_option", default = "auto", value = "auto" }, { read_eq = "dd_refresh_rate_option", default = "auto", value = "auto" }] }
doc_summary = "Changes a requested mode before it is applied. Each entry matches requested_resolution and requested_fps and sets final_resolution and final_refresh_rate."
console = { group = "Displays and HDR", label = "Resolution and refresh remapping", control = "json" }

