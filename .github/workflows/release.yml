name: Release

# A pushed v* tag builds the signed release APKs and bundle and the desktop client
# (Windows zip, Linux tar.gz) and attaches them to the GitHub release for that tag
# (created here when it does not exist yet). The desktop jobs run first and the
# release job needs them, so a tag publishes everything or nothing.
# Main's own CI (android.yml) already tested the commit: tag a commit whose
# main run is green. The signing key and passwords are repository secrets,
# see "Releasing from CI" in docs/building.md.
#
# Run it by hand with dry_run (the default) to build and verify without
# publishing; this is the first step before a real tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -e -o pipefail

jobs:
  desktop-linux:
    # The Linux desktop client: protocol/desktop/package-linux.sh builds it (SDL3 from
    # source, linked statically) and packs nightjar-desktop-<version>-linux-x86_64.tar.gz.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the app version
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::no versionName in app/build.gradle"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install the build packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake ninja-build pkg-config libclang-dev \
            libavcodec-dev libavutil-dev libopus-dev libva-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libegl-dev libgl-dev libgles-dev libdrm-dev libgbm-dev libpulse-dev \
            libasound2-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libdecor-0-dev
      # A tag run only reads caches that runs on the default branch saved, so run
      # this workflow by hand on main (dry run) now and then to keep them warm.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: desktop-linux-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: desktop-linux-
      - name: Build and package
        run: bash protocol/desktop/package-linux.sh -v "$VERSION" -o "$GITHUB_WORKSPACE/dist"
      - name: Check the package
        run: |
          name="nightjar-desktop-$VERSION-linux-x86_64"
          tar -tzf "dist/$name.tar.gz" | tee contents.txt
          for file in nightjar README.md LINUX-RUNTIME.txt; do
            grep -qx "$name/$file" contents.txt || { echo "::error::$name.tar.gz has no $file"; exit 1; }
          done
          tar -xzOf "dist/$name.tar.gz" "$name/LINUX-RUNTIME.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  desktop-windows:
    # The Windows desktop client: GNU toolchain, SDL3 and Opus from MSYS2, and the
    # decode-only FFmpeg (protocol/desktop/ffmpeg-decode-only.sh), so the zip holds a few
    # DLLs instead of MSYS2's 80. package-windows.ps1 walks the import tables, fails when a
    # non-system DLL would be missing from the zip, and starts the unpacked exe once.
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      FFMPEG_VERSION: 8.1.2
      FFMPEG_SHA256: 464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the app version
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::no versionName in app/build.gradle"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Rust GNU toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
      - name: MSYS2 packages
        # The runner image's own MSYS2: package-windows.ps1 looks in C:\msys64\ucrt64\bin.
        run: |
          /c/msys64/usr/bin/pacman.exe -Sy --noconfirm --needed make \
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf \
            mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-opus mingw-w64-ucrt-x86_64-dav1d
      # A tag run only reads caches that runs on the default branch saved, so run
      # this workflow by hand on main (dry run) now and then to keep them warm.
      - name: Decode-only FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffprefix
          key: ffmpeg-decode-only-${{ env.FFMPEG_VERSION }}-${{ hashFiles('protocol/desktop/ffmpeg-decode-only.sh') }}
      - name: Build the decode-only FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSLf --retry 5 --retry-all-errors -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c -
          tar -xf ffmpeg.tar.xz
          # The script needs an MSYS2 UCRT64 shell; a login shell sets its PATH up.
          export MSYSTEM=UCRT64 CHERE_INVOKING=1
          /c/msys64/usr/bin/bash.exe -l -c 'bash protocol/desktop/ffmpeg-decode-only.sh "$(pwd)/ffmpeg-'"$FFMPEG_VERSION"'" "$(pwd)/ffprefix"'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: desktop-windows-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: desktop-windows-
      - name: Build, package and start the exe
        shell: pwsh
        run: >
          ./protocol/desktop/package-windows.ps1
          -FfmpegDir "$env:GITHUB_WORKSPACE\ffprefix"
          -Out "$env:GITHUB_WORKSPACE\dist"
          -TargetDirectory "$env:GITHUB_WORKSPACE\protocol\target"
          -Version $env:VERSION
      - name: Check the package
        run: |
          zip="dist/nightjar-desktop-$VERSION-windows-x86_64.zip"
          test -f "$zip" || { echo "::error::$zip was not built"; exit 1; }
          unzip -l "$zip"
          unzip -Z1 "$zip" | grep -qx 'nightjar.exe' || { echo "::error::$zip has no nightjar.exe"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # uploads to the release for this tag
    env:
      # The SHA-256 of the Nightjar release certificate (public). Updates only
      # work with this signing identity, so a build signed by anything else
      # must never be published.
      EXPECTED_CERT_SHA256: 312ed322c7c29d1aec4fae4a3979ebcb557af44d821d7f4746c0968548eb630b
      # Only a tag push (or a manual run on a tag with dry_run off) publishes.
      PUBLISH: ${{ github.ref_type == 'tag' && !inputs.dry_run }}
    steps:
      - name: Check the signing secrets
        env:
          NIGHTJAR_KEYSTORE_B64: ${{ secrets.NIGHTJAR_KEYSTORE_B64 }}
          NIGHTJAR_KEYSTORE_PASSWORD: ${{ secrets.NIGHTJAR_KEYSTORE_PASSWORD }}
          NIGHTJAR_KEY_ALIAS: ${{ secrets.NIGHTJAR_KEY_ALIAS }}
          NIGHTJAR_KEY_PASSWORD: ${{ secrets.NIGHTJAR_KEY_PASSWORD }}
        run: |
          missing=
          for name in NIGHTJAR_KEYSTORE_B64 NIGHTJAR_KEYSTORE_PASSWORD NIGHTJAR_KEY_ALIAS NIGHTJAR_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions (docs/building.md, Releasing from CI), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check the tag against the app version
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::no versionName in app/build.gradle"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName \"$version\" in app/build.gradle"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Decode the keystore
        env:
          NIGHTJAR_KEYSTORE_B64: ${{ secrets.NIGHTJAR_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$NIGHTJAR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nightjar-release.keystore"
      - name: Build the signed release
        # app/build.gradle reads these four (BP_*) variables and fails the
        # release build when any is missing; it never falls back to the debug key.
        env:
          BP_KEYSTORE: ${{ runner.temp }}/nightjar-release.keystore
          BP_KEYSTORE_PASSWORD: ${{ secrets.NIGHTJAR_KEYSTORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.NIGHTJAR_KEY_ALIAS }}
          BP_KEY_PASSWORD: ${{ secrets.NIGHTJAR_KEY_PASSWORD }}
        run: bash gradlew --no-daemon --max-workers=2 :app:assembleNonRootRelease :app:assembleRootRelease :app:bundleNonRootRelease
      - name: Verify the signature and the app IDs
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          # apksigner prints "Signer #1 certificate SHA-256 digest: <hex>" or, on
          # the runner, "V2 Signer: certificate SHA-256 digest: <hex>" (one line
          # per scheme: V2, V3, V3.1). Reduce them to the distinct digests; the
          # result must be exactly the expected one, so no line at all fails too.
          digests_of() { sed -n 's/^.*certificate SHA-256 digest: *//p' | tr -d '\r' | tr 'A-F' 'a-f' | sort -u; }
          check() { # apk, application ID
            "$apksigner" verify --print-certs "$1" | tee certs.txt | { grep -i 'certificate SHA-256' || true; }
            digests=$(digests_of < certs.txt)
            if [ "$digests" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$1 is signed by '$digests', not by the Nightjar release certificate"
              echo "::error::$1 is not signed by the Nightjar release certificate"
              exit 1
            fi
            package=$("$aapt2" dump packagename "$1")
            if [ "$package" != "$2" ]; then
              echo "::error::the application ID of $1 is $package, not $2"
              exit 1
            fi
          }
          check app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk com.butterpollo.client
          check app/build/outputs/apk/root/release/app-root-release.apk com.butterpollo.client.root
          # The bundle is signed like a jar. aapt2 cannot read its application ID;
          # it comes from the same nonRoot variant as the checked APK.
          bundle=app/build/outputs/bundle/nonRootRelease/app-nonRoot-release.aab
          # keytool prints "<tab> SHA256: AA:BB:..." under "Certificate fingerprints:".
          keytool -printcert -jarfile "$bundle" | tee certs.txt | { grep -E 'SHA256: ' || true; }
          fingerprints=$(sed -n 's/^[[:space:]]*SHA256: *//p' certs.txt | tr -d ':\r' | tr 'A-F' 'a-f' | sort -u)
          if [ "$fingerprints" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::$bundle is signed by '$fingerprints', not by the Nightjar release certificate"
            exit 1
          fi
      # Nothing after the build needs the key.
      - name: Remove the keystore
        run: rm -f "$RUNNER_TEMP/nightjar-release.keystore"
      - name: Fetch the desktop packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: desktop
          merge-multiple: true
      - name: Check the desktop packages
        run: |
          for file in "desktop/nightjar-desktop-$VERSION-linux-x86_64.tar.gz" "desktop/nightjar-desktop-$VERSION-windows-x86_64.zip"; do
            test -s "$file" || { echo "::error::$file is missing from the desktop artifacts"; exit 1; }
          done
          ls -l desktop
      - name: Publish to the release
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir out
          cp desktop/nightjar-desktop-* out/
          cp app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk "out/nightjar-$VERSION.apk"
          cp app/build/outputs/apk/root/release/app-root-release.apk "out/nightjar-$VERSION-root.apk"
          cp app/build/outputs/bundle/nonRootRelease/app-nonRoot-release.aab "out/nightjar-$VERSION.aab"
          # R8 map and native symbols of the non-root build, for reading this release's crash traces.
          cp app/build/outputs/mapping/nonRootRelease/mapping.txt "out/nightjar-$VERSION-mapping.txt"
          cp app/build/outputs/native-debug-symbols/nonRootRelease/native-debug-symbols.zip "out/nightjar-$VERSION-native-debug-symbols.zip"
          (cd out && sha256sum nightjar-* > "SHA256SUMS-$VERSION.txt")
          flags=()
          if [[ $VERSION == *-* ]]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # CI replaces assets only on a draft; a published release keeps what it has.
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ]; then
              clobber=(--clobber)
            else
              clobber=()
              existing=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
              for file in out/*; do
                if grep -qxF "$(basename "$file")" <<< "$existing"; then
                  echo "::error::$GITHUB_REF_NAME is published and already has $(basename "$file"). CI replaces assets only on a draft release: make it a draft first, or delete that asset by hand."
                  exit 1
                fi
              done
            fi
            gh release upload "$GITHUB_REF_NAME" out/* "${clobber[@]}"
            if [ "${#flags[@]}" != 0 ]; then gh release edit "$GITHUB_REF_NAME" "${flags[@]}"; fi
          else
            gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "Nightjar $VERSION" \
              --notes "Signed by CI with the Nightjar release key. SHA-256 hashes are in SHA256SUMS-$VERSION.txt." "${flags[@]}"
          fi
          echo "::notice::published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
      - name: Dry run result
        if: ${{ env.PUBLISH != 'true' }}
        run: echo "::notice::dry run of $VERSION built and verified (APKs, bundle, desktop client); nothing was published"
      # Fallback: the keystore is already gone after the build unless a step failed.
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nightjar-release.keystore"
