# Canonical declarative catalog of Nightjar client settings (Android + Desktop).
# Parsed with Python stdlib `tomllib` by `client/scripts/generate-settings.py`.
# Generates:
#   - `client/protocol/policy/src/settings_catalog_gen.rs`
#   - `client/protocol/desktop-config/src/config/defaults_gen.rs`
#   - `client/app/src/main/java/com/limelight/preferences/SettingsCatalogGen.java`
#   - `client/docs/settings.md` (between generated markers)

[constants]
guide_hold_ms = [0, 500, 1000, 1500, 2000]
default_guide_menu_hold_ms = 1000
display_scales = [0, 100, 125, 150, 175, 200, 225, 250, 300, 350, 400, 450, 500]
render_scale_min = 50
render_scale_max = 200
deadzone_min = 0
deadzone_max = 50
mic_gain_min = 25
mic_gain_max = 400
mic_gain_step = 5
ui_zoom_steps = [85, 100, 115, 130, 150, 200, 250]
error_correction_percentages = [10, 20, 30, 50]
decode_queue_frames_default = 15
quality_min_short_edges = [360, 540, 720, 1080, 1440]
quality_min_fps = [30, 45, 60, 90, 120]
network_grace_choices_s = [0, 15, 20, 30, 60]
sharp_color_desktop_keys = ["prefer_yuv444", "experimental_packed_444"]
sharp_color_android_keys = ["checkbox_yuv444", "experimental_packed_444"]
low_latency_decoding_android_keys = ["checkbox_codec_low_latency", "checkbox_vendor_low_latency", "checkbox_phone_performance_hints"]
removed_auto_bitrate_limit_android_keys = ["list_auto_bitrate_min_kbps", "list_auto_bitrate_max_kbps"]

[android]
small_icon_min_sw_dp = 500
default_touchscreen_trackpad = true

