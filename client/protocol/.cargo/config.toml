# RustCrypto's AES and GHASH use the ARMv8 crypto instructions only with these two flags. With
# them they still check the CPU at run time, so a CPU without the instructions stays on software.
# Without them every aarch64 build decrypts in software: 162 MB/s against 634 MB/s on a Retroid
# Pocket 6, on the same phones `has_fast_aes` asks the host to encrypt video for.
# nightjar-core refuses to build for aarch64 without them (client/src/crypto.rs).
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
rustdocflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
