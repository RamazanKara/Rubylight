override_allowed = false
android_key = "list_open_on_start"

[[desktop_setting]]
key = "console_home"
rust_type = "bool"
default_expr = "true"
scope = "global"
override_allowed = false
android_key = "checkbox_console_home"

[[desktop_setting]]
key = "simple_smoothness"
rust_type = "nightjar_policy::simple_profile::Smoothness"
default_expr = "nightjar_policy::simple_profile::Smoothness::Auto"
scope = "global"
override_allowed = false
android_key = "simple_smoothness"

[[desktop_setting]]
key = "simple_picture"
rust_type = "nightjar_policy::simple_profile::Picture"
default_expr = "nightjar_policy::simple_profile::Picture::Auto"
scope = "global"
override_allowed = false
android_key = "simple_picture"

[[desktop_setting]]
key = "simple_hdr"
rust_type = "nightjar_policy::simple_profile::Hdr"
default_expr = "nightjar_policy::simple_profile::Hdr::Auto"
scope = "global"
override_allowed = false
android_key = "simple_hdr"

