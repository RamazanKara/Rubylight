details = "While Copy and convert on a compute queue is in use (the default), NVENC encodes through Direct3D 12, which has no weighted prediction: the stream encodes without it and the log warns."
inactive_hint = "Applies when NVIDIA NVENC encodes, as Automatic does on NVIDIA graphics cards."
control = { kind = "toggle" }
visible_when = { ref = "nvenc" }
console = { group = "NVIDIA encoding", label = "Weighted prediction", control = "bool" }

