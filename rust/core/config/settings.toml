part = "basics_io"
type = "enum"
default = "system"
override_allowed = true
category = "audio"
group = "Sound"
label = "Audio to stream"
description = "System audio suits almost everyone. Game only streams the launched game alone, without browsers and notifications, but in stereo only and silent when the game cannot be verified."
details = "Reconnect to apply. Game only captures the launched game and its children. It requires a verified game process; when capture is unavailable, the stream sends silence with a session warning. Game only uses stereo and leaves the Windows default playback device unchanged: unless the device keeps sound on this PC, the game alone plays on the virtual speakers, and without virtual speakers it stays audible on this PC and the stream warns."
inactive_hint = "Turn on Stream audio to use this setting."
control = { kind = "select", options = [{ value = "system", label = "System audio (selected playback device)" }, { value = "game", label = "Game only" }] }
visible_when = { ref = "streamsAudio" }

[[setting]]
key = "audio_passthrough"
part = "basics_io"
type = "bool"
default = true
override_allowed = true
tier = "always-on"
category = "audio"
group = "Sound"
label = "PCM and Dolby Digital audio"
description = "Offers uncompressed PCM, Dolby Digital and Dolby Digital Plus to devices that ask for it, for TVs and receivers that decode it themselves; leave it on. Other devices keep Opus."
details = "PCM carries stereo up to 7.1.4 and takes about 1.5 Mbit/s per stereo pair. Dolby Digital and Dolby Digital Plus carry stereo and 5.1 in 32 ms frames, so their sound arrives a little later than Opus. A device that asks for a format this PC cannot encode is refused with the reason."
inactive_hint = "Turn on Stream audio to use this setting."
control = { kind = "toggle" }
visible_when = { ref = "streamsAudio" }
console = { group = "Audio", label = "PCM, Dolby Digital and Dolby Digital Plus audio", control = "bool" }
rust_accessor = { kind = "bool", method = "audio_passthrough", doc = "PCM, Dolby Digital (AC3) and Dolby Digital Plus (E-AC3) audio for clients that pick one (`audio_passthrough`, on by default)." }

