[workspace]
members = ["rust/core", "rust/core/native-api", "rust/windows", "rust/host", "rust/vulkan-layer", "rust/setup", "rust/drivers/rubylight-vdisplay-proto", "rust/probes"]
# The virtual display driver builds alone under the WDK toolchain: see rust/drivers/rubylight-vdisplay.
# Nightjar keeps its own workspace in client/protocol; the host uses its protocol crate by path.
# rust/vendor holds patched third-party crates, used through [patch.crates-io] below.
exclude = ["rust/drivers/rubylight-vdisplay", "client", "rust/vendor"]
resolver = "3"

# The host's ENet, changed as its Cargo.toml lists.
[patch.crates-io]
rusty_enet = { path = "rust/vendor/rusty_enet" }

[workspace.package]
version = "3.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/RamazanKara/Rubylight"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

# Nightjar pins the native API types by git rev for its own builds; the host's interop tests build
# it against this repository's copy, so both sides speak the same version.
[patch."https://github.com/RamazanKara/Rubylight"]
rubylight-native-api = { path = "rust/core/native-api" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Tests and clippy: line tables keep file:line in panics and backtraces of our
# crates; dependencies get no debug info. A cold host test build's target dir
# went from 25 to 10 GB. CI sets CARGO_PROFILE_DEV_DEBUG=0 on top; set it to
# full for a debugger session.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Every test host makes an RSA-2048 identity; unoptimized, its prime search
# took about 2 s of each reconnect test.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
