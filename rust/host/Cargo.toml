[package]
name = "butterpollo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tracing.workspace = true
log = "0.4"
butterpollo-core = { path = "../core" }
butterpollo-windows = { path = "../windows" }
tokio = { version = "1.48", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
# The USB tunnel's upgrade; already in the tree through axum and hyper-util.
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
rustls-webpki = { version = "0.103", default-features = false }
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
base64 = "0.22"
hex = "0.4"
zeroize = "1.8"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4"] }
url = "2.5"
libloading = "0.8"
socket2 = { version = "0.6", features = ["all"] }
rusty_enet = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
zip = { version = "4.6", default-features = false }
# The console's pairing QR code (Project Nayuki, MIT, no dependencies).
qrcodegen = "1.8"
tokio-util = { version = "0.7", features = ["io"] }
time = { version = "0.3", features = ["formatting"] }
mdns-sd = "=0.21.5"
igd-next = { version = "=0.17.1", default-features = false, features = ["aio_tokio"] }
if-addrs = "=0.15.0"
xmltree = "=0.10.3"
xml-rs = "0.8"
# WebRTC media transport (Sans-IO), see docs/webrtc-design.md. Exact pin: H.265 and AV1 are hidden API.
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
# File transfer tests open their folder as the developer.
butterpollo-windows = { path = "../windows", features = ["test-folder"] }
# Nightjar's client engine, for the interop tests against this host (stream/reconnect_tests/interop_tests.rs).
nightjar-core = { path = "../../client/protocol/client" }

[lints]
workspace = true
