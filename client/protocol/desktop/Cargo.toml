[package]
name = "nightjar-desktop"
description = "Nightjar desktop Moonlight-protocol game-streaming client for Windows, Linux and macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
# sdl3-sys needs 1.85, sonora 1.91, aarch64 NEON f16 intrinsics 1.94.
rust-version.workspace = true
publish = false

[[bin]]
name = "nightjar"
path = "src/main.rs"

[features]
default = []
# The Android demo's 36 games on the real launcher with no network and no host, driven from stdin
# for captures (ui/demo.rs). Never in a build that ships.
demo-library = ["nightjar-desktop-ui/demo-library", "nightjar-desktop-media/demo-library"]

[dependencies]
nightjar-desktop-config = { path = "../desktop-config" }
nightjar-desktop-ui = { path = "../desktop-ui" }
nightjar-desktop-media = { path = "../desktop-media" }
nightjar-core = { path = "../client" }
nightjar-policy = { path = "../policy" }
rubylight-protocol = { path = "../core" }
rubylight-traverse = { path = "../traverse" }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
# Finds a face by name in a system font collection (font_loader.rs); egui already builds on it.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg"] }
mdns-sd = { version = "0.21", default-features = false }
# Each adapter's broadcast and IPv6 link for Wake-on-LAN; mdns-sd builds on the same version.
if-addrs = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

# Windows links the SDL3 DLL found by pkg-config (MSYS2's mingw-w64-ucrt-x86_64-sdl3). Distros
# without an SDL3 package (Ubuntu 24.04) get SDL built from source and linked statically.
[target.'cfg(windows)'.dependencies]
sdl3-sys = { version = "0.7", default-features = false, features = ["use-pkg-config"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_Networking_WinHttp", "Win32_UI_WindowsAndMessaging"] }
# Screen readers (a11y.rs): egui's AccessKit tree through UI Automation on the SDL window.
accesskit_windows = "0.35"

[target.'cfg(target_os = "macos")'.dependencies]
sdl3-sys = { version = "0.7", default-features = false, features = ["use-pkg-config"] }
accesskit_macos = "0.27"
core-text = "22"
objc2-app-kit = { version = "0.2", default-features = false, features = ["NSWorkspace", "NSAccessibility"] }
objc2 = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
sdl3-sys = { version = "0.7", default-features = false, features = ["build-from-source-static"] }
zbus = { version = "5.19", default-features = false, features = ["tokio", "blocking-api"] }
# Screen readers (a11y.rs): egui's AccessKit tree over AT-SPI, on the tokio zbus above.
accesskit_unix = { version = "0.24", default-features = false, features = ["tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# The AppImage's update check and download (update_net.rs); Windows has WinHTTP.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
nightjar-desktop-config = { path = "../desktop-config", features = ["test-lang"] }
nightjar-desktop-ui = { path = "../desktop-ui", features = ["test-support"] }
nightjar-desktop-media = { path = "../desktop-media", features = ["test-support"] }

[build-dependencies]
# The Windows icon resource (build.rs); unused elsewhere.
embed-resource = "3.0.12"

[lints]
workspace = true
