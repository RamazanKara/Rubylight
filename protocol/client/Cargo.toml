[package]
name = "nightjar-core"
description = "Nightjar's client streaming engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rubylight-protocol = { path = "../core" }
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
rusty_enet = "0.4"

[dev-dependencies]
# The Rubylight host's own decoders, for interop tests.
butterpollo-core = { git = "https://github.com/RamazanKara/Rubylight", rev = "21c2940f", package = "butterpollo-core" }
