<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Rubylight 2.2.9 October 12 and historical Vibepollo 2.0 October 8 picture age under GPU load</title>
  <desc id="desc">Average and p95 rendered-picture-to-local-hardware-decode age in milliseconds. Rubylight 2.2.9 measurements are from October 12, 2026; Vibepollo 2.0 values are unchanged from October 8, 2026. Virtual HDR source: 1968×2184 at 120 Hz, 80 Mbps, DDX. The physical desktop changed from 2560×1440/120 Hz to 5120×1440/240 Hz. Noncontemporaneous measurements do not establish a matched relative improvement. HEVC: Rubylight mean 14.34, p95 16.03; Vibepollo mean 26.96, p95 37.62. AV1: Rubylight mean 13.65, p95 18.00; Vibepollo mean 24.53, p95 36.77.</desc>
  <style>
    text { font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #b8bdca; font-size: 17px; }
    .title { fill: #f4f3ee; font-size: 34px; font-weight: 600; }
    .panel { fill: #f4f3ee; font-size: 22px; font-weight: 600; }
    .codec { fill: #e3e5ea; font-size: 19px; font-weight: 600; }
    .value { fill: #f4f3ee; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .ruby .value { fill: #ff8aa8; }
    .tick { font-size: 15px; font-variant-numeric: tabular-nums; }
    .note { fill: #9aa0ad; font-size: 15px; }
    .grid { stroke: #262b36; stroke-width: 1; }
    .axis { stroke: #3a4050; stroke-width: 1.5; }
  </style>
  <rect width="1200" height="600" rx="14" fill="#101218"/>

  <text class="title" x="48" y="64">Picture age under GPU load</text>
  <text x="48" y="98">Virtual HDR source 1968×2184 · 120 fps · 80 Mbps · Radeon RX 7900 XT</text>
  <rect x="48" y="122" width="22" height="16" rx="3" fill="#ff406c"/>
  <text x="80" y="136" fill="#e3e5ea">Rubylight 2.2.9 · Oct 12, 2026</text>
  <rect x="352" y="122" width="22" height="16" rx="3" fill="#7e8596"/>
  <text x="384" y="136" fill="#e3e5ea">Vibepollo 2.0 · Oct 8, 2026</text>

  <!-- Bars: 9.5 px per millisecond; the panels start at x=140 and x=720. -->
  <g transform="translate(140 0)">
    <text class="panel" x="0" y="196">Average picture age</text>
    <g class="grid">
      <line x1="95" y1="214" x2="95" y2="396"/><line x1="190" y1="214" x2="190" y2="396"/>
      <line x1="285" y1="214" x2="285" y2="396"/><line x1="380" y1="214" x2="380" y2="396"/>
    </g>
    <line class="axis" x1="0" y1="214" x2="0" y2="396"/>
    <text class="codec" x="-14" y="262" text-anchor="end">HEVC</text>
    <text class="codec" x="-14" y="358" text-anchor="end">AV1</text>
    <g class="ruby">
      <rect x="0" y="224" width="136.2" height="28" rx="3" fill="#ff406c"/>
      <text class="value" x="146" y="244">14.34</text>
      <rect x="0" y="320" width="129.7" height="28" rx="3" fill="#ff406c"/>
      <text class="value" x="140" y="340">13.65</text>
    </g>
    <rect x="0" y="258" width="256.1" height="28" rx="3" fill="#7e8596"/>
    <text class="value" x="266" y="278">26.96</text>
    <rect x="0" y="354" width="233.0" height="28" rx="3" fill="#7e8596"/>
    <text class="value" x="243" y="374">24.53</text>
    <g class="tick" text-anchor="middle">
      <text x="0" y="420">0</text><text x="95" y="420">10</text><text x="190" y="420">20</text>
      <text x="285" y="420">30</text><text x="380" y="420">40</text>
    </g>
    <text x="190" y="448" text-anchor="middle">Milliseconds · lower is better</text>
  </g>

  <g transform="translate(720 0)">
    <text class="panel" x="0" y="196">95th percentile (p95)</text>
    <g class="grid">
      <line x1="95" y1="214" x2="95" y2="396"/><line x1="190" y1="214" x2="190" y2="396"/>
      <line x1="285" y1="214" x2="285" y2="396"/><line x1="380" y1="214" x2="380" y2="396"/>
    </g>
    <line class="axis" x1="0" y1="214" x2="0" y2="396"/>
    <text class="codec" x="-14" y="262" text-anchor="end">HEVC</text>
    <text class="codec" x="-14" y="358" text-anchor="end">AV1</text>
    <g class="ruby">
      <rect x="0" y="224" width="152.3" height="28" rx="3" fill="#ff406c"/>
      <text class="value" x="162" y="244">16.03</text>
      <rect x="0" y="320" width="171.0" height="28" rx="3" fill="#ff406c"/>
      <text class="value" x="181" y="340">18.00</text>
    </g>
    <rect x="0" y="258" width="357.4" height="28" rx="3" fill="#7e8596"/>
    <text class="value" x="367" y="278">37.62</text>
    <rect x="0" y="354" width="349.3" height="28" rx="3" fill="#7e8596"/>
    <text class="value" x="359" y="374">36.77</text>
    <g class="tick" text-anchor="middle">
      <text x="0" y="420">0</text><text x="95" y="420">10</text><text x="190" y="420">20</text>
      <text x="285" y="420">30</text><text x="380" y="420">40</text>
    </g>
    <text x="190" y="448" text-anchor="middle">Milliseconds · lower is better</text>
  </g>

  <text class="note" x="48" y="494">DDX · 60 fps-capped synthetic GPU load · means of two per-run statistics for each codec.</text>
  <text class="note" x="48" y="518">Rendered picture → local hardware decode. Excludes remote network and display time.</text>
  <text class="note" x="48" y="542">Physical desktop: 5120×1440 / 240 Hz now; 2560×1440 / 120 Hz historically.</text>
  <text class="note" x="48" y="566">Different measurement dates; competitor results unchanged. Source: rust/PERFORMANCE_WORK.md</text>
</svg>
