group = "Streamed display"
label = "Rotation"
description = "The angle the streamed display turns to, clockwise; a virtual display is made in that shape. A streamed monitor shows its picture turned by it until the stream ends."
inactive_hint = "Set Rotate the display to Choose below to apply this angle."
part_of = "dd_rotation_option"
control = { kind = "select", options_ref = "rotations" }
visible_when = { str_trim_eq = "dd_rotation_option", default = "", value = "manual" }
rust_accessor = { kind = "set_int", method = "dd_manual_rotation", ret = "u16", allowed = [0, 90, 180, 270], doc = "`dd_manual_rotation`: 0 (the default), 90, 180 or 270 degrees clockwise." }

[[setting]]
key = "nucleus_path"
part = "extensions"
type = "string"
default = ""
settings_30 = true
settings_30_default = ""
category = "library"
group = "Play together"
label = "Nucleus Co-op folder"
description = "The folder you unpacked Nucleus Co-op 2.4.2 into, under C:\\Program Files; co-op and background streaming need it. Empty uses an earlier Rubylight's install, if any."
details = "Checked as it is saved, as on a game's Play together panel; a folder Nucleus Co-op can't run from is refused with the reason."
control = { kind = "text", placeholder = "C:\\Program Files\\Nucleus Co-op", mono = true, browse = "directory" }
rust_accessor = { kind = "opt_path", method = "nucleus_path", doc = "The Nucleus Co-op folder: `nucleus_path`, or None for an earlier Rubylight's install, if any." }

[[setting]]
key = "nucleus_coop_players"
part = "extensions"
type = "int"
default = 4
settings_30 = true
settings_30_default = "4"
category = "library"
group = "Play together"
label = "Co-op players"
description = "The most players a Nucleus co-op session gets, 1 to 4; each player runs their own instance of the game on this PC. The game's handler and the free controller slots can allow fewer."
control = { kind = "number", min = 1, max = 4, step = 1 }
rust_accessor = { kind = "ranged_int", method = "nucleus_coop_players", ret = "u32", min = 1, max = 4, doc = "The most players a co-op session gets (1 to 4, 4 by default)." }

