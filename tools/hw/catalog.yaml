# Hardware test cases. tools/hw/run.ps1 -Batch <device> runs every ready case
# of one device in a row after its precondition checks and collects the
# results into C:\src\butterpollo-release\hw\<date>\<device>\<id>\ with a
# summary.md. Prove what you can with unit, fake-device and interop tests
# first; a case here is only for what needs the hardware.
#
# Fields:
#   id             unique, used with -Only
#   device         desktop (this PC) | laptop (ramaz@192.168.4.12) | nuc (ssh nuc)
#                  | retroid (adb) | user (the user runs it: steps, never run)
#   title          one line
#   command        PowerShell, run from the repository root on this PC (remote
#                  devices through ssh). {{name}} takes vars below, -Var name=value,
#                  {{out}} (the case's output dir) or {{repo}} (the checkout).
#   preconditions  checked on this PC before the case, in this order:
#                    idle            serverinfo session counts 0 (or no host), no
#                                    input for 10 minutes, no fullscreen app
#                    isolated-ports  nothing listens on 48123 or 48518-48544
#                    system          the ButterpolloReleaseElevated task exists
#                                    (rust/release/elevation.ps1) for SYSTEM steps
#                    gpu-lock        C:\src\butterpollo-release\GPU-LOCK is free;
#                                    the batch holds it until it ends
#   pass           what passing means. The verdict is the exit code (0 passes,
#                  3 is an AMD encoder hang and stops the batch) unless
#                  verdict: review (a person reads the output against `pass`).
#   pass_regex     optional: the output must also match it
#   output         where the command writes its results
#   collect        optional: more paths or globs copied into the case dir
#                  (screenshots, overlay stats, logs outside {{out}})
#   status         ready (default) or pending: no runnable command yet, or it
#                  needs a branch that is not on main. Batches skip pending
#                  cases; -Only <id> runs one anyway.
#   note           optional
vars:
  python: python
  release: 3.0.0-rc.3
  package: C:\src\butterpollo-release\{{release}}\release\butterpollo-rust-release
  fixtures: C:\src\butterpollo-release\fixtures
  laptop: ramaz@192.168.4.12

cases:
  - id: e2e-hevc
    device: desktop
    title: Packaged host streams HEVC to the independent moonlight-common-c receiver (12 s)
    command: '& {{python}} rust\release\e2e.py --package {{package}} --work {{out}} --client {{fixtures}}\moonlight-client.exe --codec hevc --seconds 12'
    preconditions: [idle, isolated-ports, gpu-lock]
    pass: exit 0, result.json passed; exit 3 is an encoder hang
    output: '{{out}}\e2e-*\result.json'

  - id: e2e-av1-1440p120
    device: desktop
    title: AV1 at 2560x1440, 120 FPS through the packaged host (12 s)
    command: '& {{python}} rust\release\e2e.py --package {{package}} --work {{out}} --client {{fixtures}}\moonlight-client.exe --codec av1 --mode 2560x1440x120 --seconds 12'
    preconditions: [idle, isolated-ports, gpu-lock]
    pass: exit 0, result.json passed
    output: '{{out}}\e2e-*\result.json'

  - id: release-check
    device: desktop
    title: rust/release/check.ps1 on the published release (download, streams, protocol, SYSTEM self-test, install)
    command: 'pwsh -NoProfile -File rust\release\check.ps1 v{{release}} -NoUpload; exit $LASTEXITCODE'
    preconditions: [idle, isolated-ports, system, gpu-lock]
    pass: exit 0 and VALIDATION.json all passed; installs over the running host, so only with the host idle
    output: C:\src\butterpollo-release\{{release}}\VALIDATION.json and e2e-*\result.json
    collect:
      - C:\src\butterpollo-release\{{release}}\VALIDATION.json
      - C:\src\butterpollo-release\{{release}}\e2e-*\result.json

  - id: soak-short
    device: desktop
    title: Isolated stream, reconnect and fault checks, short mode (25 s cases)
    command: 'pwsh -NoProfile -File rust\release\soak.ps1 -Mode short -Package {{package}} -Client {{fixtures}}\moonlight-client.exe -GpuLoad {{fixtures}}\gpu_load.exe -Work {{out}}; exit $LASTEXITCODE'
    preconditions: [idle, isolated-ports, gpu-lock]
    pass: exit 0 (PASS or LIMITED); soak.py skips the remaining cases after an encoder hang
    output: '{{out}}\<UTC time>\result.json'

  - id: soak-30min
    device: desktop
    title: 30-minute release candidate soak, HEVC 2560x1440 at 120 FPS on one stream
    command: '& {{python}} rust\release\e2e.py --package {{package}} --work {{out}} --client {{fixtures}}\moonlight-client.exe --codec hevc --mode 2560x1440x120 --seconds 1800 --name soak-30min'
    preconditions: [idle, isolated-ports, gpu-lock]
    pass: exit 0 after 1800 s, no hang; the stream timings stay flat over the run
    output: '{{out}}\e2e-soak-30min\result.json'

  - id: browser-e2e
    device: desktop
    title: Browser streaming end to end from the web console (WebRTC)
    command: 'powershell -NoProfile -ExecutionPolicy Bypass -File C:\src\butterpollo-release\train\handoff\b1-e2e.ps1 -Name hw-browser'
    preconditions: [idle, gpu-lock]
    pass: prints EXITCODE 0 (the script itself exits 0, or 9 when its idle check fails)
    pass_regex: '(?m)^EXITCODE 0\s*$'
    output: C:\tests\webrtc\runs\hw-browser, screenshot C:\src\rl-b1-stream.png
    collect:
      - C:\tests\webrtc\runs\hw-browser
      - C:\src\rl-b1-stream.png
    note: paths in b1-e2e.ps1 are fixed to the B1 worktree and the 3.0.0-rc.2 package

  - id: browser-e2e-off
    device: desktop
    title: Web console screenshots with browser streaming turned off
    command: 'powershell -NoProfile -ExecutionPolicy Bypass -File C:\src\butterpollo-release\train\handoff\b1-e2e.ps1 -Mode off'
    preconditions: [idle]
    pass: prints EXITCODE 0
    pass_regex: '(?m)^EXITCODE 0\s*$'
    output: C:\src\rl-b1-stream*.png
    collect:
      - C:\src\rl-b1-stream*.png

  - id: issue56-exclusive-layout
    device: desktop
    title: 'Issue #56: exclusive layout stream plus a Windows layout recall on an isolated host'
    command: 'Write-Error "not scripted yet: see note"; exit 1'
    preconditions: [idle, isolated-ports, system, gpu-lock]
    pass: the stream starts on the exclusive layout, the physical displays come back after the stream, and after a Windows layout recall (Win+P Extend) the host recovers normally with no stuck virtual display
    output: '{{out}}'
    status: pending
    note: isolated host (butterpollo.exe --config-dir C:\tests\i56 --port 48123 --bind 127.0.0.1, virtual_display_layout = exclusive, virtual display as SYSTEM through rust/release/elevated.ps1); then ask the 9070 XT reporter to confirm on #56

  - id: virtual-hdr-calibration
    device: desktop
    title: Windows HDR Calibration carried to the virtual display of an HDR stream (virtual_display_hdr_calibration)
    command: 'Write-Error "not scripted yet: see note"; exit 1'
    preconditions: [idle, isolated-ports, system, gpu-lock]
    pass: with a calibration on the physical HDR display, the host log names the profile and display and the virtual display carries that profile during the stream and its previous one after it; with no calibration, the log warns once and the stream runs
    output: '{{out}}'
    status: pending
    note: this PC has no calibration yet (run the Windows HDR Calibration app on the HDR display first, as the user). Isolated host as SYSTEM through rust/release/elevated.ps1 (--config-dir C:\tests\hdrcal --port 48123 --bind 127.0.0.1, virtual_display_hdr_calibration = true, virtual_display_layout = extended), one short HDR stream; read the association before, during and after with ColorProfileGetDisplayList. It checks that the SYSTEM host reads the user's calibration while impersonating them

  - id: sleep-evidence
    device: nuc
    title: Sleep PC from a client, then wake this PC from the NUC (Wake-on-LAN)
    command: 'Write-Error "not scripted yet: see note"; exit 1'
    preconditions: [idle]
    pass: the System log shows Kernel-Power 42 (sleep) then 107 (resume) and the NUC's magic packet woke it; the host serves serverinfo again after resume
    output: '{{out}}\sleep-evidence.txt (wevtutil qe System for Kernel-Power 42/107/1, powercfg /lastwake)'
    status: pending
    note: needs a reboot-safe window (nothing in flight); the laptop has Modern Standby only and cannot be the sleeper

  - id: couch-audio-71
    device: desktop
    title: Couch audio 7.1 tone test (headphone surround on and off, night mode on and off)
    command: |
      $t = 'C:\tests\audio-h2\tools'
      $arms = @(
        @("$t\h2-arm8.ps1", '-Name', 'surround-on8', '-Pattern', 'sweep', '-Config', 'audio_headphone_surround=on'),
        @("$t\h2-arm8.ps1", '-Name', 'surround-off8', '-Pattern', 'sweep'),
        @("$t\h2-arm.ps1", '-Name', 'night-on', '-Pattern', 'levels', '-Config', 'audio_night_mode=on'),
        @("$t\h2-arm.ps1", '-Name', 'night-off', '-Pattern', 'levels'))
      foreach ($arm in $arms) {
        $script, $rest = $arm
        & $script @rest
        if ($LASTEXITCODE -eq 3) { exit 3 }
      }
      $d = '{{repo}}\rust\core\src\audio_dsp'
      foreach ($arm in 'surround-on8', 'surround-off8') {
        & {{python}} "$t\tone_analysis.py" sweep "C:\tests\audio-h2\e2e-$arm" "$d\hrir_sadie2_ku100_48k.bin" "$d\hrir_sadie2_ku100_48k.json"
      }
      foreach ($arm in 'night-on', 'night-off') { & {{python}} "$t\tone_analysis.py" levels "C:\tests\audio-h2\e2e-$arm" }
    preconditions: [idle, isolated-ports, gpu-lock]
    verdict: review
    pass: surround-on8 log has "headphone surround active (8 to 2)", channels 8 mask 0x63f, every row heard and ok (ILD within 2 dB, ITD within 2 samples); latency median within 1 ms of surround-off8; night-on range_db clearly below night-off (about 34 dB). Expected e2e failures "receiver interoperability failed" and "the captured audio tone was silent or interrupted" only
    output: C:\tests\audio-h2\e2e-{surround-on8,surround-off8,night-on,night-off}
    collect:
      - C:\tests\audio-h2\e2e-surround-on8\result.json
      - C:\tests\audio-h2\e2e-surround-off8\result.json
      - C:\tests\audio-h2\e2e-night-on\result.json
      - C:\tests\audio-h2\e2e-night-off\result.json
      - C:\tests\audio-h2\e2e-surround-on8\config\logs\butterpollo.log
    status: pending
    note: needs the audio-h2 branch (audio_dsp and webrtc_tone in C:\src\rl-target-audio); run with -Var repo=<audio-h2 worktree>

  - id: audio-bench
    device: desktop
    title: Audio bench rerun on a quiet PC
    command: 'Write-Error "not scripted yet: see note"; exit 1'
    preconditions: [idle, gpu-lock]
    pass: the bench numbers match the audio-h2 branch's claims within their noise
    output: '{{out}}'
    status: pending
    note: no bench command is written down yet (HANDOFF-rubylight.md mentions only "the audio bench rerun on a quiet PC")

  - id: encoder-focus-amf-quality
    device: desktop
    title: Encoder focus, amf_quality --focus static for 60 s
    command: 'cargo +1.98.1-x86_64-pc-windows-gnu run --release -p butterpollo-windows --example amf_quality -- --codec hevc --width 1920 --height 1080 --fps 120 --bitrate 20000 --frames 7200 --focus static --out {{out}}\amf_quality.json; exit $LASTEXITCODE'
    preconditions: [idle, gpu-lock]
    pass: exit 0, focus_maps > 0 and the first map under the cap in the amf_quality JSON line and the "encoder focus check:" log
    output: '{{out}}\amf_quality.json'
    status: pending
    note: --focus exists only on the encoder-focus branch; run from that worktree with -Var repo=<worktree>

  - id: encoder-focus-ab
    device: desktop
    title: Encoder focus A/B, 10 minutes of ABBA legs through focus_ab
    command: '& {{python}} rust\release\focus_ab.py --package {{package}} --client {{fixtures}}\moonlight-client.exe --minutes 10 --work {{out}}'
    preconditions: [idle, isolated-ports, gpu-lock]
    pass: B (focus on) no worse than A on latency and frame pacing, better on the focused region quality; keep only if better (revert otherwise)
    output: '{{out}}\result.json'
    status: pending
    note: focus_ab.py does not exist yet (docs/encoder-focus-design.md); align it with the config key first

  - id: r1-throttle-ab
    device: desktop
    title: R1 throttle A/B, reconnects with and without the change, ABBA legs on an isolated host
    command: 'Write-Error "not scripted yet: see note"; exit 1'
    preconditions: [idle, isolated-ports, gpu-lock]
    verdict: review
    pass: B no worse than A on reconnect to first frame, picture age p99 and the 5 s stream timings lines over at least 4 legs of 10 reconnects; keep B only if better, revert otherwise
    output: '{{out}}'
    status: pending
    note: the handoffs (HANDOFF-unified.md 1.1 item 7, HANDOFF-rubylight.md follow-ups) name only "R1 throttle A/B". The nearest R1 is issue 24's "R1 reconnect GPU scheduling" (rust/PERFORMANCE_WORK.md), which has no switch to A/B; define the arms and a toggle, then script it on the e2e.py reconnect path

  - id: couch-menu-stream
    device: user
    title: Couch menu, a real stream with the menu open
    command: 'stream Desktop from a phone, open the couch menu with its chord and hold, use each entry, close it'
    preconditions: [idle]
    pass: the menu opens and closes without a stall; the stream timings lines around it stay at their normal values
    output: the host log's stream timings lines (read after the user's run)
    status: pending
    note: the WIP is on the couch-menu branch (a9e2fb927); run last in its batch

  - id: audio-passthrough-tv
    device: user
    title: Audio passthrough to the TCL C6K and its receiver or soundbar (AC3, E-AC3, PCM)
    command: 'Nightjar Android on the TV, Settings > Audio: Audio passthrough on, New streaming engine; stream Desktop at 5.1 with a 5.1 test clip on the PC, then again with the soundbar or receiver on HDMI ARC and on the TV speakers'
    preconditions: [idle]
    pass: the receiver or soundbar shows Dolby Digital or Dolby Digital Plus (or the TV its Dolby badge), every channel plays from its speaker, no drop-outs over 5 minutes; the TV speakers alone get PCM or Opus with the message saying why
    output: 'Nightjar''s "Audio output: ... passthrough" log line and the host log around the stream (read after the user''s run)'
    status: pending
    note: Experimental until this passes; see user-tests.md audio-passthrough-tv. Lip sync against Opus is the format's 32 ms frames plus the sink's own decode buffer

  - id: audio-passthrough-desktop-pcm
    device: desktop
    title: Nightjar desktop with Audio passthrough on streams PCM from an isolated host (45 s)
    command: 'Write-Error "not scripted yet: see note"; exit 1'
    preconditions: [idle, isolated-ports, gpu-lock]
    verdict: review
    pass: 'host log "audio passthrough codec=\"PCM\" channels=2 packet_ms=5", client log "nightjar: audio: PCM passthrough, 2 channels, 5 ms packets" and "Received first audio packet", the overlay''s Audio line shows a buffer and no underruns or dropped packets, no ERROR lines, no AMF call over 2 s'
    output: '{{out}}'
    status: pending
    note: 'Passed 2026-10-27 on rl-pass 81cd50383 (release host and nightjar.exe from that tree, host on 127.0.0.1:48123 with the Steam Streaming Speakers sink and a tone, NIGHTJAR_AUTOSTREAM, settings.json audio_passthrough and overlay on): PCM stereo 5 ms packets on both ends, overlay "stereo, 25 ms buffered", 5120x1440 HEVC at 77-218 fps, encode mean 5.5-6.1 ms, no errors. Scripts in C:\src\butterpollo-release\unified\scratch\pass3 (run_desktop.ps1, profile.py, pin.py); script it here once rl-pass is on main. 5.1 and 7.1 PCM not run'

  - id: audio-passthrough-retroid
    device: retroid
    title: Nightjar Android with Audio passthrough on, on a device whose output plays no passthrough format
    command: 'Write-Error "not scripted yet: see note"; exit 1'
    preconditions: [idle, gpu-lock]
    verdict: review
    pass: 'Nightjar logs "Audio passthrough: the audio output plays no passthrough format with 2 channels; this stream plays Opus" and shows that message, the host log has no "audio passthrough" line (Opus), audio plays; or, if the output plays one unmixed, "Audio output: <codec> passthrough" and the host''s "audio passthrough codec=..." agree and audio plays'
    output: '{{out}}'
    status: pending
    note: 'Not run: on 2026-10-27 the Retroid answered ping at 192.168.4.107 but had no adb (no USB, no open TCP port). Needs the host bound to the PC''s LAN address on a test port and a firewall allow for the staged exe; steps in C:\src\butterpollo-release\unified\hw-queue.md (E3 passthrough)'

  - id: smoke-laptop
    device: laptop
    title: Real-client smoke from the laptop (Moonlight-qt, AV1 and HEVC, 1968x2184 HDR 120 fps, 30 s each)
    command: |
      ssh {{laptop}} "New-Item -ItemType Directory -Force C:\tests\hw | Out-Null"
      scp rust\release\smoke.ps1 "{{laptop}}:C:/tests/hw/smoke.ps1"
      if ($LASTEXITCODE) { exit 1 }
      ssh {{laptop}} "pwsh -NoProfile -File C:\tests\hw\smoke.ps1 -Out C:\tests\hw\smoke.json"
      $code = $LASTEXITCODE
      scp "{{laptop}}:C:/tests/hw/smoke.json" "{{out}}\smoke.json"
      exit $code
    preconditions: [idle]
    pass: exit 0, at least 115 fps received and host processing under 5 ms per codec (smoke.json)
    output: '{{out}}\smoke.json'
    note: no -Version, so nothing is uploaded to the release

  - id: net-fec-auto-nuc
    device: nuc
    title: 'A/B under loss: the host''s adaptive FEC against FEC from the client''s loss reports (rlFecPercentage=auto), NUC wifi arms'
    command: |
      & {{python}} rust\release\linkspeed.py run wifi wifi@2 wifi@3 wifi-hi wifi-hi@2 wifi-hi@3 --work {{out}}\host --package {{package}}
      if ($LASTEXITCODE) { exit $LASTEXITCODE }
      $env:LINKSPEED_CLIENT_FEC = 'auto'
      & {{python}} rust\release\linkspeed.py run wifi wifi@2 wifi@3 wifi-hi wifi-hi@2 wifi-hi@3 --work {{out}}\auto --package {{package}}
      if ($LASTEXITCODE) { exit $LASTEXITCODE }
      & {{python}} rust\release\linkspeed.py compare {{out}}\host {{out}}\auto --repeats 3
      exit $LASTEXITCODE
    preconditions: [idle, gpu-lock]
    pass: compare PASSes (picture age p50 within 0.3 ms, p99 within 1 ms of the host arm) and the auto arms have no more fec_unrecoverable_frames, freezes or IDR requests than the host arms. Keep auto as Nightjar's default only if it is better or equal; otherwise Nightjar keeps host
    output: '{{out}}\host\results.jsonl, {{out}}\auto\results.jsonl'
    note: needs an elevated shell (linkspeed adds a firewall rule). The log line "client fec choice" confirms the auto arm. 2026-10-27 (rl-net 8aab90708): auto better on every count, wifi PASS, wifi-hi FAIL only on the no-change rule (5 change lines); median loss 2.37 → 0.26 %, freezes 21 → 1. fec_unrecoverable_frames is not reported. Default stays host until a real Wi-Fi phone run (rust/PERFORMANCE.md)

  - id: net-fec-split-nuc
    device: nuc
    title: 'A/B under loss: a fixed client FEC share inside the video budget (rlFecPercentage=20) against the host''s 20 % on top of it, NUC wifi-hi'
    command: |
      & {{python}} rust\release\linkspeed.py run wifi-hi wifi-hi@2 wifi-hi@3 --work {{out}}\host --package {{package}} --config fec_percentage=20 --config adaptive_fec=false
      if ($LASTEXITCODE) { exit $LASTEXITCODE }
      $env:LINKSPEED_CLIENT_FEC = '20'
      & {{python}} rust\release\linkspeed.py run wifi-hi wifi-hi@2 wifi-hi@3 --work {{out}}\split --package {{package}} --config fec_percentage=20 --config adaptive_fec=false
      if ($LASTEXITCODE) { exit $LASTEXITCODE }
      & {{python}} rust\release\linkspeed.py compare {{out}}\host {{out}}\split --repeats 3
      exit $LASTEXITCODE
    preconditions: [idle, gpu-lock]
    pass: compare PASSes and the split arms lose no more frames than the host arms; their wire rate stays within the requested bitrate where the host arms exceed it by the FEC share. Keep the split only if better or equal
    output: '{{out}}\host\results.jsonl, {{out}}\split\results.jsonl'
    note: needs an elevated shell, as net-fec-auto-nuc. 2026-10-27 (rl-net 8aab90708) FAIL, the split measured worse (median loss 1.26 against 0.74 %, p50 +1.72 ms, p99 +3.27 ms); not a default

  - id: net-bandwidth-probe-nuc
    device: nuc
    title: First bitrate from GET /bandwidth-probe against the configured bitrate on a 50 Mbit/s link (NUC)
    command: |
      & {{python}} rust\release\linkspeed.py run r50-hevc-hi r50-hevc-hi@2 r50-hevc-hi@3 --work {{out}}\configured --package {{package}}
      if ($LASTEXITCODE) { exit $LASTEXITCODE }
      $env:LINKSPEED_CLIENT_PROBE = '1'
      & {{python}} rust\release\linkspeed.py run r50-hevc-hi r50-hevc-hi@2 r50-hevc-hi@3 --work {{out}}\probe --package {{package}}
      if ($LASTEXITCODE) { exit $LASTEXITCODE }
      & {{python}} rust\release\linkspeed.py compare {{out}}\configured {{out}}\probe --repeats 3
      exit $LASTEXITCODE
    preconditions: [idle, gpu-lock]
    pass: compare PASSes and the probe arms lose less in their first 5 s (loss_first5s_percent) than the configured arms, with a mean encoder bitrate no lower than 90 % of theirs. Keep the probe for the first bitrate only if better or equal
    output: '{{out}}\configured\results.jsonl, {{out}}\probe\results.jsonl'
    note: needs an elevated shell, as net-fec-auto-nuc; the host log line for the probe request and the client's chosen bitrate confirm the probe arm. 2026-10-27 (rl-net 8aab90708) compare PASS but the case fails its encoder rule (28-30 against 59 Mbps mean; first bitrate 36.5-38.4 of 75) with more loss and freezes; loss_first5s_percent is not reported. The probe measured worse

  - id: net-fec-auto-retroid
    device: retroid
    title: 'A/B on real Wi-Fi: Nightjar on the Retroid with error correction Host against Auto (60 s each, HEVC 1080p60, 40 Mbps)'
    command: 'Write-Error "not scripted yet: see note"; exit 1'
    preconditions: [idle, gpu-lock]
    pass: over three 60 s runs per arm, Auto has no more unrecoverable frames, IDR requests or freezes than Host (host log "stream timings" and fec counters) and its host processing stays within 0.3 ms. Keep Auto as the default only if better or equal
    output: '{{out}}\host-*.log, {{out}}\auto-*.log (host log excerpts), {{out}}\nightjar-*.txt (overlay stats)'
    status: pending
    note: needs the Nightjar error-correction setting (Host, Auto, percentage) and the 0x5539 sender. Steps through adb, one arm at a time with the device about 8 m and one wall from the access point; read "client fec choice" and the 5 s "stream timings" lines from the host log after each run
