rust_accessor = { kind = "enum_ci", method = "updates", ret = "UpdatesMode", variants = [["off", "UpdatesMode::Off"], ["tell_me", "UpdatesMode::TellMe"], ["install", "UpdatesMode::Install"]], doc = "Updates: `off`, `tell_me` (default) or `install`." }

[[setting]]
key = "update_check_interval"
