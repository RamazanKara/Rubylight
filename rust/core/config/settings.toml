category = "display"
group = "Remote monitors"
label = "Remove remote monitor"
description = "When a remote monitor (an extra screen for this PC) is removed: never, when its stream ends, or when the device disconnects. Never lets the device resume where it was."
details = "When its stream ends removes the remote monitor from Windows when the stream finishes, so the device can still resume but the display does not stay behind. As soon as the device disconnects removes it even while it was kept for resuming. Never keeps it until the next stream ends, so a dropped device leaves its display behind."
control = { kind = "select", options = [{ value = "never", label = "Never" }, { value = "stream_end", label = "When its stream ends" }, { value = "disconnect", label = "As soon as the device disconnects" }] }
doc_default = "`never`"
console = { group = "Remote monitors", label = "Remove remote monitor (never: keep it for resuming; stream_end: when its stream ends; disconnect: as soon as the device disconnects)", control = "choice", choices = ["never", "stream_end", "disconnect"] }
rust_accessor = { kind = "enum_ci", method = "remove_remote_monitor", ret = "RemoveRemoteMonitor", variants = [["never", "RemoveRemoteMonitor::Never"], ["stream_end", "RemoveRemoteMonitor::StreamEnd"], ["disconnect", "RemoveRemoteMonitor::Disconnect"]], doc = "When a remote monitor is removed from Windows: `never` (default), `stream_end` or `disconnect`." }

[[setting]]
