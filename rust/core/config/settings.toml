group = "Playnite"
label = "Playnite fullscreen app"
description = "Adds a “Playnite (Fullscreen)” app that opens Playnite’s fullscreen mode, for choosing a game on the device."
inactive_hint = "Turn on Playnite to use this setting. The Rubylight plugin must be installed in Playnite."
control = { kind = "toggle" }
visible_when = { ref = "playnite" }

[[setting]]
key = "playnite_exit_wait_secs"
part = "library"
type = "int"
default = 15
advanced = true
category = "library"
group = "Playnite"
label = "Wait after a game closes"
description = "After a game closes, the stream shows the desktop this long, then ends. Lower it to leave sooner; too low can end it while a game restarts itself or starts through a launcher."
details = "A game that restarts itself, or starts through a launcher, is briefly reported closed, and a shorter wait can end its stream then; raise it if a stream ends while a game is still starting. 0 ends the stream at once. Counts from when Playnite reports the game closed and none of its programs is running. This is not the exit timeout, which is how long a game gets to close when Rubylight ends it. 0 to 300 seconds. Applies to the next game started."
inactive_hint = "Turn on Playnite to use this setting. The Rubylight plugin must be installed in Playnite."
control = { kind = "number", min = 0, max = 300, step = 1, unit = "s" }
visible_when = { ref = "playnite" }

[[setting]]
key = "playnite_focus_attempts"
part = "library"
type = "int"
default = 3
override_allowed = true
advanced = true
category = "library"
group = "Playnite launch focus"
label = "Confirm game focus"
description = "Puts a launched game or Playnite menu in front, so input reaches it, until confirmed there this many times. Lower it if that interrupts you; a launcher may then take focus back."
details = "0 leaves focus alone. After launch, Rubylight checks once a second and brings the game or Playnite fullscreen menu to the front until it has been confirmed in front this many times. Launchers and splash screens take the front back while a game starts, so one confirmation is not always enough."
inactive_hint = "Turn on Playnite to use its launch focus settings."
control = { kind = "number", min = 0, step = 1 }
visible_when = { ref = "playnite" }

[[setting]]
key = "playnite_focus_timeout_secs"
part = "library"
type = "int"
default = 15
override_allowed = true
advanced = true
category = "library"
group = "Playnite launch focus"
label = "Stop focusing after"
description = "The longest Rubylight keeps bringing a launched game or Playnite menu to the front. Raise it if a slow launch leaves the game behind another window; 0 leaves focus alone."
details = "0 leaves focus alone, even when Confirm game focus is above 0. Applies to a launched game and to the Playnite fullscreen menu; Rubylight checks once a second until this time is over."
inactive_hint = "Turn on Playnite to use its launch focus settings."
control = { kind = "number", min = 0, step = 1, unit = "s" }
visible_when = { ref = "playnite" }

[[setting]]
key = "playnite_focus_exit_on_first"
part = "library"
type = "bool"
default = false
override_allowed = true
advanced = true
category = "library"
group = "Playnite launch focus"
label = "Stop after the first focus confirmation"
description = "Stops focusing the game or Playnite menu once it was confirmed in front. Turn it on if launches keep interrupting your window; a launcher or splash screen may then take focus back."
inactive_hint = "Confirm game focus or Stop focusing after is 0, so launches are not focused. Turn on Playnite and set both above 0 to use this setting."
control = { kind = "toggle" }
visible_when = { all = [{ ref = "playnite" }, { gt = "playnite_focus_attempts", default = 3, value = 0 }, { gt = "playnite_focus_timeout_secs", default = 15, value = 0 }] }

[[setting]]
key = "library_local_folders"
part = "library"
type = "list"
default = []
category = "library"
group = "Game folders"
label = "Game folders"
description = "Folders that hold one game per subfolder, such as D:\\Games, for games no launcher lists. Each subfolder joins the library with the program that starts it."
details = "Installers, uninstallers, redistributables, crash reporters and updaters are skipped, and programs more than two folders down are not read. A game a launcher already lists is shown under that launcher."
control = { kind = "list", placeholder = "D:\\Games" }

[[setting]]
key = "library_local_exclude"
part = "library"
type = "list"
default = []
category = "library"
group = "Game folders"
label = "Folders to leave out"
description = "Subfolders to skip in your game folders, by name (Tools) or full path (D:\\Games\\Tools). They are never added, and Add games never lists them."
inactive_hint = "Add a game folder to use this setting."
control = { kind = "list", placeholder = "Tools" }
visible_when = { ref = "folders" }

[[setting]]
key = "steamgriddb_api_key"
part = "library"
type = "string"
default = ""
category = "library"
group = "Covers"
label = "SteamGridDB API key"
description = "Fetches a SteamGridDB cover for each app without one, shown in Moonlight and every app; the key and those apps’ names go to SteamGridDB. Set it if apps show a blank cover."
details = "Paste the API key from your SteamGridDB account’s preferences. An app is looked up by its Steam app ID when it has one, otherwise by its name, and a name that matches no game gets no cover. Covers you chose and launcher covers are never replaced, a launcher’s cover found later replaces it, and a cover you clear is not put back. The key is kept where only administrators can read it, is never shown again or logged, and a settings backup holds it only with secrets. Emptied, no more covers are fetched; those already fetched stay."
control = { kind = "text", placeholder = "Not set", mono = true }
doc_default = "none"

[[setting]]
key = "lossless_scaling_path"
part = "library"
type = "string"
default = ""
category = "library"
group = "Lossless Scaling"
label = "Lossless Scaling program"
description = "LosslessScaling.exe or its folder, for apps that use Lossless Scaling. Leave it empty unless it is not found: empty finds it in Steam libraries and the usual folders."
control = { kind = "text", placeholder = "Found automatically", mono = true, browse = "executable" }

[[setting]]
key = "lossless_scaling_legacy_auto_detect"
part = "library"
type = "bool"
default = false
category = "library"
group = "Lossless Scaling"
label = "Let Lossless Scaling start by itself"
description = "Lossless Scaling starts scaling by itself (auto scale) and keeps its window open, instead of Rubylight pressing its hotkey. Try it if scaling does not start; apps can override it."
details = "Off, Rubylight minimizes the Lossless Scaling window, brings the game to the front and presses the hotkey set in Lossless Scaling, up to three times. Each app can choose its own under Lossless Scaling."
control = { kind = "toggle" }

[[setting]]
key = "guest_join"
part = "library"
type = "enum"
default = "off"
category = "library"
group = "Play together"
label = "When another device joins the running game"
description = "Whether a paired device that joins your running game becomes a guest with limited control. Off suits one person with several devices; Ask the player lets you approve each guest."
details = "Off streams it beside the game with the device’s own permissions and asks nobody, as before guests. Ask the player: the device playing, or the console’s stream card, answers within 45 seconds, and no answer refuses the join; a Moonlight client that gives up sooner shows its own timeout. Let in without asking admits it at once. A guest gets the same picture and sound with its own stream and controller, and only what its guest permission allows."
control = { kind = "select", options = [{ value = "off", label = "Off, stream beside the game" }, { value = "ask", label = "Ask the player" }, { value = "allow", label = "Let in without asking" }] }
caution_when = { when = { str_trim_eq = "guest_join", default = "", value = "allow" }, message = "A paired device that joins becomes a guest at once; nobody is asked." }
doc_summary = "Whether a paired device that resumes the game another device plays joins as a guest, and whether the player lets it in first. Off streams it beside the game, as before guests."
console = { group = "App behavior", label = "Another device joining the running game (default off)", control = "choice", choices = ["off", "ask", "allow"] }

[[setting]]
key = "guest_permission"
part = "library"
type = "enum"
default = "controller"
category = "library"
group = "Play together"
label = "What a guest may do"
description = "What a guest may do unless the player chooses otherwise for that guest. Controller suits playing together; Controller, keyboard and mouse also lets a guest operate this PC."
details = "View only: picture and sound. Controller: a controller of its own, as the next player. Controller, keyboard and mouse: also the keyboard and mouse, one holder at a time, and the clipboard, USB devices and microphone where its device may use them."
control = { kind = "select", options = [{ value = "view", label = "View only" }, { value = "controller", label = "Controller" }, { value = "controller-keyboard-mouse", label = "Controller, keyboard and mouse" }] }
visible_when = { str_trim_neq = "guest_join", default = "off", value = "off" }
console = { group = "App behavior", label = "What a guest may do", control = "choice", choices = ["view", "controller", "controller-keyboard-mouse"] }

[[setting]]
