<!doctype html><meta charset="utf-8"><title>Nightjar desktop PCs</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="glass.css"><script src="lib.js"></script><body><script>
const card = (name, state, sub, action, { art, hover } = {}) => `<div class="group" style="flex:none;width:384px;border-radius:var(--radius-panel);background:var(--tint-groupOnSky-fill);${hover ? 'transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.4);' : ''}">
  <div class="press" style="height:216px;display:flex;flex-direction:column;padding:22px;border-radius:var(--radius-panel);${hover ? 'background:var(--hover-fillLift);' : ''}">
    <div style="display:flex;gap:18px;align-items:center">
      ${pcScreen(name, { state, w: 132, art })}
      <div style="flex:1;min-width:0">
        <div class="t-section">${name}</div>
        <div class="t-body ${state === 'online' ? '' : 'sec'} num" style="display:flex;align-items:center;gap:8px;margin-top:4px;font-size:15px">${state === 'online' ? '<span class="dot"></span>' : state === 'offline' ? '<span class="dot off"></span>' : icon('lock', 15)}${sub}</div>
      </div>
    </div>
    <div style="margin-top:auto;display:flex;gap:10px;align-items:center">${action}</div>
  </div></div>`;
const more = `<button class="ctl round press" style="margin-left:auto">${icon('more', 22)}</button>`;
mount(`
${nightSky({ x: 1040, y: 520, r: 118, w: 1280, h: 800 })}
<div style="position:absolute;left:48px;right:48px;top:20px;display:flex;align-items:center;gap:14px;z-index:6">
  <div style="display:flex;align-items:center;gap:10px;font:600 19px/24px Figtree;margin-right:6px">${mark(30)}Nightjar</div>
  ${capsuleNav(1, { h: 48 })}
  <div style="flex:1"></div>
  ${glass('chrome', { style: 'border-radius:24px;height:48px' }, `<button class="press" style="height:48px;display:flex;align-items:center;gap:8px;padding:0 20px 0 16px;border-radius:24px;font:600 15px/20px Figtree">${icon('plus', 19, 2.2)}Add PC</button>`)}
</div>
<div class="t-large" style="position:absolute;left:48px;top:90px">PCs</div>
<div style="position:absolute;left:48px;top:150px;width:1184px;display:flex;flex-wrap:wrap;gap:16px">
  ${card('Living-room PC', 'online', 'Racing Game', `<button class="play press" style="height:48px;padding:0 24px;font-size:16px">${icon('play', 19)}Resume</button>${more}`, { art: 'racing-game' })}
  ${card('Studio PC', 'online', 'Online, 12 ms', `<button class="ctl press">${icon('grid', 18)}Open</button>${more}`, { hover: true })}
  ${card('Bedroom PC', 'online', 'Online, 6 ms', `<button class="ctl press">${icon('grid', 18)}Open</button>${more}`)}
  ${card('Office PC', 'offline', 'Offline', `<button class="ctl press fx">${icon('power', 18)}Wake</button>${more}`)}
  ${card('Game-room PC', 'unpaired', 'Not paired', `<button class="ctl press" style="color:var(--color-moonInk)">Pair</button>${more}`)}
</div>
`, { w: 1280, h: 800 });
</script></body>
