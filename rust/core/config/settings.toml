inactive_hint = "Choose Tell me or Install automatically under Updates to use this setting."
control = { kind = "number", min = 3600, step = 1, unit = "s", presets = [{ value = 21600, label = "Every 6 hours" }, { value = 86400, label = "Daily" }, { value = 604800, label = "Weekly" }], daily = { key = "update_check_time", label = "Daily at a set time" } }
visible_when = { text_neq = "updates", default = "tell_me", value = "off" }
doc_summary = "How often Rubylight looks for a new release, or daily at a set time; Daily suits almost everyone. Shown unless Updates is Off."
console = { group = "Network, administration and commands", label = "Check for updates every (seconds, at least 3600; a daily time replaces it while set)", control = "number" }

